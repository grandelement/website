<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GE DJ</title>
<style>
html,body{margin:0;min-height:100%;background:#03070b;color:#fff;font-family:Arial,Helvetica,sans-serif}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}
.box{width:100%;max-width:420px;border:1px solid #355064;border-radius:14px;padding:18px;background:#071018;box-sizing:border-box}
h1{margin:0 0 8px;font-size:26px}.small{font-size:13px;color:#91a1ac;line-height:1.4}
</style>
</head>
<body>
<div class="wrap"><div class="box"><h1>GE DJ</h1><div class="small" id="state">Checking this device and opening the correct DJ version…</div></div></div>
<script>
(function(){
  var ua=String(navigator.userAgent||'');
  var ios=ua.match(/(?:CPU (?:iPhone )?OS|iPhone OS) (\d+)[_\.](\d+)/i);
  var iosMajor=ios?parseInt(ios[1],10):0;
  var legacy=!!(iosMajor&&iosMajor<=12);
  var modernSyntax=true;
  try{
    new Function('async function f(){const x={a:{b:1}};return x?.a?.b;}');
  }catch(e){modernSyntax=false;}
  var modernApis=!!(window.Promise&&window.fetch&&window.JSON&&document.querySelector);
  var target=(legacy||!modernSyntax||!modernApis)?'/dj-lite/':'/dj-modern/';
  var state=document.getElementById('state');
  if(state)state.innerHTML=(target==='/dj-lite/'?'Older Safari detected · opening GE DJ LITE…':'Opening GE DJ…');
  try{window.location.replace(target+'?auto=1&t='+(new Date().getTime()));}
  catch(e){window.location.href=target;}
})();
</script>
</body>
</html>
