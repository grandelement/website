<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Grand Element</title>

<link rel="preload" as="image" href="/ge-images/images/favicon-square.jpg">
<link rel="preload" as="image" href="/ge-images/images/stars%20backgrounds/2.jpg">

<style>
:root{
  --gateFade:.78s;
  --journey:5.6s;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
}
#site{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  border:0;
  background:#000;
  z-index:0;
}
#gate{
  position:fixed;
  inset:0;
  z-index:10;
  overflow:hidden;
  background:#000 url("/ge-images/images/stars%20backgrounds/2.jpg") center/cover no-repeat;
  opacity:1;
  transition:opacity var(--gateFade) ease;
  touch-action:manipulation;
}
#gate::after{
  content:"";
  position:absolute;
  inset:0;
  background:radial-gradient(circle at 50% 50%,
    rgba(15,120,255,.035) 0%,
    rgba(0,0,0,.06) 48%,
    rgba(0,0,0,.28) 100%);
  pointer-events:none;
}
#sunWrap{
  position:absolute;
  left:50%;
  top:50%;
  width:min(50vmin,430px);
  aspect-ratio:1;
  transform:translate(-50%,-50%) scale(.76);
  transform-origin:50% 50%;
  opacity:0;
  will-change:transform,opacity,filter;
  z-index:2;
}
#sun{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:50%;
  box-shadow:
    0 0 26px rgba(0,210,255,.56),
    0 0 74px rgba(0,110,255,.32);
  user-select:none;
  -webkit-user-drag:none;
}
#gate.go #sunWrap{
  animation:enterSun var(--journey) linear forwards;
}
#gate.done{
  opacity:0;
  pointer-events:none;
}
@keyframes enterSun{
  /* Stars only */
  0%{
    transform:translate(-50%,-50%) scale(.76);
    opacity:0;
    filter:brightness(.96) saturate(1);
  }
  23%{
    transform:translate(-50%,-50%) scale(.76);
    opacity:0;
    filter:brightness(.96) saturate(1);
  }

  /* Sun fades in, almost no forward motion yet */
  36%{
    transform:translate(-50%,-50%) scale(.79);
    opacity:1;
    filter:brightness(1) saturate(1);
  }

  /* Very slow initial throttle */
  50%{
    transform:translate(-50%,-50%) scale(.86);
    opacity:1;
    filter:brightness(1.02) saturate(1.02);
  }
  63%{
    transform:translate(-50%,-50%) scale(1.04);
    opacity:1;
    filter:brightness(1.05) saturate(1.04);
  }

  /* Acceleration builds */
  75%{
    transform:translate(-50%,-50%) scale(1.55);
    opacity:1;
    filter:brightness(1.09) saturate(1.06);
  }
  85%{
    transform:translate(-50%,-50%) scale(2.75);
    opacity:1;
    filter:brightness(1.18) saturate(1.08);
  }
  93%{
    transform:translate(-50%,-50%) scale(4.9);
    opacity:1;
    filter:brightness(1.34) saturate(1.05);
  }

  /* Final burst through the sun */
  100%{
    transform:translate(-50%,-50%) scale(8.4);
    opacity:0;
    filter:brightness(1.8) saturate(.78) blur(2px);
  }
}
@media (prefers-reduced-motion:reduce){
  #sunWrap{
    opacity:1;
    transform:translate(-50%,-50%) scale(.86);
  }
  #gate.go #sunWrap{animation:none}
}
</style>
</head>

<body>
<iframe id="site" src="/" title="Grand Element website"></iframe>

<div id="gate" aria-label="Entering Grand Element" role="button" tabindex="0">
  <div id="sunWrap">
    <img id="sun" src="/ge-images/images/favicon-square.jpg" alt="Grand Element">
  </div>
</div>

<script>
(function(){
  const gate = document.getElementById('gate');
  const frame = document.getElementById('site');

  let animationFinished = false;
  let siteReady = false;
  let leaving = false;

  function begin(){
    requestAnimationFrame(() => requestAnimationFrame(() => gate.classList.add('go')));
  }

  function reveal(){
    if(leaving) return;
    if(!animationFinished || !siteReady) return;

    leaving = true;
    gate.classList.add('done');

    setTimeout(() => {
      try { location.replace('/'); } catch(e) {}
    }, 880);
  }

  function skip(){
    if(leaving) return;
    animationFinished = true;
    siteReady = true;
    reveal();
  }

  frame.addEventListener('load', () => {
    siteReady = true;
    reveal();
  }, {once:true});

  gate.addEventListener('animationend', (e) => {
    if(e.animationName === 'enterSun'){
      animationFinished = true;
      reveal();
    }
  });

  gate.addEventListener('click', skip);
  gate.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' || e.key === ' '){
      e.preventDefault();
      skip();
    }
  });

  // Failsafe: never leave someone stuck on the transition.
  setTimeout(() => {
    siteReady = true;
    animationFinished = true;
    reveal();
  }, 7600);

  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    animationFinished = true;
    setTimeout(reveal, 900);
  } else {
    begin();
  }
})();
</script>
</body>
</html>
