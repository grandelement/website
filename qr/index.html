<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Grand Element</title>

<link rel="preload" as="image" href="/ge-images/images/favicon-square.jpg">
<link rel="preload" as="image" href="/ge-images/images/GE%20stars.jpg">

<style>
:root{
  --fade: .72s;
  --zoom: 3.35s;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
}
#site{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  border:0;
  background:#000;
  z-index:0;
}
#gate{
  position:fixed;
  inset:0;
  z-index:10;
  overflow:hidden;
  background:#000 url("/ge-images/images/GE%20stars.jpg") center/cover no-repeat;
  opacity:1;
  transition:opacity var(--fade) ease;
  touch-action:manipulation;
}
#gate::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 50% 50%, rgba(20,160,255,.09), rgba(0,0,0,.16) 45%, rgba(0,0,0,.72) 100%);
  pointer-events:none;
}
#sunWrap{
  position:absolute;
  left:50%;
  top:50%;
  width:min(52vmin, 430px);
  aspect-ratio:1;
  transform:translate(-50%,-50%) scale(.92);
  transform-origin:50% 50%;
  will-change:transform,opacity,filter;
  z-index:2;
}
#sun{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:50%;
  box-shadow:
    0 0 28px rgba(0,210,255,.60),
    0 0 80px rgba(0,120,255,.34);
  user-select:none;
  -webkit-user-drag:none;
}
#gate.go #sunWrap{
  animation:enterSun var(--zoom) cubic-bezier(.42,0,.18,1) forwards;
}
#gate.done{
  opacity:0;
  pointer-events:none;
}
@keyframes enterSun{
  0%{
    transform:translate(-50%,-50%) scale(.92);
    opacity:1;
    filter:brightness(1) saturate(1);
  }
  42%{
    transform:translate(-50%,-50%) scale(1.28);
    opacity:1;
    filter:brightness(1.08) saturate(1.05);
  }
  82%{
    transform:translate(-50%,-50%) scale(4.4);
    opacity:1;
    filter:brightness(1.32) saturate(1.12);
  }
  100%{
    transform:translate(-50%,-50%) scale(7.2);
    opacity:0;
    filter:brightness(1.8) saturate(.75) blur(2px);
  }
}
#hint{
  position:absolute;
  left:50%;
  bottom:max(22px, env(safe-area-inset-bottom));
  transform:translateX(-50%);
  z-index:3;
  color:rgba(255,255,255,.62);
  font:12px/1.2 Arial,sans-serif;
  letter-spacing:.14em;
  text-transform:uppercase;
  opacity:0;
  animation:hintIn .5s ease 1s forwards;
}
@keyframes hintIn{to{opacity:.72}}
@media (prefers-reduced-motion:reduce){
  #gate.go #sunWrap{animation:none}
  #sunWrap{transform:translate(-50%,-50%) scale(1)}
}
</style>
</head>

<body>
<iframe id="site" src="/" title="Grand Element website"></iframe>

<div id="gate" aria-label="Entering Grand Element" role="button" tabindex="0">
  <div id="sunWrap">
    <img id="sun" src="/ge-images/images/favicon-square.jpg" alt="Grand Element">
  </div>
  <div id="hint">tap to enter</div>
</div>

<script>
(function(){
  const gate = document.getElementById('gate');
  const frame = document.getElementById('site');

  let animationFinished = false;
  let siteReady = false;
  let leaving = false;

  function begin(){
    requestAnimationFrame(() => requestAnimationFrame(() => gate.classList.add('go')));
  }

  function reveal(){
    if(leaving) return;
    if(!animationFinished || !siteReady) return;
    leaving = true;
    gate.classList.add('done');

    // The real homepage has already loaded behind the animation.
    // Let the user see that seamless reveal, then promote it to the top window.
    setTimeout(() => {
      try { location.replace('/'); } catch(e) {}
    }, 850);
  }

  function skip(){
    if(leaving) return;
    animationFinished = true;
    siteReady = true;
    reveal();
  }

  frame.addEventListener('load', () => {
    siteReady = true;
    reveal();
  }, {once:true});

  gate.addEventListener('animationend', (e) => {
    if(e.animationName === 'enterSun'){
      animationFinished = true;
      reveal();
    }
  });

  gate.addEventListener('click', skip);
  gate.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' || e.key === ' '){
      e.preventDefault();
      skip();
    }
  });

  // Never trap someone on the transition if the homepage loads slowly.
  setTimeout(() => {
    siteReady = true;
    reveal();
  }, 5200);

  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    animationFinished = true;
    setTimeout(reveal, 450);
  } else {
    begin();
  }
})();
</script>
</body>
</html>
