<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Grand Element</title>

<link rel="preload" as="image" href="/ge-images/images/favicon-square.jpg">
<link rel="preload" as="image" href="/ge-images/images/stars%20backgrounds/4.jpg">

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
}
#site{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  border:0;
  background:#000;
  z-index:0;
}
#gate{
  position:fixed;
  inset:0;
  z-index:10;
  overflow:hidden;
  background:#000 url("/ge-images/images/stars%20backgrounds/4.jpg") center/cover no-repeat;
  opacity:1;
  transition:opacity .78s ease;
  touch-action:manipulation;
}
#gate::after{
  content:"";
  position:absolute;
  inset:0;
  background:radial-gradient(circle at 50% 50%,
    rgba(15,120,255,.035) 0%,
    rgba(0,0,0,.06) 48%,
    rgba(0,0,0,.28) 100%);
  pointer-events:none;
}
#sunWrap{
  position:absolute;
  left:50%;
  top:50%;
  width:min(50vmin,430px);
  aspect-ratio:1;
  transform:translate(-50%,-50%) scale(.76);
  transform-origin:50% 50%;
  opacity:0;
  will-change:transform,opacity,filter;
  z-index:2;
}
#sun{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:50%;
  box-shadow:
    0 0 26px rgba(0,210,255,.56),
    0 0 74px rgba(0,110,255,.32);
  user-select:none;
  -webkit-user-drag:none;
}
#gate.done{
  opacity:0;
  pointer-events:none;
}
@media (prefers-reduced-motion:reduce){
  #sunWrap{
    opacity:1 !important;
    transform:translate(-50%,-50%) scale(.86) !important;
    filter:none !important;
  }
}
</style>
</head>

<body>
<iframe id="site" src="/" title="Grand Element website"></iframe>

<div id="gate" aria-label="Entering Grand Element" role="button" tabindex="0">
  <div id="sunWrap">
    <img id="sun" src="/ge-images/images/favicon-square.jpg" alt="Grand Element">
  </div>
</div>

<script>
(function(){
  const gate = document.getElementById('gate');
  const frame = document.getElementById('site');
  const sunWrap = document.getElementById('sunWrap');

  let siteReady = false;
  let animationFinished = false;
  let leaving = false;
  let rafId = 0;
  let startTime = 0;

  const STARS_ONLY = 1300;
  const FADE_IN = 1200;
  const ZOOM_START = 1900;
  const ZOOM_TIME = 5000;
  const TOTAL = ZOOM_START + ZOOM_TIME;

  const START_SCALE = 0.76;
  const END_SCALE = 8.4;
  const SCALE_RATIO = END_SCALE / START_SCALE;

  function clamp01(v){
    return Math.max(0, Math.min(1, v));
  }

  function smoothstep(t){
    t = clamp01(t);
    return t * t * (3 - 2 * t);
  }

  function finish(){
    animationFinished = true;
    reveal();
  }

  function reveal(){
    if(leaving || !animationFinished || !siteReady) return;
    leaving = true;
    gate.classList.add('done');

    setTimeout(() => {
      try { location.replace('/'); } catch(e) {}
    }, 820);
  }

  function draw(now){
    if(!startTime) startTime = now;
    const elapsed = now - startTime;

    // Stars remain alone first. Then the sun fades in smoothly.
    let opacity = 0;
    if(elapsed > STARS_ONLY){
      opacity = smoothstep((elapsed - STARS_ONLY) / FADE_IN);
    }

    // One continuous mathematical acceleration curve.
    // No stepped keyframes, so there are no speed jumps.
    let scale = START_SCALE;
    let brightness = 1;
    let saturation = 1;
    let blur = 0;

    if(elapsed >= ZOOM_START){
      const p = clamp01((elapsed - ZOOM_START) / ZOOM_TIME);

      // Exponential distance curve with a smooth throttle ramp:
      // almost stationary at first, continuously accelerating to the end.
      const throttle = p * p * (3 - 2 * p);
      const accelerated = Math.pow(throttle, 2.15);

      scale = START_SCALE * Math.pow(SCALE_RATIO, accelerated);

      brightness = 1 + 0.72 * Math.pow(p, 2.5);
      saturation = 1 + 0.08 * smoothstep(p);

      // Fade only during the final approach.
      if(p > 0.88){
        const q = smoothstep((p - 0.88) / 0.12);
        opacity *= (1 - q);
        blur = 2.2 * q;
      }
    }

    sunWrap.style.opacity = opacity.toFixed(4);
    sunWrap.style.transform =
      'translate(-50%,-50%) scale(' + scale.toFixed(5) + ')';
    sunWrap.style.filter =
      'brightness(' + brightness.toFixed(3) + ') saturate(' +
      saturation.toFixed(3) + ') blur(' + blur.toFixed(2) + 'px)';

    if(elapsed < TOTAL){
      rafId = requestAnimationFrame(draw);
    }else{
      finish();
    }
  }

  function skip(){
    if(leaving) return;
    if(rafId) cancelAnimationFrame(rafId);
    animationFinished = true;
    siteReady = true;
    reveal();
  }

  frame.addEventListener('load', () => {
    siteReady = true;
    reveal();
  }, {once:true});

  gate.addEventListener('click', skip);
  gate.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' || e.key === ' '){
      e.preventDefault();
      skip();
    }
  });

  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    animationFinished = true;
    setTimeout(reveal, 900);
  }else{
    rafId = requestAnimationFrame(draw);
  }

  // Failsafe only.
  setTimeout(() => {
    if(leaving) return;
    siteReady = true;
    animationFinished = true;
    reveal();
  }, TOTAL + 2200);
})();
</script>
</body>
</html>
