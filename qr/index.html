<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Grand Element</title>

<link rel="preload" as="image" href="/ge-images/images/favicon-square.jpg">
<link rel="preload" as="image" href="/ge-images/images/stars%20backgrounds/4.jpg">
<link rel="prefetch" href="/">

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
}
#gate{
  position:fixed;
  inset:0;
  z-index:10;
  overflow:hidden;
  background:#000 url("/ge-images/images/stars%20backgrounds/4.jpg") center/cover no-repeat;
  opacity:1;
  transition:opacity .82s ease;
  touch-action:manipulation;
}
#gate::after{
  content:"";
  position:absolute;
  inset:0;
  background:radial-gradient(circle at 50% 50%,
    rgba(15,120,255,.03) 0%,
    rgba(0,0,0,.05) 52%,
    rgba(0,0,0,.26) 100%);
  pointer-events:none;
}
#sunWrap{
  position:absolute;
  left:50%;
  top:50%;
  width:min(50vmin,430px);
  aspect-ratio:1;
  transform:translate(-50%,-50%) scale(.76);
  transform-origin:50% 50%;
  opacity:0;
  will-change:transform,opacity,filter;
  z-index:2;
}
#sun{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:50%;
  box-shadow:
    0 0 26px rgba(0,210,255,.56),
    0 0 74px rgba(0,110,255,.32);
  user-select:none;
  -webkit-user-drag:none;
}
#gate.done{
  opacity:0;
  pointer-events:none;
}
@media (prefers-reduced-motion:reduce){
  #sunWrap{
    opacity:1 !important;
    transform:translate(-50%,-50%) scale(.86) !important;
    filter:none !important;
  }
}
</style>
</head>

<body>
<div id="gate" aria-label="Entering Grand Element" role="button" tabindex="0">
  <div id="sunWrap">
    <img id="sun" src="/ge-images/images/favicon-square.jpg" alt="Grand Element">
  </div>
</div>

<script>
(function(){
  const gate = document.getElementById('gate');
  const sunWrap = document.getElementById('sunWrap');

  let leaving = false;
  let rafId = 0;
  let startTime = 0;

  // Timing:
  // 0 - 3.5s: stars only
  // 3.5 - 5.2s: sun fades in while stationary
  // 5.2 - 11.2s: one continuous accelerating zoom
  // final 0.8s: gate fades away and the homepage loads once
  const STARS_ONLY = 3500;
  const FADE_IN = 1700;
  const ZOOM_START = STARS_ONLY + FADE_IN;
  const ZOOM_TIME = 6000;
  const TOTAL = ZOOM_START + ZOOM_TIME;

  const START_SCALE = 0.76;
  const END_SCALE = 8.5;
  const SCALE_RATIO = END_SCALE / START_SCALE;

  function clamp01(v){
    return Math.max(0, Math.min(1, v));
  }

  function smoothstep(t){
    t = clamp01(t);
    return t * t * (3 - 2 * t);
  }

  function goHome(){
    if(leaving) return;
    leaving = true;
    gate.classList.add('done');

    setTimeout(() => {
      location.replace('/');
    }, 820);
  }

  function draw(now){
    if(!startTime) startTime = now;
    const elapsed = now - startTime;

    let opacity = 0;
    let scale = START_SCALE;
    let brightness = 1;
    let saturation = 1;
    let blur = 0;

    // Fade the sun in only after the stars have been visible for 3.5 seconds.
    if(elapsed >= STARS_ONLY){
      opacity = smoothstep((elapsed - STARS_ONLY) / FADE_IN);
    }

    // Do not move at all until the fade-in is complete.
    if(elapsed >= ZOOM_START){
      const p = clamp01((elapsed - ZOOM_START) / ZOOM_TIME);

      // A single continuous acceleration curve.
      // p^3 keeps the opening movement very slow, then ramps harder and harder.
      const accelerated = Math.pow(p, 3.0);

      scale = START_SCALE * Math.pow(SCALE_RATIO, accelerated);
      brightness = 1 + 0.72 * Math.pow(p, 2.6);
      saturation = 1 + 0.08 * smoothstep(p);

      // Only fade away during the final rush.
      if(p > 0.90){
        const q = smoothstep((p - 0.90) / 0.10);
        opacity *= (1 - q);
        blur = 2.2 * q;
      }
    }

    sunWrap.style.opacity = opacity.toFixed(4);
    sunWrap.style.transform =
      'translate(-50%,-50%) scale(' + scale.toFixed(5) + ')';
    sunWrap.style.filter =
      'brightness(' + brightness.toFixed(3) + ') saturate(' +
      saturation.toFixed(3) + ') blur(' + blur.toFixed(2) + 'px)';

    if(elapsed < TOTAL){
      rafId = requestAnimationFrame(draw);
    }else{
      goHome();
    }
  }

  function skip(){
    if(leaving) return;
    if(rafId) cancelAnimationFrame(rafId);
    goHome();
  }

  gate.addEventListener('click', skip);
  gate.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' || e.key === ' '){
      e.preventDefault();
      skip();
    }
  });

  // Warm the homepage document in cache without executing its scripts or audio.
  try{
    fetch('/', {method:'GET', cache:'force-cache', credentials:'same-origin'});
  }catch(e){}

  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    setTimeout(goHome, 1200);
  }else{
    rafId = requestAnimationFrame(draw);
  }

  // Failsafe only.
  setTimeout(goHome, TOTAL + 2500);
})();
</script>
</body>
</html>
