<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Grand Element Radio</title>

<link rel="preload" as="image" href="../../ge-images/images/favicon-square.jpg">
<link rel="preload" as="image" href="../../ge-images/images/ge-radio-logo.png">
<link rel="preload" as="image" href="../../ge-images/images/stars%20backgrounds/4.jpg">

<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;background:#000;
  -webkit-tap-highlight-color:transparent
}
#site{
  position:fixed;inset:0;width:100%;height:100%;border:0;background:#000;z-index:0;
  opacity:0;transform:translate3d(0,0,0) scale(1.012);
  transition:opacity 2.8s ease,transform 3.2s cubic-bezier(.2,.72,.18,1);
  will-change:opacity,transform;backface-visibility:hidden;-webkit-backface-visibility:hidden
}
#site.reveal{opacity:1;transform:translate3d(0,0,0) scale(1)}

#gate{
  position:fixed;inset:0;z-index:10;overflow:hidden;background:#000;
  opacity:1;transition:opacity 1.8s ease;touch-action:manipulation;isolation:isolate
}
#gate.done{opacity:0;pointer-events:none}

#space{
  position:absolute;inset:-7%;z-index:0;
  background:#000 url("../../ge-images/images/stars%20backgrounds/4.jpg") center/cover no-repeat;
  transform:translate3d(0,0,0) scale(1.06);will-change:transform,opacity;backface-visibility:hidden;-webkit-backface-visibility:hidden
}
#spaceShade{
  position:absolute;inset:0;z-index:1;pointer-events:none;
  background:
    radial-gradient(circle at 53% 50%,rgba(31,136,255,.09),transparent 34%),
    radial-gradient(circle at 50% 50%,transparent 0 50%,rgba(0,0,0,.34) 100%);
}
#streaks{
  position:absolute;inset:-20%;z-index:2;opacity:0;pointer-events:none;
  background:
    repeating-conic-gradient(from 0deg at 50% 50%,
      rgba(198,241,255,0) 0deg,
      rgba(198,241,255,.18) .18deg,
      rgba(198,241,255,0) .42deg,
      rgba(198,241,255,0) 5.5deg);
  opacity:0;
  transform:translate3d(0,0,0) scale(.72);transform-origin:50% 50%;will-change:transform,opacity;
  backface-visibility:hidden;-webkit-backface-visibility:hidden
}

#sunWrap,#moonWrap{
  position:absolute;left:50%;top:50%;aspect-ratio:1;border-radius:50%;
  transform-origin:50% 50%;will-change:transform,opacity,filter
}
#sunWrap{
  z-index:5;width:min(50vmin,430px);
  transform:translate(-50%,-50%) scale(.76);opacity:0
}
#sun{
  width:100%;height:100%;display:block;object-fit:cover;border-radius:50%;
  box-shadow:
    0 0 28px rgba(66,218,255,.82),
    0 0 90px rgba(0,137,255,.55),
    0 0 170px rgba(0,92,255,.28);
  user-select:none;-webkit-user-drag:none
}
#sunFlare{
  position:absolute;inset:-18%;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(98,224,255,.20),rgba(0,135,255,.06) 48%,transparent 72%);
  mix-blend-mode:screen
}

#moonWrap{
  z-index:4;width:min(29vmin,255px);
  transform:translate3d(-50%,-50%,0) scale(.18);opacity:0;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;transform-style:preserve-3d
}
#moon{
  width:100%;height:100%;display:block;object-fit:cover;border-radius:50%;
  box-shadow:
    0 0 18px rgba(80,210,255,.22),
    0 0 55px rgba(20,121,255,.12);
  user-select:none;-webkit-user-drag:none
}
#moonHalo{
  position:absolute;inset:-9%;border-radius:50%;pointer-events:none;opacity:.45;
  border:1px solid rgba(147,231,255,.22);
  box-shadow:0 0 24px rgba(76,198,255,.16)
}

#vignette{
  position:absolute;inset:0;z-index:8;pointer-events:none;
  background:radial-gradient(circle at center,transparent 0 52%,rgba(0,0,0,.28) 78%,rgba(0,0,0,.72) 100%);
  opacity:.75;will-change:opacity
}
#whiteout{
  position:absolute;inset:0;z-index:9;pointer-events:none;background:#dff8ff;opacity:0;
  mix-blend-mode:screen;will-change:opacity
}
#soundHint{
  position:absolute;z-index:12;left:50%;bottom:max(22px,env(safe-area-inset-bottom));
  transform:translateX(-50%);padding:8px 13px;border-radius:999px;
  color:#dff8ff;background:rgba(3,17,30,.62);border:1px solid rgba(142,225,255,.30);
  font:800 10px/1 system-ui;letter-spacing:.08em;opacity:0;pointer-events:none;
  transition:opacity .45s ease;white-space:nowrap
}
#soundHint.show{opacity:.82}

@media(prefers-reduced-motion:reduce){
  #streaks{display:none}
  #sunWrap{opacity:.7!important;transform:translate3d(-50vw,0,0) scale(1.4)!important}
  #moonWrap{opacity:1!important;transform:translate3d(0,0,0) scale(1)!important}
}
</style>
</head>

<body>
<iframe id="site" src="../../radio/?qr=1" title="Grand Element Radio" allow="autoplay"></iframe>

<div id="gate" aria-label="Entering Grand Element Radio" role="button" tabindex="0">
  <div id="space"></div>
  <div id="spaceShade"></div>
  <div id="streaks"></div>

  <div id="moonWrap" aria-hidden="true">
    <div id="moonHalo"></div>
    <img id="moon" src="../../ge-images/images/ge-radio-logo.png" alt="">
  </div>

  <div id="sunWrap" aria-hidden="true">
    <div id="sunFlare"></div>
    <img id="sun" src="../../ge-images/images/favicon-square.jpg" alt="">
  </div>

  <div id="vignette"></div>
  <div id="whiteout"></div>
  <div id="soundHint">TAP ANYWHERE FOR SOUND</div>
</div>

<script src="../../ge-vault-client.js"></script>
<script>
(function(){
  const gate=document.getElementById('gate');
  const site=document.getElementById('site');
  const space=document.getElementById('space');
  const streaks=document.getElementById('streaks');
  const sunWrap=document.getElementById('sunWrap');
  const moonWrap=document.getElementById('moonWrap');
  const vignette=document.getElementById('vignette');
  const whiteout=document.getElementById('whiteout');
  const soundHint=document.getElementById('soundHint');

  let raf=0,start=0,finished=false,siteReady=false,revealed=false,audioStarted=false;
  let lastSoundAttempt=0;

  // CAMERA STORY
  // WEBSITE-QR MATCHED OPENING, then a much slower cinematic fly-by.
  // 0–3.5s     : stars only
  // 3.5–5.2s   : centered Blue Sun fades in exactly like the Website QR
  // 5.2–14.2s  : long near-head-on approach, then skim around the Sun's right edge
  // 11.2–15.4s : Radio moon is gradually uncovered behind the passing limb
  // 12.6–16.1s : moon settles smoothly toward center
  // 15.8–24.8s : long, smooth moon approach with many small scale changes
  // 23.1–28.0s : dissolve into the already-loaded Radio
  const STARS_ONLY=3500;
  const SUN_FADE_IN=1700;
  const SUN_APPROACH_START=STARS_ONLY+SUN_FADE_IN;
  const SUN_APPROACH_MS=9000;
  const MOON_REVEAL_START=11200;
  const MOON_REVEAL_MS=4200;
  const MOON_CENTER_START=12600;
  const MOON_CENTER_MS=3500;
  const MOON_RUSH_START=15800;
  const MOON_RUSH_MS=9000;
  const RADIO_BLEND_START=23100;
  const RADIO_BLEND_MS=3900;
  const GATE_FADE_START=25800;
  const GATE_FADE_MS=2200;
  const TOTAL=28000;

  function clamp01(v){return Math.max(0,Math.min(1,v))}
  function smooth(t){t=clamp01(t);return t*t*(3-2*t)}
  function smoother(t){t=clamp01(t);return t*t*t*(t*(t*6-15)+10)}
  function easeIn(t){t=clamp01(t);return t*t*t}
  function easeOut(t){t=clamp01(t);return 1-Math.pow(1-t,3)}
  function mix(a,b,t){return a+(b-a)*t}

  function radioAudio(){
    try{return site.contentWindow && site.contentWindow.document.getElementById('player')}catch(e){return null}
  }
  function tryStartRadioAudio(){
    const now=Date.now();
    if(audioStarted || now-lastSoundAttempt<500)return;
    lastSoundAttempt=now;
    const player=radioAudio();
    if(!player)return;
    try{
      player.muted=false;
      player.defaultMuted=false;
      const result=player.play();
      if(result&&typeof result.then==='function'){
        result.then(()=>{audioStarted=true;soundHint.classList.remove('show')})
          .catch(()=>{if(!finished)soundHint.classList.add('show')});
      }else{
        audioStarted=!player.paused;
        if(audioStarted)soundHint.classList.remove('show');
      }
    }catch(e){
      if(!finished)soundHint.classList.add('show');
    }
  }

  function revealRadio(){
    if(revealed || !finished || !siteReady)return;
    revealed=true;
    site.classList.add('reveal');
    gate.classList.add('done');
    tryStartRadioAudio();

    setTimeout(()=>{
      try{history.replaceState({qrRadioArrival:true},'', '../../radio/')}catch(e){}
      try{site.contentWindow.focus()}catch(e){}
    },1500);
  }

  function finish(){
    if(finished)return;
    finished=true;
    cancelAnimationFrame(raf);
    site.classList.add('reveal');
    revealRadio();
    // If Safari blocked autoplay, the normal Radio play control remains available.
    setTimeout(tryStartRadioAudio,80);
  }

  function draw(now){
    if(!start)start=now;
    const t=now-start;

    // Star field stays calm during the same opening used by the Website QR.
    const approach=clamp01((t-SUN_APPROACH_START)/SUN_APPROACH_MS);
    const moonRush=clamp01((t-MOON_RUSH_START)/MOON_RUSH_MS);
    const approachEase=smoother(approach);
    const moonRushEase=smoother(moonRush);
    space.style.transform='translate3d(0,'+(-approachEase*.75).toFixed(3)+'%,0) scale('+(1.06+approachEase*.05+moonRushEase*.16).toFixed(5)+')';
    streaks.style.opacity=String((approachEase*.10+moonRushEase*.34).toFixed(4));
    streaks.style.transform='translate3d(0,0,0) scale('+(0.72+moonRushEase*1.15).toFixed(5)+')';

    // EXACT WEBSITE-QR OPENING: centered, invisible Sun; 3.5 seconds of stars;
    // then the Sun fades in over 1.7 seconds before any fly-by steering begins.
    let sunOpacity=0;
    let sunScale=.76;
    let sunX=0;
    let sunY=0;

    if(t>=STARS_ONLY){
      sunOpacity=smooth((t-STARS_ONLY)/SUN_FADE_IN);
    }

    if(t>=SUN_APPROACH_START){
      const p=clamp01((t-SUN_APPROACH_START)/SUN_APPROACH_MS);
      // Use the same exponential-feeling zoom logic as the Website QR, but stop
      // before entering the Sun. We aim at the MIDDLE of its right-hand limb.
      const accelerated=Math.pow(p,2.72);
      const scaleRatio=5.8/.76;
      sunScale=.76*Math.pow(scaleRatio,accelerated);

      // For the first part we appear to be flying almost directly at the center.
      // As the Sun becomes huge, its center slides left so the right edge becomes
      // our near-miss flight path. That produces a genuine around-the-limb pass.
      const steer=smoother((p-.22)/.78);
      sunX=mix(0,-118,steer);
      sunY=mix(0,3.5,smooth(steer));

      // Do not fade it early. Let its enormous curved edge physically clear the frame.
      sunOpacity*=1-smooth((p-.84)/.16);
    }

    sunWrap.style.opacity=String(clamp01(sunOpacity).toFixed(4));
    sunWrap.style.transform='translate3d(calc(-50% + '+sunX.toFixed(3)+'vw),calc(-50% + '+sunY.toFixed(3)+'vh),0) scale3d('+sunScale.toFixed(6)+','+sunScale.toFixed(6)+',1)';

    // Moon remains concealed behind the passing Sun and is revealed by the Sun's
    // retreating right-hand edge. Then it eases into center before the approach.
    const moonReveal=smooth((t-MOON_REVEAL_START)/MOON_REVEAL_MS);
    const moonCenter=smoother((t-MOON_CENTER_START)/MOON_CENTER_MS);
    const moonX=mix(17,0,moonCenter);
    const moonY=mix(2.5,0,moonCenter);
    const moonBaseScale=mix(.15,.92,smoother(moonCenter));

    // Smooth logarithmic zoom. The prior cubic curve waited too long and then
    // made large scale jumps near the end, which looked choppy on iPhone.
    const zoomEase=moonRushEase;
    const moonEndScale=8.7;
    const safeBase=Math.max(.001,moonBaseScale);
    const moonZoom=Math.exp(Math.log(safeBase)+(Math.log(moonEndScale)-Math.log(safeBase))*zoomEase);
    const moonFade=1-smooth((t-(RADIO_BLEND_START+800))/(RADIO_BLEND_MS-500));

    moonWrap.style.opacity=String((moonReveal*moonFade).toFixed(4));
    moonWrap.style.transform='translate3d(calc(-50% + '+moonX.toFixed(3)+'vw),calc(-50% + '+moonY.toFixed(3)+'vh),0) scale3d('+moonZoom.toFixed(6)+','+moonZoom.toFixed(6)+',1)';

    // Dissolve the moon into the Radio while the iframe has already been loading underneath.
    // Opacity + transform only: avoids full-screen blur/filter repainting on iPhone.
    const radioBlend=smoother((t-RADIO_BLEND_START)/RADIO_BLEND_MS);
    site.style.opacity=String(radioBlend.toFixed(4));
    site.style.transform='translate3d(0,0,0) scale('+(1.012-.012*radioBlend).toFixed(5)+')';
    whiteout.style.opacity=String((Math.sin(Math.PI*clamp01((t-(RADIO_BLEND_START+900))/2100))*.10).toFixed(4));
    vignette.style.opacity=String((.75-.55*radioBlend).toFixed(4));
    gate.style.opacity=String((1-smoother((t-GATE_FADE_START)/GATE_FADE_MS)).toFixed(4));

    // Give autoplay a few chances only near arrival. No second Radio load.
    if(t>RADIO_BLEND_START-1200)tryStartRadioAudio();

    if(t<TOTAL){
      raf=requestAnimationFrame(draw);
    }else{
      finish();
    }
  }

  site.addEventListener('load',()=>{
    siteReady=true;
    if(finished)revealRadio();
    // Let the Radio initialize while hidden. We attempt sound near arrival.
  },{once:true});

  // A user tap does NOT skip the movie. It only gives Safari/iPhone the user
  // gesture it may require for audible autoplay, so the visual sequence stays intact.
  gate.addEventListener('pointerdown',()=>{
    tryStartRadioAudio();
    soundHint.classList.remove('show');
  },{passive:true});
  gate.addEventListener('keydown',e=>{
    if(e.key==='Enter'||e.key===' '){
      e.preventDefault();
      tryStartRadioAudio();
    }
  });

  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    setTimeout(()=>{
      finished=true;
      siteReady=true;
      site.classList.add('reveal');
      gate.classList.add('done');
      tryStartRadioAudio();
    },900);
  }else{
    raf=requestAnimationFrame(draw);
  }

  // Never trap the listener if the embedded Radio takes longer than expected.
  setTimeout(()=>{
    if(!finished)finish();
    if(!siteReady)siteReady=true;
    revealRadio();
  },TOTAL+5000);
})();
</script>
</body>
</html>
