<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Grand Element Radio</title>

<link rel="preload" as="image" href="../../ge-images/images/favicon-square.jpg">
<link rel="preload" as="image" href="../../ge-images/images/ge-radio-logo.png">
<link rel="preload" as="image" href="../../ge-images/images/stars%20backgrounds/4.jpg">

<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;background:#000;
  -webkit-tap-highlight-color:transparent
}
#site{
  position:fixed;inset:0;width:100%;height:100%;border:0;background:#000;z-index:0;
  opacity:0;transform:scale(1.015);filter:blur(7px) brightness(.78);
  transition:opacity 1.8s ease,transform 2.4s cubic-bezier(.2,.72,.18,1),filter 2.1s ease
}
#site.reveal{opacity:1;transform:scale(1);filter:none}

#gate{
  position:fixed;inset:0;z-index:10;overflow:hidden;background:#000;
  opacity:1;transition:opacity 1.8s ease;touch-action:manipulation;isolation:isolate
}
#gate.done{opacity:0;pointer-events:none}

#space{
  position:absolute;inset:-7%;z-index:0;
  background:#000 url("../../ge-images/images/stars%20backgrounds/4.jpg") center/cover no-repeat;
  transform:scale(1.06);will-change:transform,filter,opacity
}
#spaceShade{
  position:absolute;inset:0;z-index:1;pointer-events:none;
  background:
    radial-gradient(circle at 53% 50%,rgba(31,136,255,.09),transparent 34%),
    radial-gradient(circle at 50% 50%,transparent 0 50%,rgba(0,0,0,.34) 100%);
}
#streaks{
  position:absolute;inset:-20%;z-index:2;opacity:0;pointer-events:none;
  background:
    repeating-conic-gradient(from 0deg at 50% 50%,
      rgba(198,241,255,0) 0deg,
      rgba(198,241,255,.18) .18deg,
      rgba(198,241,255,0) .42deg,
      rgba(198,241,255,0) 5.5deg);
  mix-blend-mode:screen;filter:blur(.5px);
  transform:scale(.72);transform-origin:50% 50%;will-change:transform,opacity
}

#sunWrap,#moonWrap{
  position:absolute;left:50%;top:50%;aspect-ratio:1;border-radius:50%;
  transform-origin:50% 50%;will-change:transform,opacity,filter
}
#sunWrap{
  z-index:5;width:min(74vmin,650px);
  transform:translate3d(60vw,-5vh,0) scale(.40);opacity:0
}
#sun{
  width:100%;height:100%;display:block;object-fit:cover;border-radius:50%;
  box-shadow:
    0 0 28px rgba(66,218,255,.82),
    0 0 90px rgba(0,137,255,.55),
    0 0 170px rgba(0,92,255,.28);
  user-select:none;-webkit-user-drag:none
}
#sunFlare{
  position:absolute;inset:-18%;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(98,224,255,.20),rgba(0,135,255,.06) 48%,transparent 72%);
  mix-blend-mode:screen
}

#moonWrap{
  z-index:4;width:min(29vmin,255px);
  transform:translate3d(16vw,2vh,0) scale(.18);opacity:0;filter:brightness(.50)
}
#moon{
  width:100%;height:100%;display:block;object-fit:cover;border-radius:50%;
  box-shadow:
    0 0 18px rgba(80,210,255,.22),
    0 0 55px rgba(20,121,255,.12);
  user-select:none;-webkit-user-drag:none
}
#moonHalo{
  position:absolute;inset:-9%;border-radius:50%;pointer-events:none;opacity:.45;
  border:1px solid rgba(147,231,255,.22);
  box-shadow:0 0 24px rgba(76,198,255,.16)
}

#vignette{
  position:absolute;inset:0;z-index:8;pointer-events:none;
  background:radial-gradient(circle at center,transparent 0 52%,rgba(0,0,0,.28) 78%,rgba(0,0,0,.72) 100%);
  opacity:.75;will-change:opacity
}
#whiteout{
  position:absolute;inset:0;z-index:9;pointer-events:none;background:#dff8ff;opacity:0;
  mix-blend-mode:screen;will-change:opacity
}
#soundHint{
  position:absolute;z-index:12;left:50%;bottom:max(22px,env(safe-area-inset-bottom));
  transform:translateX(-50%);padding:8px 13px;border-radius:999px;
  color:#dff8ff;background:rgba(3,17,30,.62);border:1px solid rgba(142,225,255,.30);
  font:800 10px/1 system-ui;letter-spacing:.08em;opacity:0;pointer-events:none;
  transition:opacity .45s ease;white-space:nowrap
}
#soundHint.show{opacity:.82}

@media(prefers-reduced-motion:reduce){
  #streaks{display:none}
  #sunWrap{opacity:.7!important;transform:translate3d(-50vw,0,0) scale(1.4)!important}
  #moonWrap{opacity:1!important;transform:translate3d(0,0,0) scale(1)!important;filter:none!important}
}
</style>
</head>

<body>
<iframe id="site" src="../../radio/?qr=1" title="Grand Element Radio" allow="autoplay"></iframe>

<div id="gate" aria-label="Entering Grand Element Radio" role="button" tabindex="0">
  <div id="space"></div>
  <div id="spaceShade"></div>
  <div id="streaks"></div>

  <div id="moonWrap" aria-hidden="true">
    <div id="moonHalo"></div>
    <img id="moon" src="../../ge-images/images/ge-radio-logo.png" alt="">
  </div>

  <div id="sunWrap" aria-hidden="true">
    <div id="sunFlare"></div>
    <img id="sun" src="../../ge-images/images/favicon-square.jpg" alt="">
  </div>

  <div id="vignette"></div>
  <div id="whiteout"></div>
  <div id="soundHint">TAP ANYWHERE FOR SOUND</div>
</div>

<script src="../../ge-vault-client.js"></script>
<script>
(function(){
  const gate=document.getElementById('gate');
  const site=document.getElementById('site');
  const space=document.getElementById('space');
  const streaks=document.getElementById('streaks');
  const sunWrap=document.getElementById('sunWrap');
  const moonWrap=document.getElementById('moonWrap');
  const vignette=document.getElementById('vignette');
  const whiteout=document.getElementById('whiteout');
  const soundHint=document.getElementById('soundHint');

  let raf=0,start=0,finished=false,siteReady=false,revealed=false,audioStarted=false;
  let lastSoundAttempt=0;

  // CAMERA STORY
  // 0–2.2s   : travel through the field
  // 0.5–7.3s : skim past the growing outer edge of the Blue Sun
  // 4.6–7.0s : Radio moon is gradually uncovered behind that passing edge
  // 7.0–12.0s: lock on moon and accelerate straight into it
  // 10.8–12.6s: moon dissolves into the already-loaded Radio
  const TOTAL=12600;

  function clamp01(v){return Math.max(0,Math.min(1,v))}
  function smooth(t){t=clamp01(t);return t*t*(3-2*t)}
  function easeIn(t){t=clamp01(t);return t*t*t}
  function easeOut(t){t=clamp01(t);return 1-Math.pow(1-t,3)}
  function mix(a,b,t){return a+(b-a)*t}

  function radioAudio(){
    try{return site.contentWindow && site.contentWindow.document.getElementById('player')}catch(e){return null}
  }
  function tryStartRadioAudio(){
    const now=Date.now();
    if(audioStarted || now-lastSoundAttempt<500)return;
    lastSoundAttempt=now;
    const player=radioAudio();
    if(!player)return;
    try{
      player.muted=false;
      player.defaultMuted=false;
      const result=player.play();
      if(result&&typeof result.then==='function'){
        result.then(()=>{audioStarted=true;soundHint.classList.remove('show')})
          .catch(()=>{if(!finished)soundHint.classList.add('show')});
      }else{
        audioStarted=!player.paused;
        if(audioStarted)soundHint.classList.remove('show');
      }
    }catch(e){
      if(!finished)soundHint.classList.add('show');
    }
  }

  function revealRadio(){
    if(revealed || !finished || !siteReady)return;
    revealed=true;
    site.classList.add('reveal');
    gate.classList.add('done');
    tryStartRadioAudio();

    setTimeout(()=>{
      try{history.replaceState({qrRadioArrival:true},'', '../../radio/')}catch(e){}
      try{site.contentWindow.focus()}catch(e){}
    },1500);
  }

  function finish(){
    if(finished)return;
    finished=true;
    cancelAnimationFrame(raf);
    site.classList.add('reveal');
    revealRadio();
    // If Safari blocked autoplay, the normal Radio play control remains available.
    setTimeout(tryStartRadioAudio,80);
  }

  function draw(now){
    if(!start)start=now;
    const t=now-start;

    // Forward motion in the star field.
    const cruise=clamp01(t/7000);
    const finalRush=clamp01((t-7200)/4300);
    space.style.transform='scale('+(1.06+cruise*.075+easeIn(finalRush)*.26).toFixed(4)+') translate3d(0,'+(cruise*-1.4).toFixed(2)+'%,0)';
    space.style.filter='brightness('+(1+finalRush*.23).toFixed(3)+')';
    streaks.style.opacity=String((smooth((t-300)/1500)*.24 + smooth((t-7600)/1900)*.50).toFixed(3));
    streaks.style.transform='scale('+(0.72+easeIn(finalRush)*1.75).toFixed(3)+')';

    // BLUE SUN FLY-BY:
    // We do NOT zoom into the Sun. The camera skims around its outer edge.
    // The Sun keeps growing as we approach it, while its center arcs left and
    // eventually leaves the frame. Its huge curved limb is what reveals the moon.
    const sunIn=smooth((t-450)/1550);
    const sunPass=clamp01((t-1150)/5600);
    const sunGrow=easeOut(clamp01((t-500)/5000));
    const sunX=mix(30,-142,Math.pow(sunPass,1.58));
    const sunY=mix(-6,10,smooth(sunPass));
    const sunScale=mix(.52,3.18,sunGrow);
    // Keep the Sun solid during the pass. Only soften it after most of its
    // visible edge has already slid off the left side.
    const sunFade=1-smooth((t-5900)/1450);
    sunWrap.style.opacity=String((sunIn*sunFade).toFixed(3));
    sunWrap.style.transform='translate3d(calc(-50% + '+sunX.toFixed(2)+'vw),calc(-50% + '+sunY.toFixed(2)+'vh),0) scale('+sunScale.toFixed(4)+')';
    sunWrap.style.filter='brightness('+(1+smooth((t-3000)/2600)*.42).toFixed(3)+') saturate('+(1+sunGrow*.10).toFixed(3)+')';

    // The Radio moon stays hidden behind that huge foreground Sun. As the Sun's
    // right-hand limb slides left, the moon is uncovered instead of popping in.
    const moonReveal=smooth((t-4550)/2300);
    const moonCenter=smooth((t-5650)/1850);
    const moonRush=clamp01((t-7150)/4450);
    const moonX=mix(20,0,moonCenter);
    const moonY=mix(3,0,moonCenter);
    const moonBaseScale=mix(.16,1.0,easeOut(moonCenter));
    const moonZoom=moonBaseScale*Math.pow(10.8,easeIn(moonRush));
    const moonFade=1-smooth((t-11100)/1250);
    const moonBrightness=mix(.48,1.10,moonReveal)+smooth((t-9800)/1700)*.52;
    const moonBlur=smooth((t-10900)/1250)*4.5;
    moonWrap.style.opacity=String((moonReveal*moonFade).toFixed(3));
    moonWrap.style.transform='translate3d(calc(-50% + '+moonX.toFixed(2)+'vw),calc(-50% + '+moonY.toFixed(2)+'vh),0) scale('+moonZoom.toFixed(5)+')';
    moonWrap.style.filter='brightness('+moonBrightness.toFixed(3)+') saturate('+(1+moonRush*.18).toFixed(3)+') blur('+moonBlur.toFixed(2)+'px)';

    // Transition from the moon surface into the real Radio.
    const radioBlend=smooth((t-10650)/1750);
    site.style.opacity=String(radioBlend.toFixed(3));
    site.style.transform='scale('+(1.015-.015*radioBlend).toFixed(4)+')';
    site.style.filter='blur('+(7*(1-radioBlend)).toFixed(2)+'px) brightness('+(0.78+.22*radioBlend).toFixed(3)+')';
    whiteout.style.opacity=String((Math.sin(Math.PI*clamp01((t-10800)/1500))*.20).toFixed(3));
    vignette.style.opacity=String((.75-.55*radioBlend).toFixed(3));
    gate.style.opacity=String((1-smooth((t-11600)/1000)).toFixed(3));

    // Give autoplay a few chances only near arrival. No second Radio load.
    if(t>10200)tryStartRadioAudio();

    if(t<TOTAL){
      raf=requestAnimationFrame(draw);
    }else{
      finish();
    }
  }

  site.addEventListener('load',()=>{
    siteReady=true;
    if(finished)revealRadio();
    // Let the Radio initialize while hidden. We attempt sound near arrival.
  },{once:true});

  // A user tap does NOT skip the movie. It only gives Safari/iPhone the user
  // gesture it may require for audible autoplay, so the visual sequence stays intact.
  gate.addEventListener('pointerdown',()=>{
    tryStartRadioAudio();
    soundHint.classList.remove('show');
  },{passive:true});
  gate.addEventListener('keydown',e=>{
    if(e.key==='Enter'||e.key===' '){
      e.preventDefault();
      tryStartRadioAudio();
    }
  });

  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    setTimeout(()=>{
      finished=true;
      siteReady=true;
      site.classList.add('reveal');
      gate.classList.add('done');
      tryStartRadioAudio();
    },900);
  }else{
    raf=requestAnimationFrame(draw);
  }

  // Never trap the listener if the embedded Radio takes longer than expected.
  setTimeout(()=>{
    if(!finished)finish();
    if(!siteReady)siteReady=true;
    revealRadio();
  },TOTAL+5000);
})();
</script>
</body>
</html>
