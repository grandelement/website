<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Grand Element Radio</title>

<link rel="preload" as="image" href="../../ge-images/images/favicon-square.jpg">
<link rel="preload" as="image" href="../../ge-images/images/ge-radio-logo.png">
<link rel="preload" as="image" href="../../ge-images/images/stars%20backgrounds/4.jpg">

<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;background:#000;
  -webkit-tap-highlight-color:transparent
}
#site{
  position:fixed;inset:0;width:100%;height:100%;border:0;background:#000;z-index:0;
  opacity:1;transform:translate3d(0,0,0) scale(1);
  transition:none;
  will-change:opacity,transform;backface-visibility:hidden;-webkit-backface-visibility:hidden
}
#site.reveal{opacity:1;transform:translate3d(0,0,0) scale(1)}

#gate{
  position:fixed;inset:0;z-index:10;overflow:hidden;background:#000;
  opacity:1;transition:none;touch-action:manipulation;isolation:isolate
}
#gate.done{opacity:0;pointer-events:none}

#space{
  position:absolute;inset:-7%;z-index:0;
  background:#000 url("../../ge-images/images/stars%20backgrounds/4.jpg") center/cover no-repeat;
  transform:translate3d(0,0,0) scale(1.06);will-change:transform,opacity;backface-visibility:hidden;-webkit-backface-visibility:hidden
}
#spaceShade{
  position:absolute;inset:0;z-index:1;pointer-events:none;
  background:
    radial-gradient(circle at 53% 50%,rgba(31,136,255,.09),transparent 34%),
    radial-gradient(circle at 50% 50%,transparent 0 50%,rgba(0,0,0,.34) 100%);
}
#streaks{
  display:none;
  position:absolute;inset:-20%;z-index:2;opacity:0;pointer-events:none;
  background:
    repeating-conic-gradient(from 0deg at 50% 50%,
      rgba(198,241,255,0) 0deg,
      rgba(198,241,255,.18) .18deg,
      rgba(198,241,255,0) .42deg,
      rgba(198,241,255,0) 5.5deg);
  opacity:0;
  transform:translate3d(0,0,0) scale(.72);transform-origin:50% 50%;will-change:transform,opacity;
  backface-visibility:hidden;-webkit-backface-visibility:hidden
}

#sunWrap,#moonWrap{
  position:absolute;left:50%;top:50%;aspect-ratio:1;border-radius:50%;
  transform-origin:50% 50%;will-change:transform,opacity,filter
}
#sunWrap{
  z-index:5;width:min(50vmin,430px);
  transform:translate(-50%,-50%) scale(.76);opacity:0
}
#sun{
  width:100%;height:100%;display:block;object-fit:cover;border-radius:50%;
  box-shadow:
    0 0 28px rgba(66,218,255,.82),
    0 0 90px rgba(0,137,255,.55),
    0 0 170px rgba(0,92,255,.28);
  user-select:none;-webkit-user-drag:none
}
#sunFlare{
  position:absolute;inset:-18%;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(98,224,255,.20),rgba(0,135,255,.06) 48%,transparent 72%);
  mix-blend-mode:screen
}

#moonWrap{
  z-index:4;width:min(29vmin,255px);
  transform:translate3d(-50%,-50%,0) scale(.18);opacity:0;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;transform-style:preserve-3d
}
#moon{
  width:100%;height:100%;display:block;object-fit:cover;border-radius:50%;
  box-shadow:
    0 0 18px rgba(80,210,255,.22),
    0 0 55px rgba(20,121,255,.12);
  user-select:none;-webkit-user-drag:none
}
#moonHalo{
  position:absolute;inset:-9%;border-radius:50%;pointer-events:none;opacity:.45;
  border:1px solid rgba(147,231,255,.22);
  box-shadow:0 0 24px rgba(76,198,255,.16)
}

#vignette{
  position:absolute;inset:0;z-index:8;pointer-events:none;
  background:radial-gradient(circle at center,transparent 0 52%,rgba(0,0,0,.28) 78%,rgba(0,0,0,.72) 100%);
  opacity:.75;will-change:opacity
}
#whiteout{
  position:absolute;inset:0;z-index:9;pointer-events:none;background:#dff8ff;opacity:0;
  mix-blend-mode:screen;will-change:opacity
}
#soundHint{
  position:absolute;z-index:12;left:50%;bottom:max(22px,env(safe-area-inset-bottom));
  transform:translateX(-50%);padding:8px 13px;border-radius:999px;
  color:#dff8ff;background:rgba(3,17,30,.62);border:1px solid rgba(142,225,255,.30);
  font:800 10px/1 system-ui;letter-spacing:.08em;opacity:0;pointer-events:none;
  transition:opacity .45s ease;white-space:nowrap
}
#soundHint.show{opacity:.82}

@media(prefers-reduced-motion:reduce){
  #streaks{display:none}
  #sunWrap{opacity:.7!important;transform:translate3d(-50vw,0,0) scale(1.4)!important}
  #moonWrap{opacity:1!important;transform:translate3d(0,0,0) scale(1)!important}
}
</style>
</head>

<body>
<iframe id="site" src="../../radio/?qr=1" title="Grand Element Radio" allow="autoplay"></iframe>

<div id="gate" aria-label="Entering Grand Element Radio" role="button" tabindex="0">
  <div id="space"></div>
  <div id="spaceShade"></div>
  <div id="streaks"></div>

  <div id="moonWrap" aria-hidden="true">
    <div id="moonHalo"></div>
    <img id="moon" src="../../ge-images/images/ge-radio-logo.png" alt="">
  </div>

  <div id="sunWrap" aria-hidden="true">
    <div id="sunFlare"></div>
    <img id="sun" src="../../ge-images/images/favicon-square.jpg" alt="">
  </div>

  <div id="vignette"></div>
  <div id="whiteout"></div>
  <div id="soundHint">TAP ANYWHERE FOR SOUND</div>
</div>

<script src="../../ge-vault-client.js"></script>

<script>
(function(){
  'use strict';
  const gate=document.getElementById('gate');
  const site=document.getElementById('site');
  const space=document.getElementById('space');
  const sunWrap=document.getElementById('sunWrap');
  const moonWrap=document.getElementById('moonWrap');
  const vignette=document.getElementById('vignette');

  // Match the established Website QR timing exactly through the flyby target.
  const STARS_ONLY=3500;
  const FADE_IN=1700;
  const ZOOM_START=STARS_ONLY+FADE_IN;
  const ZOOM_TIME=6000;
  const FLYBY_START=ZOOM_START+ZOOM_TIME;
  const FLYBY_TIME=3900;
  const TRANSITION_START=FLYBY_START+FLYBY_TIME+200;
  const TRANSITION_TIME=1500;
  const START_SCALE=.76;
  // Enough to fill the LEFT half while keeping iPhone GPU texture sizes reasonable.
  const END_SCALE=5.4;
  const clamp=v=>Math.max(0,Math.min(1,v));
  const smooth=v=>{v=clamp(v);return v*v*(3-2*v)};
  const mix=(a,b,t)=>a+(b-a)*t;
  let startAt=0,frame=0,finished=false,siteReady=false,blendAt=-1;
  let audioRequested=false;

  function beginRadioAudio(){
    if(audioRequested||!finished)return;
    let child,player;
    try{
      child=site.contentWindow;
      if(!child||!child.GEQRIntroAudioReady)return;
      if(child.GEIAmStudio?.isRadioSuspended?.())return;
      player=child.document.getElementById('player');
      if(!player||!player.currentSrc&&!player.src)return;
    }catch(_e){return;}
    audioRequested=true;
    // Only this ONE player is permitted to start. No audio begins during the movie.
    try{
      player.muted=false;
      player.defaultMuted=false;
      const started=player.play();
      if(started&&typeof started.catch==='function')started.catch(()=>{});
    }catch(_e){}
  }

  function finish(){
    if(finished)return;
    finished=true;
    cancelAnimationFrame(frame);
    gate.style.opacity='0';
    gate.classList.add('done');
    beginRadioAudio();
    // Do not reload the already-initialized Radio iframe.
    setTimeout(()=>{
      try{history.replaceState({qrRadioArrival:true},'','../../radio/')}catch(_e){}
      try{site.contentWindow.focus()}catch(_e){}
    },450);
  }

  function draw(now){
    if(!startAt)startAt=now;
    // Wall-clock timing prevents low-frame-rate iPhones from turning 3.5s into 15s.
    const t=Math.max(0,now-startAt);
    const zoom=clamp((t-ZOOM_START)/ZOOM_TIME);
    const flyby=smooth((t-FLYBY_START)/FLYBY_TIME);
    const sunScale=START_SCALE*Math.pow(END_SCALE/START_SCALE,Math.pow(zoom,3));
    const width=Math.max(1,window.innerWidth);
    const baseWidth=Math.min(Math.min(window.innerWidth,window.innerHeight)*.5,430);
    const radius=(baseWidth*sunScale)/(2*width);

    // AIM: fly straight toward the boundary between blue surface and space.
    // At 11.2 seconds the RIGHT EDGE is exactly at screen center:
    // left half blue, right half stars. Do not steer beyond it during zoom.
    const aim=smooth((zoom-.12)/.88);
    const approachRightEdge=mix(.5+radius,.5,aim);
    // AFTER reaching that half-screen composition, slide the Sun left.
    // This physically reveals the moon behind it; neither object teleports.
    const rightEdge=mix(approachRightEdge,-.18,flyby);
    const center=rightEdge-radius;
    const sunX=(center-.5)*100;

    const appear=smooth((t-STARS_ONLY)/FADE_IN);
    sunWrap.style.opacity=appear.toFixed(4);
    sunWrap.style.transform='translate3d(calc(-50% + '+sunX.toFixed(3)+'vw),-50%,0) scale3d('+sunScale.toFixed(5)+','+sunScale.toFixed(5)+',1)';

    // Moon begins fully OCCLUDED by the blue Sun, slightly left of center.
    // As the camera skims past, gentle parallax centers and exposes the moon.
    // No sudden independent moon fade or massive zoom of the RADIO lettering.
    const moonX=mix(-10,-1,smooth(flyby));
    const moonScale=mix(.58,1.10,flyby);
    moonWrap.style.opacity=appear.toFixed(4);
    moonWrap.style.transform='translate3d(calc(-50% + '+moonX.toFixed(3)+'vw),-50%,0) scale3d('+moonScale.toFixed(5)+','+moonScale.toFixed(5)+',1)';

    // Keep stars in one continuous scene. No second star field or white flash.
    space.style.transform='translate3d(0,0,0) scale('+(1.06+.025*smooth(zoom)+.01*flyby).toFixed(5)+')';
    vignette.style.opacity=(.72-.18*flyby).toFixed(4);

    // The Radio iframe is already visibly painted underneath the opaque gate.
    // Only dissolve the gate when the iframe has actually finished loading.
    if(t>=TRANSITION_START && siteReady && blendAt<0)blendAt=t;
    const blend=blendAt<0?0:smooth((t-blendAt)/TRANSITION_TIME);
    gate.style.opacity=(1-blend).toFixed(4);
    if(blend>=1)finish();
    else frame=requestAnimationFrame(draw);
  }

  site.addEventListener('load',()=>{
    siteReady=true;
    if(finished)beginRadioAudio();
  },{once:true});

  // Tapping the introduction must never start music early or duplicate the player.
  // On Safari, the regular Play control remains available if autoplay is denied.
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    startAt=performance.now()-TRANSITION_START;
  }
  frame=requestAnimationFrame(draw);
})();
</script>
</body>
</html>
