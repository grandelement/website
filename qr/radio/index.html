<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Grand Element Radio</title>

<link rel="preload" as="image" href="../../ge-images/images/favicon-square.jpg">
<link rel="preload" as="image" href="../../ge-images/images/ge-radio-logo.png">
<link rel="preload" as="image" href="../../ge-images/images/stars%20backgrounds/4.jpg">

<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;background:#000;
  -webkit-tap-highlight-color:transparent
}
#site{
  position:fixed;inset:0;width:100%;height:100%;border:0;background:#000;z-index:0;
  opacity:1;transform:translate3d(0,0,0);
  transition:none;backface-visibility:hidden;-webkit-backface-visibility:hidden
}
#site.reveal{opacity:1;transform:translate3d(0,0,0) scale(1)}

#gate{
  position:fixed;inset:0;z-index:10;overflow:hidden;background:#000;
  opacity:1;transition:none;touch-action:manipulation;isolation:isolate;
  transform:translateZ(0);will-change:opacity;contain:layout style paint
}
#gate.done{opacity:0;pointer-events:none}

#space{
  position:absolute;inset:-7%;z-index:0;
  background:#000 url("../../ge-images/images/stars%20backgrounds/4.jpg") center/cover no-repeat;
  transform:translate3d(0,0,0) scale(1.06);will-change:opacity;backface-visibility:hidden;-webkit-backface-visibility:hidden
}
#spaceShade{
  position:absolute;inset:0;z-index:1;pointer-events:none;
  background:
    radial-gradient(circle at 53% 50%,rgba(31,136,255,.09),transparent 34%),
    radial-gradient(circle at 50% 50%,transparent 0 50%,rgba(0,0,0,.34) 100%);
}
#streaks{
  display:none;
  position:absolute;inset:-20%;z-index:2;opacity:0;pointer-events:none;
  background:
    repeating-conic-gradient(from 0deg at 50% 50%,
      rgba(198,241,255,0) 0deg,
      rgba(198,241,255,.18) .18deg,
      rgba(198,241,255,0) .42deg,
      rgba(198,241,255,0) 5.5deg);
  opacity:0;
  transform:translate3d(0,0,0) scale(.72);transform-origin:50% 50%;will-change:transform,opacity;
  backface-visibility:hidden;-webkit-backface-visibility:hidden
}

#sunWrap,#moonWrap{
  position:absolute;left:50%;top:50%;aspect-ratio:1;border-radius:50%;
  transform-origin:50% 50%;will-change:transform,opacity;backface-visibility:hidden;-webkit-backface-visibility:hidden
}
#sunWrap{
  z-index:5;width:min(50vmin,430px);
  transform:translate(-50%,-50%) scale(.76);opacity:0
}
#sun{
  width:100%;height:100%;display:block;object-fit:cover;border-radius:50%;
  box-shadow:
    0 0 22px rgba(66,218,255,.72),
    0 0 52px rgba(0,137,255,.38);
  user-select:none;-webkit-user-drag:none
}
#sunFlare{
  display:none; /* Avoid expensive large-area screen blending on iPhones. */
  position:absolute;inset:-18%;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(98,224,255,.20),rgba(0,135,255,.06) 48%,transparent 72%);
  mix-blend-mode:screen
}

#moonWrap{
  z-index:4;width:min(29vmin,255px);
  transform:translate3d(-50%,-50%,0) scale(.18);opacity:0;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;transform-style:preserve-3d
}
#moon{
  width:100%;height:100%;display:block;object-fit:cover;border-radius:50%;
  box-shadow:
    0 0 12px rgba(80,210,255,.18),
    0 0 28px rgba(20,121,255,.10);
  user-select:none;-webkit-user-drag:none
}
#moonHalo{
  position:absolute;inset:-9%;border-radius:50%;pointer-events:none;opacity:.45;
  border:1px solid rgba(147,231,255,.22);
  box-shadow:0 0 24px rgba(76,198,255,.16)
}

#vignette{
  position:absolute;inset:0;z-index:8;pointer-events:none;
  background:radial-gradient(circle at center,transparent 0 52%,rgba(0,0,0,.28) 78%,rgba(0,0,0,.72) 100%);
  opacity:.75;will-change:opacity
}
#whiteout{
  position:absolute;inset:0;z-index:9;pointer-events:none;background:#dff8ff;opacity:0;
  mix-blend-mode:screen;will-change:opacity
}
#soundHint{
  position:absolute;z-index:12;left:50%;bottom:max(22px,env(safe-area-inset-bottom));
  transform:translateX(-50%);padding:8px 13px;border-radius:999px;
  color:#dff8ff;background:rgba(3,17,30,.62);border:1px solid rgba(142,225,255,.30);
  font:800 10px/1 system-ui;letter-spacing:.08em;opacity:0;pointer-events:none;
  transition:opacity .45s ease;white-space:nowrap
}
#soundHint.show{opacity:.82}

@media(prefers-reduced-motion:reduce){
  #streaks{display:none}
  #sunWrap{opacity:.7!important;transform:translate3d(-50vw,0,0) scale(1.4)!important}
  #moonWrap{opacity:1!important;transform:translate3d(0,0,0) scale(1)!important}
}
</style>
</head>

<body>
<iframe id="site" src="about:blank" title="Grand Element Radio" allow="autoplay"></iframe>

<div id="gate" aria-label="Entering Grand Element Radio" role="button" tabindex="0">
  <div id="space"></div>
  <div id="spaceShade"></div>
  <div id="streaks"></div>

  <div id="moonWrap" aria-hidden="true">
    <div id="moonHalo"></div>
    <img id="moon" src="../../ge-images/images/ge-radio-logo.png" alt="">
  </div>

  <div id="sunWrap" aria-hidden="true">
    <div id="sunFlare"></div>
    <img id="sun" src="../../ge-images/images/favicon-square.jpg" alt="">
  </div>

  <div id="vignette"></div>
  <div id="whiteout"></div>
  <div id="soundHint">TAP ANYWHERE FOR SOUND</div>
</div>

<script src="../../ge-vault-client.js"></script>

<script>
(function(){
  'use strict';
  const gate=document.getElementById('gate');
  const site=document.getElementById('site');
  const space=document.getElementById('space');
  const sunWrap=document.getElementById('sunWrap');
  const moonWrap=document.getElementById('moonWrap');

  // Preserve the approved half-screen, right-limb near-miss trajectory.
  // Bring the Sun into view sooner, then fly toward and INTO the Radio moon.
  const STARS_ONLY=1800;
  const FADE_IN=1100;
  const ZOOM_START=STARS_ONLY+FADE_IN;
  const ZOOM_TIME=6000;
  const FLYBY_START=ZOOM_START+ZOOM_TIME;
  const FLYBY_TIME=3900;
  const MOON_APPROACH_START=FLYBY_START+FLYBY_TIME;
  const MOON_APPROACH_TIME=3600;
  const FADE_START=MOON_APPROACH_START+MOON_APPROACH_TIME;
  const FADE_TIME=1350;
  const START_SCALE=.76;
  const END_SCALE=5.4;
  const clamp=v=>Math.max(0,Math.min(1,v));
  const smooth=v=>{v=clamp(v);return v*v*(3-2*v)};
  const mix=(a,b,t)=>a+(b-a)*t;

  let startAt=0,frame=0,finished=false;
  let radioLoading=false,siteReady=false,fadeAt=-1,audioRequested=false;
  let sunHidden=false,lastFrameAt=0,fpsFrames=0;
  const showFps=new URLSearchParams(location.search).get('fps')==='1';
  let fpsMeter=null;
  if(showFps){
    fpsMeter=document.createElement('div');
    fpsMeter.style.cssText='position:fixed;right:10px;top:10px;z-index:99;background:rgba(0,0,0,.8);color:#9eefff;border-radius:6px;padding:5px 8px;font:700 13px monospace;pointer-events:none';
    fpsMeter.textContent='FPS measuring…';
    document.body.appendChild(fpsMeter);
  }

  // The original Radio iframe does not compete with the flyby animation.
  // Start its one-time load only when the moon approach begins.
  function loadRadio(){
    if(radioLoading)return;
    radioLoading=true;
    site.src='../../radio/?qr=1';
  }

  function beginRadioAudio(){
    if(audioRequested||!finished)return;
    try{
      const child=site.contentWindow;
      if(!child||!child.GEQRIntroAudioReady||child.GEIAmStudio?.isRadioSuspended?.())return;
      const player=child.document.getElementById('player');
      if(!player||(!player.src&&!player.currentSrc))return;
      audioRequested=true;
      player.muted=false;
      player.defaultMuted=false;
      const play=player.play();
      if(play&&typeof play.catch==='function')play.catch(()=>{});
    }catch(_e){}
  }

  function finish(){
    if(finished)return;
    finished=true;
    cancelAnimationFrame(frame);
    gate.style.opacity='0';
    gate.classList.add('done');
    beginRadioAudio();
    // Retry only against the same player in case its asynchronous startup
    // completed just after the frame that finished the crossfade.
    if(!audioRequested)setTimeout(beginRadioAudio,700);
    setTimeout(()=>{
      try{history.replaceState({qrRadioArrival:true},'','../../radio/')}catch(_e){}
      try{site.contentWindow.focus()}catch(_e){}
    },450);
    if(fpsMeter)fpsMeter.textContent+=' · DONE';
  }

  function draw(now){
    if(!startAt)startAt=now;
    // Time is measured against the actual clock, never a frame-count clock.
    const t=Math.max(0,now-startAt);
    const zoom=clamp((t-ZOOM_START)/ZOOM_TIME);
    const flyby=smooth((t-FLYBY_START)/FLYBY_TIME);
    const moonApproach=clamp((t-MOON_APPROACH_START)/MOON_APPROACH_TIME);
    const width=Math.max(1,window.innerWidth),height=Math.max(1,window.innerHeight);
    const sunBase=Math.min(Math.min(width,height)*.5,430);
    const sunScale=START_SCALE*Math.pow(END_SCALE/START_SCALE,Math.pow(zoom,3));
    const radius=sunBase*sunScale/(2*width);

    // Website QR zoom, but aim at the Sun's RIGHT edge. At the closest
    // approach the Sun covers exactly the left half of the screen.
    const aim=smooth((zoom-.12)/.88);
    const approachRightEdge=mix(.5+radius,.5,aim);
    const rightEdge=mix(approachRightEdge,-.18,flyby);
    const sunCenter=(rightEdge-radius)*width;
    if(!sunHidden){
      const opacity=smooth((t-STARS_ONLY)/FADE_IN);
      sunWrap.style.opacity=opacity.toFixed(4);
      sunWrap.style.transform='translate3d('+(sunCenter-width/2).toFixed(2)+'px,-50%,0) translate3d(-50%,0,0) scale3d('+sunScale.toFixed(5)+','+sunScale.toFixed(5)+',1)';
    }
    if(t>=MOON_APPROACH_START&&!sunHidden){
      // The Sun has completely left the screen. Drop its compositing layer.
      sunHidden=true;
      sunWrap.style.display='none';
    }

    // The moon is behind the blue planet all along. When the limb moves left,
    // we uncover it in place; THEN fly closer without changing the starfield.
    const moonBase=Math.min(Math.min(width,height)*.29,255);
    const moonGoal=Math.max(1.1,Math.max(width,height)*1.12/moonBase);
    const moonArrival=mix(.58,1.10,flyby);
    const moonScale=moonArrival*Math.pow(moonGoal/1.10,smooth(moonApproach));
    const moonShift=mix(-10,-1,flyby)*(1-smooth(moonApproach));
    moonWrap.style.opacity=smooth((t-STARS_ONLY)/FADE_IN).toFixed(4);
    moonWrap.style.transform='translate3d(calc(-50% + '+moonShift.toFixed(3)+'vw),-50%,0) scale3d('+moonScale.toFixed(5)+','+moonScale.toFixed(5)+',1)';

    if(t>=MOON_APPROACH_START)loadRadio();
    // During the moon close-up, fade away outer space so the RADIO page
    // can blend directly in once it is ready. No starfield scene reset.
    space.style.opacity=(1-smooth((moonApproach-.54)/.43)).toFixed(4);

    // Don't expose a blank iframe during a slow connection.
    // Hold the last moon frame until Radio actually loads.
    if(t>=FADE_START&&siteReady&&fadeAt<0)fadeAt=now;
    const fade=fadeAt<0?0:smooth((now-fadeAt)/FADE_TIME);
    gate.style.opacity=(1-fade).toFixed(4);

    if(fpsMeter){
      fpsFrames++;
      if(!lastFrameAt)lastFrameAt=now;
      if(now-lastFrameAt>=700){
        const fps=(fpsFrames*1000/(now-lastFrameAt)).toFixed(0);
        fpsMeter.textContent='QR FPS '+fps;
        fpsFrames=0;lastFrameAt=now;
      }
    }
    if(fade>=1)finish();
    else frame=requestAnimationFrame(draw);
  }

  site.addEventListener('load',()=>{
    if(!radioLoading)return; // Ignore initial about:blank navigation.
    try{
      const href=site.contentWindow.location.href;
      if(!href.includes('/radio/')||!href.includes('qr=1'))return;
    }catch(_e){return;}
    siteReady=true;
  });

  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    // Skip animation, but still wait for the actual Radio document to load.
    startAt=performance.now()-FADE_START;
  }
  frame=requestAnimationFrame(draw);
})();
</script>
</body>
</html>
