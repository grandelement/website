<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Grand Element Radio</title>

<link rel="preload" as="image" href="../../ge-images/images/favicon-square.jpg">
<link rel="preload" as="image" href="../../ge-images/images/ge-radio-logo.png">
<link rel="preload" as="image" href="../../ge-images/images/stars%20backgrounds/4.jpg">

<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;background:#000;
  -webkit-tap-highlight-color:transparent
}
#site{
  position:fixed;inset:0;width:100%;height:100%;border:0;background:#000;z-index:0;
  opacity:1;transform:translate3d(0,0,0);
  transition:none;backface-visibility:hidden;-webkit-backface-visibility:hidden
}
#site.reveal{opacity:1;transform:translate3d(0,0,0) scale(1)}

#gate{
  position:fixed;inset:0;z-index:10;overflow:hidden;background:#000;
  opacity:1;transition:none;touch-action:manipulation;isolation:isolate;
  transform:translateZ(0);will-change:opacity;contain:layout style paint
}
#gate.done{opacity:0;pointer-events:none}

#space{
  position:absolute;inset:-7%;z-index:0;
  background:#000 url("../../ge-images/images/stars%20backgrounds/4.jpg") center/cover no-repeat;
  transform:translate3d(0,0,0) scale(1.06);will-change:opacity;backface-visibility:hidden;-webkit-backface-visibility:hidden
}
#spaceShade{
  position:absolute;inset:0;z-index:1;pointer-events:none;
  background:
    radial-gradient(circle at 53% 50%,rgba(31,136,255,.09),transparent 34%),
    radial-gradient(circle at 50% 50%,transparent 0 50%,rgba(0,0,0,.34) 100%);
}
#streaks{
  display:none;
  position:absolute;inset:-20%;z-index:2;opacity:0;pointer-events:none;
  background:
    repeating-conic-gradient(from 0deg at 50% 50%,
      rgba(198,241,255,0) 0deg,
      rgba(198,241,255,.18) .18deg,
      rgba(198,241,255,0) .42deg,
      rgba(198,241,255,0) 5.5deg);
  opacity:0;
  transform:translate3d(0,0,0) scale(.72);transform-origin:50% 50%;will-change:transform,opacity;
  backface-visibility:hidden;-webkit-backface-visibility:hidden
}

#sunWrap,#moonWrap{
  position:absolute;left:50%;top:50%;aspect-ratio:1;border-radius:50%;
  transform-origin:50% 50%;will-change:transform,opacity;backface-visibility:hidden;-webkit-backface-visibility:hidden
}
#sunWrap{
  z-index:5;width:min(50vmin,430px);
  transform:translate(-50%,-50%) scale(.76);opacity:0
}
#sun{
  width:100%;height:100%;display:block;object-fit:cover;border-radius:50%;
  box-shadow:
    0 0 12px rgba(66,218,255,.55);
  user-select:none;-webkit-user-drag:none
}
#sunFlare{
  display:none; /* Avoid expensive large-area screen blending on iPhones. */
  position:absolute;inset:-18%;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(98,224,255,.20),rgba(0,135,255,.06) 48%,transparent 72%);
  mix-blend-mode:screen
}

#moonWrap{
  z-index:4;width:min(29vmin,255px);
  transform:translate3d(-50%,-50%,0) scale(.18);opacity:0;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;transform-style:preserve-3d
}
#moon{
  width:100%;height:100%;display:block;object-fit:cover;border-radius:50%;
  box-shadow:none;
  user-select:none;-webkit-user-drag:none
}
#moonHalo{
  display:none;
  position:absolute;inset:-9%;border-radius:50%;pointer-events:none;opacity:.45;
  border:1px solid rgba(147,231,255,.22);
  box-shadow:0 0 24px rgba(76,198,255,.16)
}

#vignette{
  position:absolute;inset:0;z-index:8;pointer-events:none;
  background:radial-gradient(circle at center,transparent 0 52%,rgba(0,0,0,.28) 78%,rgba(0,0,0,.72) 100%);
  opacity:.75;will-change:opacity
}
#whiteout{
  position:absolute;inset:0;z-index:9;pointer-events:none;background:#dff8ff;opacity:0;
  mix-blend-mode:screen;will-change:opacity
}
#soundHint{
  position:absolute;z-index:12;left:50%;bottom:max(22px,env(safe-area-inset-bottom));
  transform:translateX(-50%);padding:8px 13px;border-radius:999px;
  color:#dff8ff;background:rgba(3,17,30,.62);border:1px solid rgba(142,225,255,.30);
  font:800 10px/1 system-ui;letter-spacing:.08em;opacity:0;pointer-events:none;
  transition:opacity .45s ease;white-space:nowrap
}
#soundHint.show{opacity:.82}

@media(prefers-reduced-motion:reduce){
  #streaks{display:none}
  #sunWrap{opacity:.7!important;transform:translate3d(-50vw,0,0) scale(1.4)!important}
  #moonWrap{opacity:1!important;transform:translate3d(0,0,0) scale(1)!important}
}
</style>
</head>

<body>
<iframe id="site" src="about:blank" title="Grand Element Radio" allow="autoplay"></iframe>

<div id="gate" aria-label="Entering Grand Element Radio" role="button" tabindex="0">
  <div id="space"></div>
  <div id="spaceShade"></div>
  <div id="streaks"></div>

  <div id="moonWrap" aria-hidden="true">
    <div id="moonHalo"></div>
    <img id="moon" src="../../ge-images/images/ge-radio-logo.png" alt="">
  </div>

  <div id="sunWrap" aria-hidden="true">
    <div id="sunFlare"></div>
    <img id="sun" src="../../ge-images/images/favicon-square.jpg" alt="">
  </div>

  <div id="vignette"></div>
  <div id="whiteout"></div>
  <div id="soundHint">TAP ANYWHERE FOR SOUND</div>
</div>

<script src="../../ge-vault-client.js"></script>

<script>
(function(){
'use strict';
const gate=document.getElementById('gate'),site=document.getElementById('site');
const sunWrap=document.getElementById('sunWrap'),moonWrap=document.getElementById('moonWrap'),space=document.getElementById('space');
const STARS_ONLY=1800,FADE_IN=1100,ZOOM_START=2900,ZOOM_TIME=7000;
const CORNER_HOLD=850,FLYBY_START=ZOOM_START+ZOOM_TIME+CORNER_HOLD,FLYBY_TIME=7200;
const MOON_APPROACH_START=FLYBY_START+FLYBY_TIME,MOON_APPROACH_TIME=4600;
const FADE_START=MOON_APPROACH_START+MOON_APPROACH_TIME,FADE_TIME=1350;
const clamp=x=>Math.max(0,Math.min(1,x));
const smooth=x=>{x=clamp(x);return x*x*(3-2*x)};
const mix=(a,b,x)=>a+(b-a)*x;
let siteReady=false,radioLoading=false,finished=false,fadeStarted=false,audioRequested=false;
const showFps=new URLSearchParams(location.search).get('fps')==='1';
let meter=null,meterFrames=0,meterStart=0,meterRAF=0;
if(showFps){
  meter=document.createElement('div');
  meter.style.cssText='position:fixed;right:10px;top:10px;z-index:99;background:rgba(0,0,0,.8);color:#9eefff;border-radius:6px;padding:5px 8px;font:700 13px monospace;pointer-events:none';
  meter.textContent='FPS measuring…';document.body.appendChild(meter);
  function measure(now){
    if(finished)return;
    meterFrames++;
    if(!meterStart)meterStart=now;
    if(now-meterStart>=700){
      meter.textContent='QR FPS '+(meterFrames*1000/(now-meterStart)).toFixed(0);
      meterFrames=0;meterStart=now;
    }
    meterRAF=requestAnimationFrame(measure);
  }
  meterRAF=requestAnimationFrame(measure);
}
function loadRadio(){
  if(radioLoading)return;
  radioLoading=true;site.src='../../radio/?qr=1';
}
function startAudio(){
  if(audioRequested||!finished)return;
  try{
    const w=site.contentWindow;
    if(!w||!w.GEQRIntroAudioReady||w.GEIAmStudio?.isRadioSuspended?.())return;
    const player=w.document.getElementById('player');
    if(!player||(!player.src&&!player.currentSrc))return;
    audioRequested=true;player.muted=false;player.defaultMuted=false;
    const p=player.play();if(p&&typeof p.catch==='function')p.catch(()=>{});
  }catch(_e){}
}
function finish(){
  if(finished)return;
  finished=true;
  gate.style.opacity='0';gate.classList.add('done');
  startAudio();
  if(!audioRequested)setTimeout(startAudio,700);
  setTimeout(()=>{
    try{history.replaceState({qrRadioArrival:true},'','../../radio/')}catch(_e){}
    try{site.contentWindow.focus()}catch(_e){}
  },450);
  if(meterRAF)cancelAnimationFrame(meterRAF);
  if(meter){meter.textContent+=' · DONE';setTimeout(()=>meter.remove(),1500);}
}
function fadeToRadio(){
  if(fadeStarted||!siteReady)return;
  fadeStarted=true;
  if(gate.animate){
    const a=gate.animate([{opacity:1},{opacity:0}],{duration:FADE_TIME,easing:'ease-in-out',fill:'forwards'});
    a.onfinish=finish;
  }else{
    gate.style.transition='opacity '+FADE_TIME+'ms ease-in-out';
    requestAnimationFrame(()=>gate.style.opacity='0');
    setTimeout(finish,FADE_TIME);
  }
}
let moonMotion=null,moonFinished=false;
site.addEventListener('load',()=>{
  if(!radioLoading)return;
  try{
    const url=site.contentWindow.location.href;
    if(!url.includes('/radio/')||!url.includes('qr=1'))return;
  }catch(_e){return;}
  siteReady=true;
  if(moonFinished)fadeToRadio();
});
function frames(duration,step,at){
  const stops=new Set([0,duration,STARS_ONLY,ZOOM_START,ZOOM_START+ZOOM_TIME,FLYBY_START,MOON_APPROACH_START]);
  for(let t=0;t<=duration;t+=step)stops.add(t);
  return [...stops].filter(t=>t>=0&&t<=duration).sort((a,b)=>a-b)
    .map(t=>({offset:t/duration,...at(t)}));
}
function animateScene(){
  const w=Math.max(1,window.innerWidth),h=Math.max(1,window.innerHeight);
  const sunBase=Math.min(Math.min(w,h)*.5,430),moonBase=Math.min(Math.min(w,h)*.29,255);
  // Nearly straight right-limb horizon; cap huge bitmap scaling to protect iPhone GPUs.
  const finalSunScale=Math.min(17.5,Math.max(13.5,3500/sunBase));
  const moonGoal=Math.max(1.1,Math.max(w,h)*1.12/moonBase);
  function sunAt(t){
    const zoom=clamp((t-ZOOM_START)/ZOOM_TIME),fly=smooth((t-FLYBY_START)/FLYBY_TIME);
    const scale=.76*Math.pow(finalSunScale/.76,Math.pow(zoom,2.65));
    const radius=sunBase*scale/(2*w);
    const edge=mix(mix(.5+radius,.5,smooth((zoom-.12)/.88)),-.2,fly);
    const cx=(edge-radius)*w;
    return {opacity:smooth((t-STARS_ONLY)/FADE_IN),
      transform:'translate3d('+(cx-w/2).toFixed(3)+'px,-50%,0) translate3d(-50%,0,0) scale3d('+scale.toFixed(6)+','+scale.toFixed(6)+',1)'};
  }
  function moonAt(t){
    const fly=smooth((t-FLYBY_START)/FLYBY_TIME);
    const zoom=smooth((t-MOON_APPROACH_START)/MOON_APPROACH_TIME);
    const scale=mix(.58,1.1,fly)*Math.pow(moonGoal/1.1,zoom);
    const x=mix(-10,-1,fly)*(1-zoom);
    return {opacity:smooth((t-STARS_ONLY)/FADE_IN),
      transform:'translate3d(calc(-50% + '+x.toFixed(4)+'vw),-50%,0) scale3d('+scale.toFixed(6)+','+scale.toFixed(6)+',1)'};
  }
  // Native compositor interpolates smooth 60Hz-or-higher frames independent
  // of JavaScript and page loading, with sparse motion control points.
  const opts={duration:FADE_START,fill:'forwards',easing:'linear'};
  let sunMotion=sunWrap.animate(frames(FADE_START,150,sunAt),opts);
  moonMotion=moonWrap.animate(frames(FADE_START,120,moonAt),opts);
  space.animate([
    {offset:0,opacity:1},
    {offset:(MOON_APPROACH_START+MOON_APPROACH_TIME*.54)/FADE_START,opacity:1},
    {offset:(MOON_APPROACH_START+MOON_APPROACH_TIME*.97)/FADE_START,opacity:0},
    {offset:1,opacity:0}
  ],opts);
  setTimeout(()=>{
    // Reclaim the huge Sun compositing surface before flying toward the moon.
    sunWrap.style.display='none';
    sunMotion.cancel();sunMotion=null;
  },MOON_APPROACH_START+140);
  moonMotion.onfinish=()=>{
    moonFinished=true;
    // Begin the expensive Radio iframe load AFTER the smooth moon zoom.
    // Hold the final moon frame until Radio actually paints, then dissolve.
    loadRadio();
    if(siteReady)fadeToRadio();
  };
}
if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){
  moonFinished=true;
  setTimeout(loadRadio,20);
}else if(sunWrap.animate&&moonWrap.animate){
  animateScene();
}else{
  // Older browser fallback: provide a working radio instead of hanging at the gate.
  moonFinished=true;setTimeout(loadRadio,100);
}
})();
</script>
</body>
</html>
