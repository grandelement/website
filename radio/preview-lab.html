<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 45% 0,#143658,#06172a 55%,#01040a);color:#eafaff;font:14px/1.45 system-ui,-apple-system,Arial,sans-serif}
button,a.button{display:inline-flex;justify-content:center;align-items:center;min-height:40px;padding:9px 12px;border:1px solid #4d94bb;border-radius:10px;background:#0b2841;color:white;font:800 13px system-ui,Arial;text-decoration:none;cursor:pointer}

/* Radio's Blue Sun entrance, water rings, blurred approach and access panel. */


/* INNER HORIZON 08: one explicit action path and true circular Souls. */
#arrivalPrivate,#arrivalPost{display:none!important}
button.soul-reflection-dot,.soul-reflection-dot{width:18px!important;height:18px!important;min-width:18px!important;min-height:18px!important;max-width:18px!important;max-height:18px!important;aspect-ratio:1/1!important;border-radius:50%!important;padding:0!important;box-sizing:border-box!important}
.soul-reflection-dot.draft{width:22px!important;height:22px!important;min-width:22px!important;min-height:22px!important;max-width:22px!important;max-height:22px!important;aspect-ratio:1/1!important;border-radius:50%!important;padding:0!important;box-sizing:border-box!important}
#reflectionControls{width:min(94%,760px)!important;display:grid!important;grid-template-columns:1fr 1fr 1fr 1fr!important;gap:8px!important}
#arrivalPostBtn:disabled{opacity:.38!important;pointer-events:none!important}
#geGate{position:fixed;inset:0;z-index:1000000;display:none;overflow:hidden;background:transparent;color:#effbff;isolation:isolate;touch-action:none}
#geGate.open{display:block}
#geGateBackdrop{
  position:absolute;inset:0;z-index:0;pointer-events:none;
  background:transparent;
  -webkit-backdrop-filter:blur(0px) saturate(1);
  backdrop-filter:blur(0px) saturate(1);
}
#geGateBackdrop::after{
  content:'';position:absolute;inset:0;pointer-events:none;background:#000;opacity:0;
}
/* Focus goes softer early, but the black dimmer takes the entire approach to build. */
#geGate.blurring #geGateBackdrop{
  animation:geGateBlurBuild var(--ge-gate-blur-build,16s) ease-in-out forwards;
}
#geGate.blurring #geGateBackdrop::after{
  animation:geGateDimBuild var(--ge-gate-dim-build,86s) linear forwards;
}
@keyframes geGateBlurBuild{
  0%{-webkit-backdrop-filter:blur(.2px) saturate(1);backdrop-filter:blur(.2px) saturate(1)}
  16%{-webkit-backdrop-filter:blur(2.2px) saturate(1.02);backdrop-filter:blur(2.2px) saturate(1.02)}
  28%{-webkit-backdrop-filter:blur(1.2px) saturate(1.01);backdrop-filter:blur(1.2px) saturate(1.01)}
  45%{-webkit-backdrop-filter:blur(5px) saturate(1.04);backdrop-filter:blur(5px) saturate(1.04)}
  58%{-webkit-backdrop-filter:blur(3.2px) saturate(1.03);backdrop-filter:blur(3.2px) saturate(1.03)}
  76%{-webkit-backdrop-filter:blur(9px) saturate(1.06);backdrop-filter:blur(9px) saturate(1.06)}
  88%{-webkit-backdrop-filter:blur(7px) saturate(1.05);backdrop-filter:blur(7px) saturate(1.05)}
  100%{-webkit-backdrop-filter:blur(var(--ge-gate-blur,12px)) saturate(1.07);backdrop-filter:blur(var(--ge-gate-blur,12px)) saturate(1.07)}
}
@keyframes geGateDimBuild{
  0%{opacity:0}
  28%{opacity:.035}
  48%{opacity:.10}
  68%{opacity:.22}
  84%{opacity:.42}
  100%{opacity:var(--ge-gate-dim,.75)}
}
#geGateWaves{position:absolute;inset:0;pointer-events:none;z-index:1;opacity:0;transition:opacity var(--ge-gate-wave-rise,10s) ease-in;overflow:hidden;transform:translateZ(0);will-change:opacity}
#geGate.waves #geGateWaves{opacity:1}
#geGate.centered #geGateWaves{opacity:0}
#geGateWaves::before{content:"";position:absolute;inset:0;pointer-events:none;-webkit-backdrop-filter:blur(.4px) saturate(1.01);backdrop-filter:blur(.4px) saturate(1.01);animation:geWaterLens 4.8s ease-in-out infinite;will-change:backdrop-filter}
.geGateFreqRing{position:absolute;left:50%;top:50%;width:11vmin;height:11vmin;margin:-5.5vmin 0 0 -5.5vmin;border-radius:50%;pointer-events:none;border:1.25px solid rgba(128,226,255,.34);box-shadow:0 0 18px rgba(50,185,255,.16),inset 0 0 10px rgba(165,240,255,.08);opacity:0;transform:translate3d(0,0,0) scale(.28);animation:geWaterFrequency var(--water-cycle,8.4s) linear infinite;animation-delay:var(--water-delay,0s);will-change:transform,opacity}
@keyframes geWaterFrequency{0%{transform:translate3d(0,0,0) scale(.28);opacity:0}8%{opacity:.22}34%{opacity:.42}70%{opacity:.20}100%{transform:translate3d(0,0,0) scale(12.5);opacity:0}}
@keyframes geWaterLens{0%,100%{-webkit-backdrop-filter:blur(.4px) saturate(1.01);backdrop-filter:blur(.4px) saturate(1.01)}35%{-webkit-backdrop-filter:blur(2.1px) saturate(1.025);backdrop-filter:blur(2.1px) saturate(1.025)}62%{-webkit-backdrop-filter:blur(4.4px) saturate(1.045);backdrop-filter:blur(4.4px) saturate(1.045)}82%{-webkit-backdrop-filter:blur(1.4px) saturate(1.02);backdrop-filter:blur(1.4px) saturate(1.02)}}
#geGateSunWrap{position:absolute;left:50%;top:50%;height:100svh;width:100svh;max-width:none;max-height:none;transform:translate(-50%,-50%);pointer-events:none;z-index:2}
#geGateSun{width:100%;height:100%;display:block;object-fit:cover;border-radius:50%;box-shadow:0 0 6svh rgba(35,175,255,.72),0 0 15svh rgba(0,128,255,.54),0 0 28svh rgba(0,96,255,.34),0 0 40svh rgba(0,75,255,.16);transform:translate3d(calc(50vw + 62svh),0,0) scale(.84);transform-origin:center center;will-change:transform,opacity,filter}
#geGatePanel{position:absolute;z-index:5;left:50%;top:62%;bottom:auto;transform:translate(-50%,18px);width:min(440px,88vw);max-width:88vw;padding:16px;border-radius:20px;border:1px solid rgba(94,205,255,.42);background:rgba(1,12,25,.78);box-shadow:0 14px 38px rgba(0,0,0,.48),0 0 24px rgba(34,161,255,.14);-webkit-backdrop-filter:blur(9px);backdrop-filter:blur(9px);opacity:0;pointer-events:none;transition:opacity 1.5s ease,transform 1.5s ease;text-align:center}
#geGate.centered #geGatePanel{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
#geGateTitle{font-size:clamp(19px,4.4vw,25px);font-weight:850;letter-spacing:.035em;margin:0 0 7px;color:#fff}
#geGateStatus{min-height:1.15em;margin:0 0 12px;font-size:clamp(13px,3.1vw,15px);color:#d9efff}
#geGateEntry{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:stretch}
#geGateWord{width:100%;min-width:0;min-height:46px;border:1px solid rgba(91,202,255,.56);border-radius:12px;background:rgba(0,5,13,.78);color:#f4fbff;padding:9px 11px;text-align:center;font:700 17px/1.2 system-ui;outline:none;letter-spacing:.12em}
#geGateWord:focus{border-color:rgba(114,229,255,.95);box-shadow:0 0 16px rgba(62,190,255,.24)}
#geGateEnter,#geGateHint,#geGateEmail,#geGateAccessSend{border:1px solid rgba(72,195,255,.60);border-radius:12px;background:rgba(7,45,75,.82);color:#f4fbff;font-weight:800}
#geGateEnter{min-height:46px;padding:8px 16px}
#geGateHint{margin:10px auto 0;min-height:38px;padding:7px 15px;font-size:14px}
#geGateHintText{min-height:1.4em;margin:9px 0 0;font-size:clamp(17px,4.25vw,22px);font-weight:750;line-height:1.25;color:#e8f9ff;text-shadow:0 2px 8px #000}
#geGateHelp{display:block;margin-top:12px;color:#d9f4ff}
#geGateHelp.show{display:block}
#geGateEmail{min-height:40px;padding:8px 16px}
#geGate.wrong #geGateWord{animation:geGateNudge .34s ease}@keyframes geGateNudge{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#geGate.unlocking #geGatePanel{opacity:0!important;pointer-events:none!important;transform:translate(-50%,24px)!important}
#geGate.unlocking #geGateWaves{opacity:0!important}
#geGate.unlocking #geGateSun{transform:translate3d(0,0,0) scale(7)!important;opacity:0!important;filter:brightness(1.55) saturate(1.35);transition:transform var(--ge-gate-unlock,6s) cubic-bezier(.18,.7,.16,1),opacity var(--ge-gate-unlock,6s) ease,filter var(--ge-gate-unlock,6s) ease!important}
#geGate.unlocking{background:rgba(0,0,0,0);transition:background var(--ge-gate-unlock,6s) ease}
#geGateAccessForm{display:none;margin-top:12px;padding:14px 12px;border:1px solid rgba(94,205,255,.30);border-radius:14px;background:rgba(0,8,18,.62);text-align:center}
#geGateAccessForm.show{display:block}
#geGateAccessText{margin:0 0 12px;color:#f2fbff;font:650 14px/1.45 system-ui}
/* Player Gate uses the verified listening-position timeline, not wall-clock animation. */
#geGate.blurring #geGateBackdrop{animation:none!important;-webkit-backdrop-filter:blur(var(--preview-blur,0px));backdrop-filter:blur(var(--preview-blur,0px))}
#geGate.blurring #geGateBackdrop::after{animation:none!important;opacity:var(--preview-dim,0)}
#geGateSun{transition:none!important}
#geGatePanel a.button{margin-top:4px}
</style>

<body>
<header><div><h1>GRAND ELEMENT · MUSIC</h1></div><a class="button" href="./">RETURN TO RADIO</a></header>
<main>
<section class="card">
  <div class="musicActionBar">
    <button id="musicListBtn" type="button" aria-expanded="false" aria-controls="musicListPanel" aria-pressed="false">MUSIC LIST</button>
    <div id="musicTransport" hidden>
      <span id="musicPlayingTitle" aria-live="polite"></span>
      <button id="musicPause" type="button">PAUSE</button>
      <button id="musicNext" type="button">NEXT</button>
    </div>
  </div>
  <div id="musicBrowser">
    <div class="musicBrowseTabs" role="group" aria-label="Music browser">
      <button id="browseAlbums" type="button" aria-pressed="true">ALBUMS</button>
      <button id="browsePlaylists" type="button" aria-pressed="false">PLAYLISTS</button>
    </div>
    <div id="albumWall" class="albumWall">Loading albums…</div>
    <div id="publicPlaylistWall" class="albumWall" hidden>Loading public playlists…</div>
    <div id="albumView" hidden>
      <div class="albumHeader"><button id="backAlbums" type="button">← ALBUMS</button><strong id="albumTitle">ALBUM</strong></div>
      <input type="search" id="search" placeholder="Find a song in this album" aria-label="Find a song">
      <div id="previewSelectionControls"><button id="playBrowserCollection" type="button">PLAY ALBUM</button><button id="addAlbumSongs" type="button">ADD WHOLE ALBUM</button><button id="addAllSongs" type="button">ADD ALL SONGS</button></div>
      <div id="songs"></div>
    </div>
  </div>
  <section id="musicListPanel" class="musicListPanel" aria-label="Music List" hidden>
    <div class="musicListToolbar">
      <input id="playlistSaveName" type="text" maxlength="80" placeholder="Playlist name" aria-label="Playlist name">
      <button id="playlistSave" type="button">SAVE PLAYLIST</button>
      <select id="playlistLoadSelect" aria-label="Saved playlists"><option value="">SAVED PLAYLISTS</option></select>
      <button id="playlistLoad" type="button">LOAD PLAYLIST</button>
      <button id="playlistDelete" type="button">DELETE</button>
    </div>
    <div class="musicListActions">
      <button id="musicPlaySelected" type="button">PLAY SELECTED</button>
      <button id="musicClearSelected" type="button">CLEAR</button>
      <span id="musicListCount">0 SONGS SELECTED</span>
    </div>
    <input id="musicListSearch" type="search" placeholder="Search all songs or albums" aria-label="Search all songs">
    <div id="musicListFeedback" role="status" aria-live="polite"></div>
    <div id="musicListGroups" aria-label="Albums and songs" role="group"></div>
  </section>
  <div id="status" class="srOnly" role="status" aria-live="polite"></div>
</section>
<audio id="audio" preload="none" playsinline webkit-playsinline crossorigin="anonymous"></audio>
</main>
<div id="geGate" role="dialog" aria-label="The Inner Frequency music preview gate" aria-hidden="true">
  <div id="geGateBackdrop"></div><div id="geGateWaves" aria-hidden="true"></div>
  <div id="geGateSunWrap" aria-hidden="true"><img id="geGateSun" alt="" src="../ge-images/images/ge-logo-2.jpg"></div>
  <section id="geGatePanel" aria-live="polite">
    <div id="geGateTitle">The Inner Frequency</div>
    <div id="geGateStatus">Your free music preview is ending. Enter an access code or explore music.</div>
    <div id="geGateEntry"><input id="geGateWord" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Access code" placeholder="CODE"><button id="geGateEnter" type="button">ACCESS</button></div>
    <div id="geGateHelp"><a class="button" href="../support/?section=music">EXPLORE MUSIC</a></div>
  </section>
</div>
<script src="./ge-gate-settings.js?v=20261017-gate-backroom-v1"></script>
<script src="./ge-gate-audio.js?v=20261017-water-reverb-33-v1"></script>
<script>
/* Former 33-second samples, merchandise queue and Soul Comet are preserved
   in preview-merch-legacy.html. Their feature flag is OFF in this player. */
const LEGACY_MERCH_PREVIEW_BUILDER_ENABLED=false;
const AUDIO_LIMIT_SECONDS=2013;
const STORE_KEY='GE_PLAYER_LISTENING_V2_3333', OWNER_KEY='GE_PLAYER_OWNER_DEMO_V1';
const $=id=>document.getElementById(id);
const audio=$('audio');
let albums=new Map(),selectedAlbum='',albumTracks=[],trackIndex=-1,currentTrack=null;
// Website planet PLAY passes its album in the URL. Honor it without adding a
// second player or bypassing the ordinary 33:33 music Gate.
const WEBSITE_ALBUM_REQUEST=String(new URLSearchParams(location.search).get('album')||'').trim();
let websiteAlbumStarted=false;
let publicPlaylistDefinitions=[],publicPlaylists=new Map(),selectedPlaylistId='',browserMode='albums',catalogTrackByPath=new Map();
let playingProgress=false,awaitingData=false,lastMedia=NaN,lastWall=performance.now();
let data={used:0,expired:false,gateStartedAtMs:0,gateAtSeconds:0},saveAt=0,baseVolume=1;
try{const saved=JSON.parse(localStorage.getItem(STORE_KEY)||'null');if(saved&&typeof saved==='object'){data.used=Math.max(0,Math.min(AUDIO_LIMIT_SECONDS,Number(saved.used)||0));data.expired=!!saved.expired||data.used>=AUDIO_LIMIT_SECONDS;
 data.gateStartedAtMs=Math.max(0,Number(saved.gateStartedAtMs)||0);
 data.gateAtSeconds=Math.max(0,Number(saved.gateAtSeconds)||0);}}catch(_e){}
let APPROACH_SECONDS,GRACE_SECONDS,FADE_SECONDS,GATE_AT,WAVE_AT,SUN_AT,CENTER_AT,FADE_AT,ENTRANCE_SECONDS;
function loadPreviewGateTimes(){
 const t=window.GEGateSettings?.get?.()||{sequenceSpeed:1.5,blurLeadSeconds:6,
  waveLeadSeconds:10,entranceSeconds:70,graceSeconds:11,fadeSeconds:33};
 const speed=Number(t.sequenceSpeed)||1.5;
 APPROACH_SECONDS=(t.blurLeadSeconds+t.waveLeadSeconds+t.entranceSeconds)/speed;
 GRACE_SECONDS=t.graceSeconds;FADE_SECONDS=t.fadeSeconds;
 GATE_AT=AUDIO_LIMIT_SECONDS-APPROACH_SECONDS-GRACE_SECONDS-FADE_SECONDS;
 WAVE_AT=GATE_AT+t.blurLeadSeconds/speed;
 SUN_AT=WAVE_AT+t.waveLeadSeconds/speed;
 ENTRANCE_SECONDS=t.entranceSeconds/speed;
 CENTER_AT=SUN_AT+ENTRANCE_SECONDS;
 FADE_AT=CENTER_AT+GRACE_SECONDS;
}
loadPreviewGateTimes();
window.addEventListener('ge-gate-settings-ready',()=>{
  if(!data.gateStartedAtMs&&!data.expired)loadPreviewGateTimes();
});
const gate=$('geGate'),sun=$('geGateSun');let gateShown=false;
function isAuthorized(){try{return localStorage.getItem(OWNER_KEY)==='yes'||localStorage.getItem('GE_GATE_LOVE_V1')==='1'}catch(_e){return false}}
function fmt(t){t=Math.max(0,Math.floor(Number(t)||0));return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
function say(message){$('status').textContent=message;if(!$('musicListPanel').hidden)$('musicListFeedback').textContent=message}
function save(force=false){
 const now=performance.now();if(!force&&now-saveAt<1700)return;saveAt=now;
 try{localStorage.setItem(STORE_KEY,JSON.stringify({used:data.used,expired:data.expired,gateStartedAtMs:data.gateStartedAtMs,gateAtSeconds:data.gateAtSeconds}))}catch(_e){}
}
function valid(t){if(!t||t.kind!=='song'||(t.duration_ms!=null&&(!Number.isFinite(Number(t.duration_ms))||Number(t.duration_ms)<0)))return false;
 try{const u=new URL(t.url,location.origin);return u.origin===location.origin&&/\/(?:website\/)?ge-music\/music\//.test(u.pathname)&&/\.(?:mp3|m4a|wav|ogg)$/i.test(u.pathname)}catch(_e){return false}}
function label(t){return (t.album||'Archive')+' · '+String(t.title||'Unknown').replace(/^\d+\s*/,'')}
function element(tag,text,klass=''){const e=document.createElement(tag);if(text!=null)e.textContent=text;if(klass)e.className=klass;return e}
function effectiveListeningSeconds(){
 if(!data.gateStartedAtMs)return data.used;
 // After the Gate begins the timeline advances even if Safari sleeps.
 const originalGateAt=data.gateAtSeconds||GATE_AT;
 return Math.min(AUDIO_LIMIT_SECONDS,originalGateAt+Math.max(0,(Date.now()-data.gateStartedAtMs)/1000));
}
function startSongGateIfReady(){
 if(data.expired||data.gateStartedAtMs||isAuthorized()||data.used<GATE_AT)return;
 data.gateStartedAtMs=Date.now()-Math.max(0,data.used-GATE_AT)*1000;
 data.gateAtSeconds=GATE_AT;
 save(true);schedulePreviewGateAudio();
}
function schedulePreviewGateAudio(){
 if(!data.gateStartedAtMs||data.expired||isAuthorized())return;
 const start=Number(data.gateStartedAtMs);
 const waves=start+(WAVE_AT-GATE_AT)*1000;
 const fade=start+(FADE_AT-GATE_AT)*1000;
 // Preserve the original 33:33 deadline even if Back Room times change.
 const end=start+(AUDIO_LIMIT_SECONDS-(data.gateAtSeconds||GATE_AT))*1000;

function ensureRings(){const waves=$('geGateWaves');if(waves.childElementCount)return;

function renderGate(){
 if(isAuthorized()){if(gateShown){gate.className='';gate.setAttribute('aria-hidden','true');gateShown=false;}return;}
 const used=effectiveListeningSeconds();
 if(used<GATE_AT&&!data.expired)return;
 if(!gateShown){gate.classList.add('open','blurring');gate.setAttribute('aria-hidden','false');gateShown=true;ensureRings();}
 const elapsed=Math.max(0,used-GATE_AT);
 gate.style.setProperty('--preview-blur',(12*Math.min(1,elapsed/(16/1.5))).toFixed(2)+'px');
 gate.style.setProperty('--preview-dim',(.75*Math.min(1,elapsed/APPROACH_SECONDS)).toFixed(3));
 gate.classList.toggle('waves',used>=WAVE_AT&&used<CENTER_AT);
 gate.classList.toggle('sun-moving',used>=SUN_AT);
 gate.classList.toggle('centered',used>=CENTER_AT||data.expired);
 const progress=Math.max(0,Math.min(1,(used-SUN_AT)/Math.max(.1,ENTRANCE_SECONDS)));
 sun.style.transform='translate3d('+((innerWidth*.5+innerHeight*.62)*(1-progress)).toFixed(1)+'px,0,0) scale('+(0.84+0.16*progress).toFixed(3)+')';
 $('geGateStatus').textContent=data.expired?'33:33 listening complete. Enter an access code or explore music.':
   used>=FADE_AT?'Preview ending. The final '+FADE_SECONDS+' seconds fade to silence.':
   'Enter an access code or explore music.';
}
function renderVolume(){

 if(isAuthorized()||elapsed<FADE_AT)return;
 const p=Math.max(0,Math.min(1,(elapsed-FADE_AT)/FADE_SECONDS));
 if(!window.GEAudioGain?.getStatus?.().active)audio.volume=Math.max(0,Math.min(1,baseVolume*(1-p)));

function expireGate(){

function isLocked(){

function isCounting(){return !data.gateStartedAtMs&&!isAuthorized()&&!!currentTrack&&!audio.paused&&!audio.ended&&!awaitingData&&!audio.seeking&&audio.readyState>=2&&playingProgress&&!data.expired;}
function syncListening(){
 const wall=performance.now(),media=Number(audio.currentTime);

   const actual=media-lastMedia,wallSeconds=Math.max(0,(wall-lastWall)/1000);
   if(actual>0&&actual<=wallSeconds+.5){
     data.used=Math.min(AUDIO_LIMIT_SECONDS,data.used+actual);
     startSongGateIfReady();save();
     if(data.used>=AUDIO_LIMIT_SECONDS)expireGate();
   }
 }
 lastMedia=Number.isFinite(media)?media:NaN;lastWall=wall;
 if(!isAuthorized()&&!data.expired&&effectiveListeningSeconds()>=AUDIO_LIMIT_SECONDS)expireGate();
 if(!data.expired&&!isAuthorized()){

function musicAlbumRank(name){
 const key=String(name||'').toLowerCase().replace(/[^a-z0-9]/g,'');
 if(key==='fundamentalgroove')return 99999;
 const i=MUSIC_ALBUM_RECENT_FIRST.findIndex(n=>n.toLowerCase().replace(/[^a-z0-9]/g,'')===key);
 return i<0?999:i;
}

// Song-duration metadata can lag behind the GitHub music files. Load the
// manifest as a fallback, then use the real repository tree when available.
// MUSIC and the main RADIO title both route here for guest song selection.
function cleanMusicPath(input){
 const path=String(input||'').replace(/^\/+/, '');
 return /^ge-music\/music\/.+\/[^/]+\.(mp3|m4a|ogg|wav)$/i.test(path)
   && !path.split('/').some(part=>part==='.'||part==='..')?path:'';
}
function trackFromMusicPath(path){
 const components=path.split('/');
 const folder=components.slice(2,-1).join('/');
 const album=folder.replace(/^Grand Element - (?:\d{4} - )?/i,'')||'Grand Element';
 const file=components[components.length-1].replace(/\.(mp3|m4a|ogg|wav)$/i,'');
 const numbered=file.match(/^.+?_(\d{1,3})[_ -]+(.+)$/);
 const title=numbered?(numbered[1]+' '+numbered[2].replace(/[_-]+/g,' ')):
   file.replace(/^Singles_/i,'').replace(/_/g,' ');
 return {kind:'song',path,album,title,duration_ms:0,
   url:'/'+components.map(encodeURIComponent).join('/')};
}
function displayCatalog(tracks,restore=false){
 const previous=selectedAlbum,previousPlaylist=selectedPlaylistId,previousMode=browserMode;
 albums=new Map();
 for(const t of tracks){
   if(!valid(t))continue;
   const list=albums.get(t.album||'Other')||[];
   list.push(t);albums.set(t.album||'Other',list);
 }
 for(const list of albums.values())list.sort((a,b)=>{
   const an=Number((a.title||'').match(/^\d+/)?.[0])||999;
   const bn=Number((b.title||'').match(/^\d+/)?.[0])||999;
   return an-bn||label(a).localeCompare(label(b));
 });
 if(restore)restoreSelected(tracks.filter(valid));
 else{
   const lookup=new Map(tracks.filter(valid).map(t=>[t.path,t]));
   selectedSongs=selectedSongs.map(t=>lookup.get(t.path)).filter(Boolean);
   renderSelected();
 }
 catalogTrackByPath=new Map(tracks.filter(valid).map(t=>[cleanMusicPath(t.path),t]).filter(([path])=>path));
 rebuildPublicPlaylists();
 showAlbums();
 renderMusicList();
 if(!$('albumView').hidden){
   if(previousMode==='playlists'&&publicPlaylists.has(previousPlaylist)){
     selectedPlaylistId=previousPlaylist;showSongs();
   }else if(previousMode==='albums'&&albums.has(previous)){
     selectedAlbum=previous;showSongs();
   }else switchMusicBrowse(previousMode);
 }
 say(tracks.filter(valid).length+' songs available. Choose an album or public playlist.');
 // Open exactly the requested album after the catalog is available. On supported
 // browsers try the first song; on gesture-restricted phones leave it prepared
 // and provide the existing PLAY / PAUSE button to begin listening.
 if(WEBSITE_ALBUM_REQUEST&&!websiteAlbumStarted){
   const match=[...albums.keys()].find(name=>name.toLowerCase()===WEBSITE_ALBUM_REQUEST.toLowerCase());
   if(match){
     websiteAlbumStarted=true;
     openAlbum(match);
     const songs=albums.get(match)||[];
     if(songs.length){
       playingSelected=false;albumTracks=songs.slice();trackIndex=0;
       void startTrack(songs[0]);
     }
   }
 }
}
function rebuildPublicPlaylists(){
 const result=new Map();
 for(const item of publicPlaylistDefinitions){
   if(!item||!item.id||!item.name||!Array.isArray(item.songs))continue;
   const seen=new Set(),songs=[];
   for(const file of item.songs){
     const path=cleanMusicPath(file);
     if(!path||seen.has(path))continue;
     const t=catalogTrackByPath.get(path);
     if(!t)continue;
     seen.add(path);songs.push(t);
   }
   if(songs.length)result.set(String(item.id),{name:String(item.name),tracks:songs});
 }
 publicPlaylists=result;showPublicPlaylists();refreshSavedPlaylistSelect();
}
async function loadPublicPlaylists(){
 try{
   const response=await fetch('../config/site-live.json?public-playlists='+Date.now(),{cache:'no-store'});
   if(!response.ok)throw Error('Published site settings unavailable');
   const data=await response.json();
   publicPlaylistDefinitions=Array.isArray(data.music?.publicPlaylists)?data.music.publicPlaylists:[];
   rebuildPublicPlaylists();
 }catch(error){
   console.warn('Published playlist settings unavailable:',error);
   publicPlaylistDefinitions=[];rebuildPublicPlaylists();
 }
}
async function loadCompleteMusicCatalog(){
 let durationTracks=[];
 try{
   const response=await fetch('./track-durations.json',{cache:'no-store'});
   if(!response.ok)throw Error('Song durations '+response.status);
   const data=await response.json();
   durationTracks=(Array.isArray(data.tracks)?data.tracks:[]).filter(valid);
 }catch(error){console.warn('Song duration metadata unavailable:',error);}
 const known=new Map(durationTracks.map(t=>[cleanMusicPath(t.path),t]).filter(([path])=>path));
 // The manifest is a fallback for offline or GitHub API-limited listeners.
 let fallbackPaths=[];
 try{
   const response=await fetch('./manifest.json',{cache:'no-store'});
   if(response.ok){
     const data=await response.json();
     fallbackPaths=(Array.isArray(data.files)?data.files:[]).map(cleanMusicPath).filter(Boolean);
   }
 }catch(error){console.warn('Music manifest unavailable:',error);}
 const initialPaths=[...new Set([...known.keys(),...fallbackPaths])];
 if(initialPaths.length)displayCatalog(initialPaths.map(p=>known.get(p)||trackFromMusicPath(p)),true);
 else{$('albumWall').textContent='Unable to load music.';say('Music catalog unavailable.');}
 try{
   const url='https://api.github.com/repos/grandelement/website/git/trees/main?recursive=1';
   const response=await fetch(url,{cache:'no-store'});
   if(!response.ok)throw Error('GitHub music listing '+response.status);
   const data=await response.json();
   if(!Array.isArray(data.tree)||data.truncated)throw Error('Incomplete GitHub music listing');
   const paths=[...new Set(data.tree.filter(t=>t.type==='blob').map(t=>cleanMusicPath(t.path)).filter(Boolean))];
   if(paths.length){
     const current=initialPaths.slice().sort().join('\n');
     const newest=paths.slice().sort().join('\n');
     if(current!==newest)displayCatalog(paths.map(p=>known.get(p)||trackFromMusicPath(p)));
   }
 }catch(error){console.warn('Using saved music listing:',error);}
}
void loadCompleteMusicCatalog();
void loadPublicPlaylists();
baseVolume=Math.max(.01,Number(audio.volume)||1);
if(!data.expired&&!isAuthorized()&&effectiveListeningSeconds()>=AUDIO_LIMIT_SECONDS)expireGate();
if(data.expired||data.gateStartedAtMs)renderGate();
refreshSavedPlaylistSelect();
</script>
