<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="manifest" href="./manifest.webmanifest">

<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">

<link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
<title>Grand Element Radio</title>
<style>
:root{
  --fg:#e8f6ff;
  --muted:#a6bdd0;
  --accent:#00ffa8;
  --btn-bg:rgba(13,27,38,.72);
  --btn-br:#27455e;
  --bg-x:50%;
  --bg-y:50%;
  --bg-shift-y:0vh;
  --bg-scale:1.08;
}
*{box-sizing:border-box;scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none}
html,body{min-height:100%;margin:0;background:#000;color:var(--fg);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;overscroll-behavior:none}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);touch-action:manipulation}
#bgImage{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  object-fit:cover;
  object-position:var(--bg-x) var(--bg-y);
  transform:translate3d(0,var(--bg-shift-y),0) scale(var(--bg-scale));
  transform-origin:center center;
  z-index:0;
  pointer-events:none;
  background:#000;
  transition:opacity .2s ease;
}
#shade{position:fixed;inset:0;z-index:1;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,.12),rgba(0,0,0,.30))}
#hudTap{position:fixed;inset:0;z-index:9998;display:none;background:transparent}
body.hud-hidden #hudTap{display:block}
.wrap{position:relative;z-index:2;min-height:100svh;display:flex;flex-direction:column;align-items:center;gap:15px;padding:28px 18px 36px;text-align:center;max-width:900px;margin:0 auto;transition:opacity .25s ease}
body.hud-hidden .wrap{opacity:0;pointer-events:none}
.logo-wrap{width:min(234px,25.2vw);height:min(234px,25.2vw);border-radius:50%;overflow:hidden;display:block;margin:0 auto;box-shadow:0 0 0 2px rgba(255,255,255,.15) inset,0 8px 28px rgba(0,0,0,.6)}
.logo{width:100%;height:100%;object-fit:cover;object-position:center}
h1{margin:6px 0 0;font-size:clamp(20px,4.2vw,32px)}
.tag{opacity:.9;font-size:clamp(14px,3.6vw,18px)}
.row{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px;width:100%}
.group{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center;padding:10px 12px;border-radius:14px;background:rgba(24,28,34,.60);border:1px solid rgba(80,110,140,.45);width:min(760px,96vw);backdrop-filter:blur(3px)}
button,.button-link{appearance:none;border:1px solid var(--btn-br);background:var(--btn-bg);color:var(--fg);padding:10px 13px;border-radius:11px;font-weight:750;letter-spacing:.2px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;min-height:42px;-webkit-tap-highlight-color:transparent}
button:active,.button-link:active{transform:scale(.97)}
button.tgl[aria-pressed="true"]{outline:2px solid var(--accent);box-shadow:0 0 18px rgba(0,255,168,.20) inset}
#musicGroup{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;width:min(760px,96vw)}
#musicGroup button{min-width:0;padding-inline:8px}
#player{width:min(760px,96vw);background:rgba(0,0,0,.35)}
#titleBtn{max-width:min(760px,92vw);border-radius:999px;overflow:hidden;text-overflow:ellipsis}
#trackList{display:none;max-height:72vh;overflow-y:auto;-webkit-overflow-scrolling:touch;width:min(760px,96vw);text-align:left;background:rgba(24,28,34,.78);border:1px solid rgba(80,110,140,.45);border-radius:13px;padding:8px;backdrop-filter:blur(4px)}
#trackList button{display:block;width:100%;text-align:left;background:transparent;border:0;color:var(--fg);padding:9px 11px;min-height:0;border-radius:8px;font-weight:600;white-space:normal}
#trackList button.current{background:rgba(0,255,168,.15);outline:1px solid rgba(0,255,168,.55)}
#bgGroup{display:flex;flex-direction:column;gap:10px}
#bgGroup .bg-row{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;width:100%}
#bgGroup button{min-width:0;padding-inline:6px}
.section-label{font-weight:800}
.settings-row{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;background:rgba(24,28,34,.56);padding:8px 12px;border-radius:12px}
.settings-row label{display:flex;gap:9px;align-items:center;font-weight:750}
.bc-btn{padding:14px 28px;border-radius:16px;background:#ff4f1f;color:#fff;font-weight:800;text-decoration:none;box-shadow:0 10px 28px rgba(255,79,31,.38)}
.offline-row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;width:min(760px,96vw)}
#offlineBtn.active{background:#0e2f1f;border-color:#1f6b4d;color:#b8ffdf}
#offlineBtn.downloading{background:#2a2130;border-color:#5b3a5f}
#installBtn{display:none}
#offlinePanel{display:none;width:min(760px,96vw);padding:10px 12px;border-radius:12px;background:rgba(24,28,34,.72);border:1px solid rgba(80,110,140,.45)}
#offlineBarTrack{height:11px;border-radius:999px;background:rgba(255,255,255,.15);overflow:hidden}
#offlineBar{height:100%;width:0;background:#1fd15b;border-radius:999px;transition:width .15s linear}
#offlineText{display:none!important}
#status{display:none!important}
footer{padding-top:4px}
@media(max-width:520px){
  .wrap{padding-inline:10px}
  #musicGroup{gap:5px}
  #musicGroup button{font-size:12px;padding:9px 4px}
  #bgGroup .bg-row{gap:4px}
  #bgGroup button{font-size:11px;padding:9px 3px}
  .logo-wrap{width:min(198px,40.5vw);height:min(198px,40.5vw)}
}
</style>
</head>
<body>
<img id="bgImage" alt="" aria-hidden="true">
<div id="shade"></div>
<div id="hudTap" title="Tap to show controls"></div>
<main class="wrap">
  <header>
    <a class="logo-wrap" id="homeLink" href="https://www.grandelement.com/" rel="noopener">
      <img class="logo" id="geLogo" alt="Grand Element">
    </a>
    <h1>Grand Element Radio</h1>
    <div class="tag">music to set your soul free</div>
  </header>

  <button id="titleBtn" type="button" aria-expanded="false">Loading music…</button>
  <audio id="player" controls preload="auto" playsinline controlslist="nodownload noplaybackrate"></audio>

  <div id="musicGroup">
    <button id="prevBtn">Prev</button>
    <button id="nextBtn">Next</button>
    <button class="tgl" id="shuffleBtn" aria-pressed="true">Shuffle</button>
    <button class="tgl" id="legacyBtn" aria-pressed="false">Legacy</button>
    <button id="shareBtn">Share</button>
  </div>

  <div class="settings-row">
    <label><input type="checkbox" id="hudAutoHide" checked> Hide text</label>
  </div>

  <div id="trackList"></div>

  <section class="group" id="bgGroup">
    <span class="section-label">Backgrounds</span>
    <div class="bg-row">
      <button class="tgl" id="bgOff" aria-pressed="false">Off</button>
      <button id="bgPrev">Prev</button>
      <button id="bgNext">Next</button>
      <button class="tgl" id="bgPer" aria-pressed="true">Per Song</button>
      <button class="tgl" id="bgShuf" aria-pressed="true">Shuffle</button>
      <button class="tgl" id="bgAuto" aria-pressed="false">Auto</button>
    </div>
  </section>

  <div>Support the project below.</div>
  <a class="bc-btn" href="https://grandelement.bandcamp.com" target="_blank" rel="noopener">Buy on Bandcamp</a>

  <div class="offline-row">
    <button id="offlineBtn">Go Offline</button>
    <button id="reloadBtn">Reload Library</button>
    <button id="installBtn">Install App</button>
  </div>
  <div id="offlinePanel">
    <div id="offlineBarTrack"><div id="offlineBar"></div></div>
    <div id="offlineText"></div>
  </div>
  <div id="status" role="status" aria-live="polite"></div>
  <footer>Much Love!!</footer>
</main>

<script>
'use strict';

const CONFIG = Object.freeze({
  APP_VERSION: '2026.08.09-smart-reload-1',
  LOGO_SRC: '../ge-images/images/ge-logo-2.jpg',
  HOME_URL: 'https://grandelement.github.io/website/',
  MUSIC_MANIFEST: './manifest.json',
  MUSIC_BASE: '../ge-music/',
  IMAGE_MANIFEST: '../ge-images/img/manifest.json',
  IMAGE_BASE: '../ge-images/img/',
  INTRO_BG: '1.gif',
  BG_AUTO_SECONDS: 33,
  BG_X: '50%',
  BG_Y: '50%',
  BG_SHIFT_Y: '0vh',
  BG_SCALE: '1.08',
  STATION_ID_FILES: [0,1,2,3,4,5,6,9],
  STATION_ID_MIN_SONGS: 4,
  STATION_ID_MAX_SONGS: 6,
  SHUFFLE_AVOID_LAST: 4,
  OFFLINE_CACHE: 'ge-radio-media-v4',
  OFFLINE_KEY: 'GE_OFFLINE_ACTIVE_V4',
  HUD_KEY: 'GE_HUD_AUTOHIDE_V2',
  HUD_IDLE_MS: 15000,
  GITHUB_TREE_API: 'https://api.github.com/repos/grandelement/website/git/trees/main?recursive=1',
  MEDIA_SHA_KEY: 'GE_REPO_MEDIA_SHA_V1',
  BACKGROUND_FOCAL: {
    // This creates real movement even when cover has no vertical crop.
    // Add a filename here when one picture needs its own optical adjustment.
    '17.gif': {x:'50%', y:'50%', shift:'0vh', scale:'1.10'}
  }
});

const CORE_ALBUMS = Object.freeze(['Intergy','Love','Soul','Spirit','Fire']);
const LEGACY_ALBUMS = Object.freeze(['Fundamental Groove','Trio','Live','Sessions I','Sessions II']);
const ALBUM_ORDER = Object.freeze(['Fundamental Groove','Trio','Live','Sessions I','Sessions II','Intergy','Love','Soul','Spirit','Fire']);

const $ = id => document.getElementById(id);
const audio = $('player');
const titleBtn = $('titleBtn');
const trackList = $('trackList');
const statusEl = $('status');

function setStatus(text){ statusEl.textContent = text || ''; }
function setPressed(button,on){ if(button) button.setAttribute('aria-pressed', on ? 'true' : 'false'); }
function absolute(path){ return new URL(path, location.href).href; }
function fileName(url){ return decodeURIComponent(new URL(url, location.href).pathname.split('/').pop() || ''); }
function stripExtension(name){ return String(name||'').replace(/\.[a-z0-9]+$/i,''); }
function cleanAlbumName(name){ return String(name||'').replace(/^Grand Element\s*-\s*\d{4}\s*-\s*/i,'').trim(); }
function isStationID(url){ return /\/clips\/.*GE(?:%20| )Station(?:%20| )Identification/i.test(String(url||'')); }
function albumNameFromURL(url){
  const decoded = decodeURI(String(url||''));
  const folder = decoded.match(/Grand Element - \d{4} - ([^/]+)\//i);
  if(folder) return cleanAlbumName(folder[1]);
  return parseTrack(url).album;
}
function parseTrack(url){
  const base = stripExtension(fileName(url)).replace(/\+/g,' ');
  const match = base.match(/^(.*?)[ _-]+(\d{1,3})[ _-]+(.+)$/);
  if(match){
    return {album:cleanAlbumName(match[1].replace(/[_-]+/g,' ').trim()),track:Number(match[2]),song:match[3].replace(/[_-]+/g,' ').trim()};
  }
  return {album:'Grand Element',track:0,song:base.replace(/[_-]+/g,' ').trim() || 'Track'};
}
function albumRank(url){
  const album = albumNameFromURL(url).toLowerCase();
  const rank = ALBUM_ORDER.findIndex(item=>item.toLowerCase()===album);
  return rank < 0 ? 999 : rank;
}
function orderedSort(a,b){
  const albumDifference = albumRank(a)-albumRank(b);
  if(albumDifference) return albumDifference;
  const trackDifference = parseTrack(a).track-parseTrack(b).track;
  return trackDifference || a.localeCompare(b);
}
function isCore(url){ return CORE_ALBUMS.some(name=>name.toLowerCase()===albumNameFromURL(url).toLowerCase()); }
function isLegacy(url){ return LEGACY_ALBUMS.some(name=>name.toLowerCase()===albumNameFromURL(url).toLowerCase()); }
function isSingles(url){ return albumNameFromURL(url).toLowerCase()==='singles' || decodeURI(url).toLowerCase().includes('singles'); }
function displayTitle(url,withNumber=false){
  if(isStationID(url)) return 'GE Station Identification';
  const item = parseTrack(url);
  const number = withNumber && item.track ? ` • ${String(item.track).padStart(2,'0')}` : '';
  return `${item.album}${number} • ${item.song}`;
}
function randomInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function shuffleArray(items){
  const copy=items.slice();
  for(let i=copy.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [copy[i],copy[j]]=[copy[j],copy[i]]; }
  return copy;
}

function repoPathToURL(path){
  return absolute('../'+String(path||'').replace(/^\/+/,''));
}
function urlToRepoPath(url){
  try{
    return decodeURIComponent(new URL(url,location.href).pathname).replace(/^\/+/,'');
  }catch(_e){ return ''; }
}
async function fetchRepositoryTree(){
  const target=new URL(CONFIG.GITHUB_TREE_API);
  target.searchParams.set('_ge_reload',String(Date.now()));
  const response=await fetch(target.href,{cache:'no-store'});
  if(!response.ok) throw new Error(`GitHub tree ${response.status}`);
  const data=await response.json();
  if(!data || !Array.isArray(data.tree)) throw new Error('GitHub tree response was incomplete');
  return data.tree;
}
function libraryFromRepositoryTree(tree){
  const audioItems=[];
  const backgroundItems=[];
  const tracked={};

  for(const item of tree){
    if(!item || item.type!=='blob' || !item.path) continue;
    const path=String(item.path);
    const lower=path.toLowerCase();

    const isAudio=/\.(mp3|m4a|ogg|wav)$/i.test(path);
    const isImage=/\.(gif|png|jpe?g|webp)$/i.test(path);

    if(isAudio && (lower.startsWith('ge-music/music/') || lower.startsWith('ge-music/clips/'))){
      tracked[path]=item.sha||'';
      if(lower.startsWith('ge-music/music/')){
        const url=repoPathToURL(path);
        if(!isStationID(url) && !isSingles(url)) audioItems.push(url);
      }
      continue;
    }

    if(isImage && lower.startsWith('ge-images/img/')){
      tracked[path]=item.sha||'';
      backgroundItems.push(path.slice('ge-images/img/'.length));
    }
  }

  return {
    catalog:[...new Set(audioItems)].sort(orderedSort),
    backgrounds:[...new Set(backgroundItems)].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true,sensitivity:'base'})),
    shaMap:tracked
  };
}
function loadMediaShaMap(){
  try{
    const value=JSON.parse(localStorage.getItem(CONFIG.MEDIA_SHA_KEY)||'{}');
    return value && typeof value==='object' && !Array.isArray(value) ? value : {};
  }catch(_e){ return {}; }
}
function saveMediaShaMap(map){
  try{ localStorage.setItem(CONFIG.MEDIA_SHA_KEY,JSON.stringify(map||{})); }catch(_e){}
}
function comparableHeader(response,name){
  return String(response?.headers?.get(name)||'').trim();
}
async function networkHead(url){
  try{
    const response=await fetch(url,{method:'HEAD',cache:'no-store'});
    return response.ok?response:null;
  }catch(_e){ return null; }
}
async function cachedFileLooksChanged(url,cache){
  const cached=await cache.match(url,{ignoreSearch:true});
  if(!cached) return false;

  const head=await networkHead(url);
  if(!head) return false;

  const keys=['etag','last-modified','content-length'];
  let comparable=0;
  for(const key of keys){
    const oldValue=comparableHeader(cached,key);
    const newValue=comparableHeader(head,key);
    if(oldValue && newValue){
      comparable++;
      if(oldValue!==newValue) return true;
    }
  }
  return false;
}
async function fetchFreshMedia(url){
  const response=await fetch(url,{
    cache:'no-store',
    headers:{'X-GE-Reload-Media':'1'}
  });
  if(!response.ok) throw new Error(`${response.status} ${url}`);
  return response;
}
async function refreshMediaCacheFromTree(oldShaMap,newShaMap,{offlineActive=false}={}){
  const cache=await caches.open(CONFIG.OFFLINE_CACHE);
  const oldKeys=Object.keys(oldShaMap||{});
  const newKeys=Object.keys(newShaMap||{});
  const hasOldBaseline=oldKeys.length>0;

  const changedPaths=[];
  const addedPaths=[];
  const removedPaths=[];

  if(hasOldBaseline){
    for(const path of newKeys){
      if(!(path in oldShaMap)) addedPaths.push(path);
      else if(oldShaMap[path]!==newShaMap[path]) changedPaths.push(path);
    }
    for(const path of oldKeys){
      if(!(path in newShaMap)) removedPaths.push(path);
    }
  }else{
    // First run after installing this smarter updater:
    // compare cached response metadata with the live file so same-name
    // replacements that happened before this version can still be found.
    const cachedKeys=await cache.keys();
    const candidates=cachedKeys
      .map(request=>request.url)
      .filter(url=>{
        const path=urlToRepoPath(url);
        return path in newShaMap;
      });

    const workers=6;
    let cursor=0;
    async function worker(){
      while(cursor<candidates.length){
        const url=candidates[cursor++];
        if(await cachedFileLooksChanged(url,cache)){
          changedPaths.push(urlToRepoPath(url));
        }
      }
    }
    await Promise.all(Array.from({length:Math.min(workers,candidates.length||1)},worker));

    for(const path of newKeys){
      const url=repoPathToURL(path);
      const hit=await cache.match(url,{ignoreSearch:true});
      if(!hit) addedPaths.push(path);
    }
  }

  let refreshed=0;
  let addedOffline=0;
  let removed=0;
  let failed=0;

  for(const path of removedPaths){
    const url=repoPathToURL(path);
    if(await cache.delete(url,{ignoreSearch:true})) removed++;
  }

  const refreshSet=[...new Set(changedPaths)];
  for(const path of refreshSet){
    const url=repoPathToURL(path);
    try{
      const response=await fetchFreshMedia(url);
      await cache.put(url,response.clone());
      refreshed++;
    }catch(_e){ failed++; }
  }

  if(offlineActive){
    const addSet=[...new Set(addedPaths.filter(path=>!refreshSet.includes(path)))];
    for(const path of addSet){
      const url=repoPathToURL(path);
      try{
        const response=await fetchFreshMedia(url);
        await cache.put(url,response.clone());
        addedOffline++;
      }catch(_e){ failed++; }
    }
  }

  return {
    refreshed,
    addedOffline,
    removed,
    failed,
    changedPaths:[...new Set(changedPaths)],
    addedPaths:[...new Set(addedPaths)],
    removedPaths:[...new Set(removedPaths)]
  };
}

const state = {
  catalog:[],
  queue:[],
  currentURL:'',
  shuffle:true,
  legacy:false,
  history:[],
  historyPos:-1,
  recent:[],
  pendingAfterStation:null,
  stationCountdown:randomInt(CONFIG.STATION_ID_MIN_SONGS,CONFIG.STATION_ID_MAX_SONGS),
  playToken:0,
  userStarted:false
};

function allowedCatalog(){
  return state.catalog.filter(url=>!isSingles(url) && (isCore(url) || (state.legacy && isLegacy(url)))).sort(orderedSort);
}
function rebuildQueue(anchor=state.currentURL){
  state.queue = allowedCatalog();
  if(anchor && !state.queue.includes(anchor) && !isStationID(anchor)) anchor='';
  renderTrackList();
  return anchor;
}
function syncModeButtons(){
  setPressed($('shuffleBtn'),state.shuffle);
  setPressed($('legacyBtn'),state.legacy);
}
function rememberRecent(url){
  if(!url || isStationID(url)) return;
  state.recent=[url,...state.recent.filter(item=>item!==url)].slice(0,CONFIG.SHUFFLE_AVOID_LAST);
}
function recordHistory(url){
  if(!url || isStationID(url)) return;
  if(state.historyPos < state.history.length-1) state.history=state.history.slice(0,state.historyPos+1);
  if(state.history[state.history.length-1]!==url) state.history.push(url);
  state.historyPos=state.history.length-1;
  rememberRecent(url);
}
function pickWeightedShuffle(){
  const all=allowedCatalog();
  if(!all.length) return '';
  const recent=new Set(state.recent);
  const available=all.filter(url=>!recent.has(url));
  const pool=available.length?available:all;
  const core=pool.filter(isCore);
  const legacy=pool.filter(isLegacy);
  let chosenPool=core.length?core:pool;
  if(state.legacy && core.length && legacy.length) chosenPool=Math.random()<1/3?legacy:core;
  return chosenPool[Math.floor(Math.random()*chosenPool.length)] || '';
}
function nextSequential(step=1){
  const queue=allowedCatalog();
  if(!queue.length) return '';
  const current=queue.indexOf(state.currentURL);
  const start=current>=0?current:0;
  return queue[(start+step+queue.length)%queue.length];
}
function nextShuffle(){
  if(state.historyPos>=0 && state.historyPos<state.history.length-1){
    state.historyPos++;
    return {url:state.history[state.historyPos],record:false};
  }
  return {url:pickWeightedShuffle(),record:true};
}
function previousShuffle(){
  if(state.historyPos>0){
    state.historyPos--;
    return state.history[state.historyPos];
  }
  return '';
}
function shouldInsertStation(){
  return state.stationCountdown<=0 && CONFIG.STATION_ID_FILES.length>0;
}
function stationURL(){
  const number=CONFIG.STATION_ID_FILES[Math.floor(Math.random()*CONFIG.STATION_ID_FILES.length)];
  return absolute(`${CONFIG.MUSIC_BASE}clips/GE Station Identification - ${number}.m4a`);
}

function updateMediaSession(url){
  if(!('mediaSession' in navigator)) return;
  try{
    navigator.mediaSession.metadata=new MediaMetadata({
      title:displayTitle(url,!state.shuffle),
      artist:'Grand Element Radio',
      album:isStationID(url)?'Grand Element Radio':parseTrack(url).album,
      artwork:[{src:absolute(CONFIG.LOGO_SRC),sizes:'512x512',type:'image/jpeg'}]
    });
    const safe=(action,handler)=>{ try{ navigator.mediaSession.setActionHandler(action,handler); }catch(_e){} };
    safe('previoustrack',()=>previousTrack(true));
    safe('nexttrack',()=>nextTrack(true));
    safe('play',()=>resumeAudio());
    safe('pause',()=>audio.pause());
  }catch(_e){}
}
function updateCurrentRow(){
  trackList.querySelectorAll('button[data-url]').forEach(button=>button.classList.toggle('current',button.dataset.url===state.currentURL));
}
function backgroundForNewSong(){ if(window.GEBackgrounds) window.GEBackgrounds.onSongStart(); }

async function playURL(url,{record=false,backgroundChange=false,userAction=false}={}){
  if(!url) return;
  const token=++state.playToken;
  state.currentURL=url;
  titleBtn.textContent=displayTitle(url,!state.shuffle);
  updateCurrentRow();
  updateMediaSession(url);
  if(!isStationID(url)){
    if(record && state.shuffle) recordHistory(url); else rememberRecent(url);
    if(backgroundChange) backgroundForNewSong();
  }
  if(userAction) state.userStarted=true;
  try{
    audio.muted=false;
    audio.defaultMuted=false;
    audio.volume=1;
    audio.autoplay=true;
    if(audio.src!==url){
      audio.src=url;
      audio.load();
    }
    const promise=audio.play();
    if(promise) await promise;
    if(token!==state.playToken) return;
    setStatus('Playing');
  }catch(error){
    if(token!==state.playToken) return;
    setStatus('Playback is ready. Tap Play once to let this browser continue audio.');
  }
}
function resumeAudio(){
  state.userStarted=true;
  audio.muted=false;
  audio.volume=1;
  audio.play().catch(()=>setStatus('Tap the Play control once to unlock audio.'));
}
function selectNaturalNext(){
  if(state.shuffle) return nextShuffle();
  return {url:nextSequential(1),record:false};
}
async function advanceFromEnded(){
  if(isStationID(state.currentURL) && state.pendingAfterStation){
    const pending=state.pendingAfterStation;
    state.pendingAfterStation=null;
    await playURL(pending.url,{record:pending.record,backgroundChange:true});
    return;
  }
  const next=selectNaturalNext();
  if(!next.url) return;
  if(!isStationID(state.currentURL)) state.stationCountdown--;
  if(shouldInsertStation()){
    state.stationCountdown=randomInt(CONFIG.STATION_ID_MIN_SONGS,CONFIG.STATION_ID_MAX_SONGS);
    state.pendingAfterStation=next;
    await playURL(stationURL(),{record:false,backgroundChange:false});
    return;
  }
  await playURL(next.url,{record:next.record,backgroundChange:true});
}
function nextTrack(userAction=false){
  state.pendingAfterStation=null;
  const next=state.shuffle?nextShuffle():{url:nextSequential(1),record:false};
  playURL(next.url,{record:next.record,backgroundChange:true,userAction});
}
function previousTrack(userAction=false){
  state.pendingAfterStation=null;
  const url=state.shuffle?previousShuffle():nextSequential(-1);
  if(url) playURL(url,{record:false,backgroundChange:true,userAction});
}

function renderTrackList(){
  const list=allowedCatalog();
  trackList.innerHTML='';
  const fragment=document.createDocumentFragment();
  for(const url of list){
    const button=document.createElement('button');
    button.type='button';
    button.dataset.url=url;
    button.textContent=displayTitle(url,!state.shuffle);
    if(url===state.currentURL) button.classList.add('current');
    button.addEventListener('click',()=>{
      state.pendingAfterStation=null;
      if(state.shuffle) recordHistory(url);
      playURL(url,{record:false,backgroundChange:true,userAction:true});
      trackList.style.display='none';
      titleBtn.setAttribute('aria-expanded','false');
    });
    fragment.appendChild(button);
  }
  trackList.appendChild(fragment);
}

async function loadMusicManifest(forceFresh=false){
  const cacheKey='GE_MUSIC_LIST_CLEAN_V1';
  try{
    const manifestURL=new URL(absolute(CONFIG.MUSIC_MANIFEST));
    if(forceFresh) manifestURL.searchParams.set('_ge_reload',String(Date.now()));
    const response=await fetch(manifestURL.href,{
      cache:'no-store',
      headers:forceFresh?{'X-GE-Reload':'1'}:{}
    });
    if(response.ok){
      const data=await response.json();
      const raw=Array.isArray(data)?data:(Array.isArray(data.files)?data.files:[]);
      const list=raw.map(item=>{
        const path=String(item||'').replace(/^\//,'').replace(/^ge-music\//,'');
        return absolute(CONFIG.MUSIC_BASE+path);
      }).filter(url=>/\.(mp3|m4a|ogg|wav)$/i.test(url) && !isStationID(url) && !isSingles(url));
      localStorage.setItem(cacheKey,JSON.stringify(list));
      return list;
    }
  }catch(_e){}
  try{
    const cached=JSON.parse(localStorage.getItem(cacheKey)||'[]');
    if(Array.isArray(cached)) return cached;
  }catch(_e){}
  return [];
}

function matchingStartSong(){
  const requested=new URLSearchParams(location.search).get('song');
  if(!requested) return '';
  const decoded=decodeURIComponent(requested.replace(/\+/g,' ')).toLowerCase();
  return state.catalog.find(url=>fileName(url).toLowerCase()===decoded || decodeURI(url).toLowerCase().includes(decoded)) || '';
}
function loadSharedState(){
  const params=new URLSearchParams(location.search);
  if(params.has('shuffle')) state.shuffle=params.get('shuffle')==='1';
  if(params.has('legacy')) state.legacy=params.get('legacy')==='1';
}

function appendShareState(target){
  target.searchParams.set('shuffle',state.shuffle?'1':'0');
  target.searchParams.set('legacy',state.legacy?'1':'0');
  target.searchParams.set('statev','3');
  target.searchParams.set('at',String(Date.now()));
  if(window.GEBackgrounds) window.GEBackgrounds.writeShareState(target.searchParams);
  target.searchParams.set('hudhide',$('hudAutoHide').checked?'1':'0');
  return target;
}
function shareURL(){
  const filename=fileName(state.currentURL);
  if(!filename || isStationID(state.currentURL)) return location.href;
  const slug=stripExtension(filename).replace(/^.*?[_ -](\d+)[_ -]/,'').replace(/[_+]+/g,' ').trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
  return appendShareState(new URL(`./share/${slug}.html`,location.href)).href;
}
function directTrackURL(){
  const filename=fileName(state.currentURL);
  const target=new URL('./',location.href);
  if(filename && !isStationID(state.currentURL)) target.searchParams.set('song',filename);
  return appendShareState(target).href;
}
async function resolvedShareURL(){
  const staticURL=shareURL();
  if(staticURL===location.href) return staticURL;
  try{
    const page=new URL(staticURL);
    page.search='';
    const response=await fetch(page.href,{method:'HEAD',cache:'no-store'});
    if(response.ok) return staticURL;
  }catch(_e){}
  return directTrackURL();
}

// Background controller: one owner, one set of listeners, no duplicate changes.
(function createBackgroundController(){
  const image=$('bgImage');
  const buttons={off:$('bgOff'),prev:$('bgPrev'),next:$('bgNext'),per:$('bgPer'),shuffle:$('bgShuf'),auto:$('bgAuto')};
  const params=new URLSearchParams(location.search);
  const saved=key=>localStorage.getItem(`GE_BG_${key}_V2`);
  const bg={files:[],position:0,off:saved('OFF')==='1',perSong:saved('PER')===null?true:saved('PER')==='1',shuffle:saved('SHUF')===null?true:saved('SHUF')==='1',auto:saved('AUTO')==='1',timer:null};
  if(params.has('bgoff')) bg.off=params.get('bgoff')==='1';
  if(params.has('bgper')) bg.perSong=params.get('bgper')==='1';
  if(params.has('bgshuf')) bg.shuffle=params.get('bgshuf')==='1';
  if(params.has('bgauto')) bg.auto=params.get('bgauto')==='1';
  if(bg.auto){ bg.perSong=false; bg.shuffle=false; }

  function persist(){
    localStorage.setItem('GE_BG_OFF_V2',bg.off?'1':'0');
    localStorage.setItem('GE_BG_PER_V2',bg.perSong?'1':'0');
    localStorage.setItem('GE_BG_SHUF_V2',bg.shuffle?'1':'0');
    localStorage.setItem('GE_BG_AUTO_V2',bg.auto?'1':'0');
    localStorage.setItem('GE_BG_POS_V2',String(bg.position));
  }
  function reflect(){
    setPressed(buttons.off,bg.off); setPressed(buttons.per,bg.perSong); setPressed(buttons.shuffle,bg.shuffle); setPressed(buttons.auto,bg.auto);
  }
  function focalFor(filename){
    const custom=CONFIG.BACKGROUND_FOCAL[filename]||{};
    return {
      x:params.get('bgx')||custom.x||CONFIG.BG_X,
      y:params.get('bgy')||custom.y||CONFIG.BG_Y,
      shift:params.get('bgshift')||custom.shift||CONFIG.BG_SHIFT_Y,
      scale:params.get('bgscale')||custom.scale||CONFIG.BG_SCALE
    };
  }
  function applyFocal(filename){
    const focal=focalFor(filename);
    document.documentElement.style.setProperty('--bg-x',focal.x);
    document.documentElement.style.setProperty('--bg-y',focal.y);
    document.documentElement.style.setProperty('--bg-shift-y',focal.shift);
    document.documentElement.style.setProperty('--bg-scale',focal.scale);
  }
  function apply(index){
    if(!bg.files.length){ image.style.opacity='0'; return; }
    bg.position=(index%bg.files.length+bg.files.length)%bg.files.length;
    const filename=bg.files[bg.position];
    applyFocal(filename);
    image.src=absolute(CONFIG.IMAGE_BASE+filename);
    image.style.opacity=bg.off?'0':'1';
    persist();
  }
  function randomOrNext(){
    if(!bg.files.length) return 0;
    if(!bg.shuffle) return bg.position+1;
    if(bg.files.length===1) return 0;
    let next=bg.position;
    while(next===bg.position) next=Math.floor(Math.random()*bg.files.length);
    return next;
  }
  function stopTimer(){ if(bg.timer){ clearInterval(bg.timer); bg.timer=null; } }
  function startTimer(){
    stopTimer();
    if(bg.auto && !bg.off) bg.timer=setInterval(()=>apply(bg.position+1),CONFIG.BG_AUTO_SECONDS*1000);
  }
  function onSongStart(){ if(bg.perSong && !bg.off && !bg.auto) apply(randomOrNext()); }
  function writeShareState(search){
    const filename=bg.files[bg.position]||'';
    const focal=focalFor(filename);
    if(filename) search.set('bg',filename);
    search.set('bgper',bg.perSong?'1':'0');
    search.set('bgshuf',bg.shuffle?'1':'0');
    search.set('bgauto',bg.auto?'1':'0');
    search.set('bgoff',bg.off?'1':'0');
    search.set('bgx',focal.x); search.set('bgy',focal.y); search.set('bgshift',focal.shift); search.set('bgscale',focal.scale);
  }
  async function loadFiles(forceFresh=false,suppliedFiles=null){
    let files=Array.isArray(suppliedFiles)?suppliedFiles.slice():[];
    try{
      if(!files.length){
      const manifestURL=new URL(absolute(CONFIG.IMAGE_MANIFEST));
      if(forceFresh) manifestURL.searchParams.set('_ge_reload',String(Date.now()));
      const response=await fetch(manifestURL.href,{
        cache:'no-store',
        headers:forceFresh?{'X-GE-Reload':'1'}:{}
      });
      if(response.ok){ const data=await response.json(); if(Array.isArray(data)) files=data.filter(name=>/\.(gif|png|jpe?g|webp)$/i.test(name)); }
      }
    }catch(_e){}
    if(!files.length) files=['1.gif','47.gif','32.jpeg','46.gif','33.png','36.gif','45.gif','36.png','15.gif','29.gif','4.gif','40.gif','23.gif','22.gif','17.gif','20.gif','30.gif','34.gif','5.gif','38.gif','31.gif','39.gif','41.gif','14.gif','24.gif'];
    if(!files.some(name=>String(name).toLowerCase()==='47.gif')) files.splice(Math.min(1,files.length),0,'47.gif');
    bg.files=files;
    const requested=params.get('bg');
    const stored=Number(localStorage.getItem('GE_BG_POS_V2'));
    if(requested){
      const found=files.findIndex(name=>decodeURIComponent(name)===decodeURIComponent(requested));
      bg.position=found>=0?found:0;
    }else if(Number.isFinite(stored)){ bg.position=Math.max(0,Math.min(files.length-1,stored)); }
    apply(bg.position);
    reflect();
    startTimer();
  }
  buttons.prev.addEventListener('click',()=>{ bg.off=false; apply(bg.position-1); reflect(); });
  buttons.next.addEventListener('click',()=>{ bg.off=false; apply(bg.position+1); reflect(); });
  buttons.off.addEventListener('click',()=>{ bg.off=!bg.off; image.style.opacity=bg.off?'0':'1'; if(bg.off) stopTimer(); else startTimer(); reflect(); persist(); });
  buttons.per.addEventListener('click',()=>{ bg.perSong=!bg.perSong; if(bg.perSong){ bg.auto=false; stopTimer(); } reflect(); persist(); });
  buttons.shuffle.addEventListener('click',()=>{ bg.shuffle=!bg.shuffle; if(bg.shuffle){ bg.auto=false; stopTimer(); } reflect(); persist(); });
  buttons.auto.addEventListener('click',()=>{ bg.auto=!bg.auto; if(bg.auto){ bg.perSong=false; bg.shuffle=false; startTimer(); }else stopTimer(); reflect(); persist(); });
  window.GEBackgrounds={
    onSongStart,
    writeShareState,
    getFiles:()=>bg.files.slice(),
    reloadFiles:async(files=null)=>{ await loadFiles(true,files); return bg.files.slice(); }
  };
  loadFiles(false);
})();

// Offline downloader. The service worker serves these exact URLs, including audio Range requests.
(function createOfflineController(){
  const button=$('offlineBtn');
  const panel=$('offlinePanel');
  const bar=$('offlineBar');
  const text=$('offlineText');
  let abortController=null;
  function setActive(on){
    button.classList.toggle('active',on);
    button.textContent=on?'Offline Ready':'Go Offline';
    localStorage.setItem(CONFIG.OFFLINE_KEY,on?'1':'0');
  }
  function progress(done,total,label){
    panel.style.display='block';
    const percent=total?Math.round(done/total*100):0;
    bar.style.width=`${percent}%`;
    text.textContent=`${label} ${done} of ${total}`;
  }
  async function fullFetch(url,signal){
    const response=await fetch(url,{cache:'no-store',signal,headers:{'X-GE-Offline':'1'}});
    if(!response.ok) throw new Error(`${response.status} ${url}`);
    return response;
  }
  async function buildAssetList(){
    const songs=state.catalog.slice();
    const backgrounds=window.GEBackgrounds?window.GEBackgrounds.getFiles().map(name=>absolute(CONFIG.IMAGE_BASE+name)):[];
    const stationIDs=CONFIG.STATION_ID_FILES.map(number=>absolute(`${CONFIG.MUSIC_BASE}clips/GE Station Identification - ${number}.m4a`));
    const shell=['./','./index.html','./manifest.webmanifest','./sw.js','./icons/icon-192.png','./icons/icon-512.png',CONFIG.LOGO_SRC,CONFIG.MUSIC_MANIFEST,CONFIG.IMAGE_MANIFEST].map(absolute);
    return [...new Set([...shell,...backgrounds,...songs,...stationIDs])];
  }
  async function cacheMissingAssets({quiet=false}={}){
    await registerServiceWorker();
    if(navigator.storage?.persist) try{ await navigator.storage.persist(); }catch(_e){}
    const cache=await caches.open(CONFIG.OFFLINE_CACHE);
    const assets=await buildAssetList();
    const missing=[];
    for(const url of assets){
      const hit=await cache.match(url,{ignoreSearch:true});
      if(!hit) missing.push(url);
    }
    if(!missing.length){
      if(!quiet){
        setActive(true);
        progress(assets.length,assets.length,'Offline ready.');
        setStatus('Offline library is already current.');
      }
      return {added:0,failed:0,total:assets.length};
    }
    abortController=new AbortController();
    button.classList.add('downloading');
    button.textContent='Stop Download';
    let done=0,failed=0;
    for(const url of missing){
      if(abortController.signal.aborted) break;
      try{
        const response=await fullFetch(url,abortController.signal);
        await cache.put(url,response.clone());
      }catch(_e){ failed++; }
      done++;
      if(!quiet) progress(done,missing.length,'Updating');
    }
    button.classList.remove('downloading');
    abortController=null;
    const added=done-failed;
    if(added>0 || missing.length===0) setActive(true);
    if(!quiet){
      progress(missing.length,missing.length,failed?`Updated with ${failed} unavailable files.`:'Offline updated.');
      setStatus(added?`Added ${added} new offline file${added===1?'':'s'}.`:'Offline library is current.');
    }
    return {added,failed,total:assets.length};
  }
  async function download(){
    const result=await cacheMissingAssets({quiet:false});
    if(result.total===0){
      setActive(false);
      text.textContent='The offline download did not complete.';
    }
  }
  async function remove(){
    await caches.delete(CONFIG.OFFLINE_CACHE);
    setActive(false); bar.style.width='0'; text.textContent='Offline music removed. The small app shell may remain installed.';
  }
  button.addEventListener('click',async()=>{
    if(button.classList.contains('downloading')){ abortController?.abort(); button.classList.remove('downloading'); setActive(false); return; }
    if(localStorage.getItem(CONFIG.OFFLINE_KEY)==='1'){
      if(confirm('Remove the downloaded offline music and backgrounds?')) await remove();
      return;
    }
    if(confirm('Download the music, station IDs, backgrounds, and radio app for offline use? This may use about 1 GB of storage.')) await download();
  });
  setActive(localStorage.getItem(CONFIG.OFFLINE_KEY)==='1');
  window.GEOffline={
    isActive:()=>localStorage.getItem(CONFIG.OFFLINE_KEY)==='1',
    updateMissing:()=>cacheMissingAssets({quiet:true})
  };
})();


// Manual library updater.
// Uses the actual public GitHub repository tree, so it can discover files even
// when manifest.json has not been rebuilt yet. Blob SHAs let it detect a
// replacement that keeps the exact same filename.
$('reloadBtn').addEventListener('click',async()=>{
  const button=$('reloadBtn');
  const original=button.textContent;
  button.disabled=true;
  button.textContent='Checking...';

  const previousURL=state.currentURL;
  const previousCatalog=new Set(state.catalog);
  const previousBackgrounds=new Set(window.GEBackgrounds?window.GEBackgrounds.getFiles():[]);

  try{
    if('serviceWorker' in navigator){
      try{
        const registration=await navigator.serviceWorker.getRegistration('./');
        if(registration) await registration.update();
      }catch(_e){}
    }

    let library=null;
    try{
      const tree=await fetchRepositoryTree();
      library=libraryFromRepositoryTree(tree);
    }catch(error){
      console.warn('GitHub tree reload failed; using manifests.',error);
    }

    if(library && library.catalog.length){
      state.catalog=library.catalog.slice().sort(orderedSort);
    }else{
      state.catalog=(await loadMusicManifest(true)).sort(orderedSort);
    }

    rebuildQueue(previousURL);

    let freshBackgrounds=[];
    if(library && library.backgrounds.length){
      freshBackgrounds=await window.GEBackgrounds.reloadFiles(library.backgrounds);
    }else if(window.GEBackgrounds?.reloadFiles){
      freshBackgrounds=await window.GEBackgrounds.reloadFiles();
    }

    let mediaResult={refreshed:0,addedOffline:0,removed:0,failed:0,changedPaths:[],addedPaths:[],removedPaths:[]};
    if(library){
      const oldShaMap=loadMediaShaMap();
      mediaResult=await refreshMediaCacheFromTree(oldShaMap,library.shaMap,{
        offlineActive:!!window.GEOffline?.isActive()
      });
      saveMediaShaMap(library.shaMap);
    }

    const newSongs=state.catalog.filter(url=>!previousCatalog.has(url)).length;
    const removedSongs=[...previousCatalog].filter(url=>!state.catalog.includes(url)).length;
    const newImages=freshBackgrounds.filter(name=>!previousBackgrounds.has(name)).length;
    const removedImages=[...previousBackgrounds].filter(name=>!freshBackgrounds.includes(name)).length;

    // If the exact currently playing file was replaced, reload that source now
    // so the listener hears the new file immediately.
    const currentPath=urlToRepoPath(previousURL);
    if(previousURL && mediaResult.changedPaths.includes(currentPath)){
      const wasPlaying=!audio.paused;
      await playURL(previousURL,{record:false,backgroundChange:false,userAction:false});
      if(!wasPlaying) audio.pause();
    }else if(previousURL && !isStationID(previousURL) && !state.catalog.includes(previousURL)){
      const fallback=allowedCatalog()[0]||'';
      if(fallback) await playURL(fallback,{record:false,backgroundChange:true,userAction:false});
    }

    const totalChanges=
      newSongs+removedSongs+newImages+removedImages+
      mediaResult.refreshed+mediaResult.addedOffline+mediaResult.removed;

    button.textContent=totalChanges?`Updated ${totalChanges}`:'Up to Date';

    setStatus(
      `Reload complete. ${newSongs} new song${newSongs===1?'':'s'}, `+
      `${removedSongs} removed song${removedSongs===1?'':'s'}, `+
      `${mediaResult.refreshed} replaced file${mediaResult.refreshed===1?'':'s'} refreshed, `+
      `${newImages} new image${newImages===1?'':'s'}.`+
      (mediaResult.failed?` ${mediaResult.failed} file${mediaResult.failed===1?'':'s'} could not refresh.`:'')
    );

    setTimeout(()=>{ button.textContent=original; },2200);
  }catch(error){
    console.error('GE smart reload failed',error);
    setStatus('Library update could not finish. Check the Internet connection and try again.');
    button.textContent='Try Again';
    setTimeout(()=>{ button.textContent=original; },2200);
  }finally{
    button.disabled=false;
  }
});

(async function boot(){
  $('geLogo').src=absolute(CONFIG.LOGO_SRC);
  $('homeLink').href=CONFIG.HOME_URL;
  loadSharedState();
  syncModeButtons();
  registerServiceWorker();
  state.catalog=(await loadMusicManifest()).sort(orderedSort);
  rebuildQueue('');
  const start=matchingStartSong() || (state.shuffle ? pickWeightedShuffle() : (allowedCatalog()[0] || ''));
  if(!start){ titleBtn.textContent='No music files found'; setStatus('The radio manifest could not be loaded.'); return; }
  if(state.shuffle) recordHistory(start);
  await playURL(start,{record:false,backgroundChange:false});
})();
</script>
