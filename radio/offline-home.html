<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Grand Element Radio">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<title>Grand Element Radio</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
body{min-height:100dvh;margin:0;background:#020b18;color:#ebf7ff;display:grid;place-items:center;padding:20px}
main{width:min(430px,100%);padding:30px 22px;text-align:center;border:1px solid #426e8e;border-radius:18px;background:#071a2c}
h1{font-size:25px;margin:0 0 12px;line-height:1.25}
p{color:#c9e1f1;line-height:1.5}
a{display:block;background:#125a88;color:white;border:1px solid #91d9ff;border-radius:12px;font:bold 17px system-ui;padding:16px;margin:22px 0;text-decoration:none;min-height:55px}
small{display:block;color:#9fbacd;line-height:1.5}
</style>
</head>
<body>
<main>
<h1>GRAND ELEMENT RADIO</h1>
<p id="status" role="status">Tap OPEN RADIO to enter the saved player.</p>
<a id="open" href="./index.html?ge_home=1">OPEN RADIO</a>
<small>Once OFFLINE says READY inside this installed app, you can reopen Radio in Airplane Mode. If this is your first launch, connect online and select OFFLINE to prepare the device.</small>
</main>
<script>
(()=>{
 'use strict';
 const status=document.getElementById('status');
 const link=document.getElementById('open');
 const installed=!!(window.matchMedia?.('(display-mode: standalone)')?.matches||navigator.standalone===true);
 if(!installed){
   status.textContent='For offline listening, install Radio from Safari using Add to Home Screen.';
   return;
 }
 const indexURL=new URL('./index.html',location.href);
 const isRadioHTML=text=>/<!doctype html/i.test(text)&&
   text.includes('<title>Grand Element Radio</title>')&&
   text.includes('id="player"')&&text.includes('id="shipStage"');
 // Older pinned iPhone icons still launch this legacy URL. Their old service
 // worker may serve this launcher even when the Radio HTML is safely cached.
 // Load that same saved shell here without requiring a second network navigation.
 async function savedRadioHTML(){
   if(!('caches' in window))return null;
   const keys=await caches.keys();
   const shells=keys.filter(name=>name.startsWith('ge-radio-shell-')).reverse();
   for(const name of shells){
     const cache=await caches.open(name);
     const response=await cache.match(indexURL.href,{ignoreSearch:true})||
       await cache.match(new URL('./',location.href).href,{ignoreSearch:true});
     if(!response?.ok)continue;
     const html=await response.text();
     if(isRadioHTML(html))return html;
   }
   // Older service workers sometimes stored the home page in other caches.
   const response=await caches.match(indexURL.href,{ignoreSearch:true});
   if(response?.ok){
     const html=await response.text();
     if(isRadioHTML(html))return html;
   }
   return null;
 }
 (async()=>{
   status.textContent='Opening your saved Radio player…';
   let html=null;
   try{html=await savedRadioHTML();}catch(error){
     console.warn('Saved Radio shell recovery unavailable',error);
   }
   if(html){
     // The launcher and Radio are both /radio/; relative scripts/assets retain
     // their correct paths. document.write parses normal executable scripts.
     // Never delete or reset existing downloaded audio, access, or playlists.
     document.open();
     document.write(html);
     document.close();
     return;
   }
   // No usable cached shell: retain manual navigation, including when an
   // older worker can answer index.html requests but lacks CacheStorage access.
   status.textContent='Saved Radio startup files not found. Tap OPEN RADIO. If offline opening fails, reconnect once online inside this same installed app to repair. Do not delete saved music.';
 })();
})();
</script>
</body>
</html>
