<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Grand Element Radio">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<title>Grand Element Radio</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
body{min-height:100dvh;margin:0;background:#020b18;color:#ebf7ff;display:grid;place-items:center;padding:20px}
main{width:min(430px,100%);padding:30px 22px;text-align:center;border:1px solid #426e8e;border-radius:18px;background:#071a2c}
h1{font-size:25px;margin:0 0 12px;line-height:1.25}
p{color:#c9e1f1;line-height:1.5}
a{display:block;background:#125a88;color:white;border:1px solid #91d9ff;border-radius:12px;font:bold 17px system-ui;padding:16px;margin:22px 0;text-decoration:none;min-height:55px}
small{display:block;color:#9fbacd;line-height:1.5}
</style>
</head>
<body>
<main>
<h1>GRAND ELEMENT RADIO</h1>
<p id="status" role="status">Tap OPEN RADIO to enter the saved player.</p>
<a id="open" href="./index.html?ge_home=1">OPEN RADIO</a>
<small>Once OFFLINE says READY inside this installed app, you can reopen Radio in Airplane Mode. If this is your first launch, connect online and select OFFLINE to prepare the device.</small>
</main>
<script>
(()=>{
 const status=document.getElementById('status');
 const open=document.getElementById('open');
 const installed=!!(window.matchMedia?.('(display-mode: standalone)')?.matches||navigator.standalone===true);
 // The button is always usable; existing iPhone Home Screen icons may still
 // point here even after manifest.start_url changes.
 if(!installed){
  status.textContent='For offline listening, install Radio from Safari’s Add to Home Screen menu.';
  return;
 }
 status.textContent='Opening Radio. If this page stays here, tap OPEN RADIO.';
 // Avoid trapping the listener in an unhelpful "Opening..." screen. Any
 // failed automatic navigation leaves a clear manual entry point.
 const target=open.href;
 window.setTimeout(()=>{
  try{location.replace(target)}
  catch(_){status.textContent='Open the saved player using OPEN RADIO above.'}
 },800);
 window.setTimeout(()=>{
  if(document.visibilityState==='visible')
   status.textContent='Still on this page? Tap OPEN RADIO. If it cannot open while disconnected, reconnect and use OFFLINE → CHECK & REPAIR; do not delete saved music.';
 },2500);
})();
</script>
</body>
</html>
