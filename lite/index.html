<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no">
<title>Grand Element Radio</title>
<meta name="theme-color" content="#000000">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#02060b;color:#eef8ff;font-family:Arial,Helvetica,sans-serif;-webkit-text-size-adjust:100%}
body{overflow-x:hidden}
#bg{position:fixed;z-index:0;left:0;right:0;top:0;bottom:0;background:
radial-gradient(circle at 12% 10%,rgba(255,255,255,.70) 0 1px,transparent 2px),
radial-gradient(circle at 84% 16%,rgba(255,255,255,.58) 0 1px,transparent 2px),
radial-gradient(circle at 58% 7%,rgba(155,215,255,.52) 0 1px,transparent 2px),
radial-gradient(circle at 29% 29%,rgba(255,255,255,.52) 0 1px,transparent 2px),
radial-gradient(circle at 72% 37%,rgba(255,255,255,.62) 0 1px,transparent 2px),
radial-gradient(circle at 8% 53%,rgba(140,210,255,.42) 0 1px,transparent 2px),
radial-gradient(circle at 91% 63%,rgba(255,255,255,.58) 0 1px,transparent 2px),
radial-gradient(circle at 40% 76%,rgba(255,255,255,.46) 0 1px,transparent 2px),
radial-gradient(circle at 77% 89%,rgba(155,220,255,.42) 0 1px,transparent 2px),
linear-gradient(#00040b,#02111d 54%,#00060c)}
#shade{position:fixed;z-index:1;left:0;right:0;top:0;bottom:0;background:linear-gradient(rgba(0,0,0,.08),rgba(0,0,0,.25));pointer-events:none}
.wrap{position:relative;z-index:2;width:100%;max-width:760px;margin:0 auto;padding:9px 10px 24px;text-align:center}
header{margin:2px 0 5px}
.logoWrap{position:relative;width:184px;height:184px;margin:0 auto 8px;border-radius:50%}
.logoWrap:before{content:"";position:absolute;left:-18px;right:-18px;top:-18px;bottom:-18px;border-radius:50%;border:1px solid rgba(55,160,255,.25);box-shadow:0 0 32px rgba(0,136,255,.18),inset 0 0 22px rgba(0,130,255,.12)}
.logo{position:relative;z-index:2;width:100%;height:100%;display:block;border-radius:50%;object-fit:cover;box-shadow:0 0 16px rgba(77,190,255,.30)}
h1{font-size:27px;line-height:1.05;margin:0;font-weight:bold}
.tag{font-size:17px;line-height:1.1;color:#d7e3eb;margin:3px 0 8px}
button,.btnLink{appearance:none;-webkit-appearance:none;border:1px solid #31536b;border-radius:12px;background:rgba(11,32,47,.85);color:#f5fbff;font-weight:bold;text-decoration:none;text-align:center;-webkit-tap-highlight-color:transparent}
#titleBtn{width:100%;height:42px;font-size:19px;margin:0 0 7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#seek{display:block;width:96%;margin:5px auto 10px;height:23px}
.row{font-size:0;width:100%;margin:0 0 6px}
.row button{display:inline-block;width:32%;margin:0 .66%;height:54px;font-size:17px;vertical-align:top}
#shuffleBtn.on{border:2px solid #35f0b4;box-shadow:0 0 12px rgba(25,245,175,.18)}
#radioBtn.on{background:rgba(190,32,65,.92);border:2px solid #ff7892;box-shadow:0 0 14px rgba(255,60,100,.25)}
#status{height:28px;line-height:26px;border:1px solid #31536b;border-radius:10px;background:rgba(3,18,29,.82);font-size:12px;color:#c8eafa;margin:4px 0 11px}
.group{border:1px solid #31536b;border-radius:12px;background:rgba(7,25,38,.76);padding:8px;margin:0 0 9px}
.sectionLabel{display:block;font-size:15px;font-weight:bold;margin:-3px 0 5px}
.bgRow{font-size:0}
.bgRow button{display:inline-block;width:32%;margin:3px .66%;height:40px;font-size:14px}
.bgRow button.on{border:2px solid #35f0b4;box-shadow:0 0 10px rgba(25,245,175,.14)}
.utility{font-size:0;margin-top:3px}
.utility button,.utility a{display:inline-block;width:32%;margin:3px .66%;height:42px;line-height:40px;font-size:11px;vertical-align:top;padding:0 4px}
.utility .buy{background:rgba(197,61,23,.88);border-color:#df714b;line-height:14px;padding-top:7px}
.utility .access{border-color:#3c8baa}
#showHud{display:none;position:fixed;z-index:50;left:0;right:0;top:0;bottom:0}
body.hideHud .hideable{visibility:hidden}
body.hideHud #showHud{display:block}
footer{font-size:9px;color:#8597a4;letter-spacing:.04em;margin-top:13px}\n/* annotated spacing: keep the same radio design while using the lower open area */\n.wrap{min-height:100vh;display:flex;flex-direction:column}\nheader{transform:translateY(-16px)}\n.group{margin-top:auto}\n@media(max-width:340px){header{transform:translateY(-8px)}}
#hiddenAudio{display:none}
@media(max-width:340px){
  .wrap{padding:5px 6px 18px}
  .logoWrap{width:154px;height:154px;margin-bottom:5px}
  h1{font-size:22px}
  .tag{font-size:14px;margin-bottom:6px}
  #titleBtn{height:36px;font-size:16px;margin-bottom:4px}
  #seek{margin:2px auto 6px;height:20px}
  .row{margin-bottom:4px}
  .row button{height:44px;font-size:15px;border-radius:10px}
  #status{height:24px;line-height:22px;margin:3px 0 7px;font-size:10px}
  .group{padding:5px;margin-bottom:5px}
  .sectionLabel{font-size:13px;margin:0 0 2px}
  .bgRow button{height:34px;font-size:12px;margin-top:2px;margin-bottom:2px}
  .utility button,.utility a{height:36px;line-height:34px;font-size:9px;border-radius:9px}
  .utility .buy{line-height:11px;padding-top:6px}
  footer{margin-top:7px}
}
@media(max-height:570px) and (max-width:340px){
  .logoWrap{width:132px;height:132px}
  h1{font-size:20px}
  .tag{font-size:13px}
  .row button{height:40px}
  .bgRow button{height:31px}
  .utility button,.utility a{height:32px;line-height:30px}
  .utility .buy{line-height:10px;padding-top:5px}
}
</style>
</head>
<body>
<div id="bg"></div>
<div id="shade"></div>
<div id="showHud" title="Tap to show controls"></div>

<main class="wrap">
  <div class="hideable">
    <header>
      <a class="logoWrap" href="/?full=1"><img class="logo" src="../ge-images/images/ge-logo-2.jpg" alt="Grand Element"></a>
      <h1>Grand Element Radio</h1>
      <div class="tag">music to set your soul free</div>
    </header>

    <button id="titleBtn" type="button">Grand Element Radio</button>
    <input id="seek" type="range" min="0" max="1000" value="0" disabled>

    <div class="row">
      <button id="playBtn" type="button">Play</button>
      <button id="prevBtn" type="button">Prev</button>
      <button id="nextBtn" type="button">Next</button>
    </div>
    <div class="row">
      <button id="shuffleBtn" class="on" type="button">Shuffle</button>
      <button id="radioBtn" class="on" type="button">RADIO</button>
      <button id="shareBtn" type="button">Share</button>
    </div>

    <div id="status">RADIO • ready</div>

    <section class="group">
      <span class="sectionLabel">Backgrounds</span>
      <div class="bgRow">
        <button id="bgOff" type="button">Off</button>
        <button id="bgPrev" type="button">Prev</button>
        <button id="bgNext" type="button">Next</button>
        <button id="bgPer" class="on" type="button">Per Song</button>
        <button id="bgShuffle" class="on" type="button">Shuffle</button>
        <button id="bgAuto" type="button">Auto</button>
      </div>
    </section>

    <div class="utility">
      <button id="reloadBtn" type="button">Reload Library</button>
      <button id="hideBtn" type="button">Hide Text</button>
      <a class="btnLink buy" href="https://grandelement.bandcamp.com">Buy on<br>Bandcamp</a>
      <a class="btnLink access" href="mailto:access@grandelement.com?subject=Grand%20Element%20Access&body=Hi%20Grand%20Element%2C%0A%0AI%20would%20like%20the%20access%20code.%20Please%20add%20me%20to%20the%20Grand%20Element%20fan%20list%20for%20occasional%20updates%20about%20shows%2C%20events%20and%20new%20releases.%0A%0AThanks.">Get Access</a>
      <a class="btnLink" href="mailto:info@grandelement.com?subject=Grand%20Element">Contact</a>
      <a class="btnLink" href="/radio/?full=1">Full Radio</a>
    </div>

    <footer>Copyright GE Studios and Grand Element. All rights reserved.</footer>
  </div>

  <audio id="hiddenAudio" preload="none"></audio>
</main>

<script>
(function(){
  var STREAM='https://radio.grandelement.blitz.cloud/stream.mp3';
  var audio=document.getElementById('hiddenAudio');
  var titleBtn=document.getElementById('titleBtn');
  var playBtn=document.getElementById('playBtn');
  var radioBtn=document.getElementById('radioBtn');
  var shuffleBtn=document.getElementById('shuffleBtn');
  var seek=document.getElementById('seek');
  var status=document.getElementById('status');
  var bg=document.getElementById('bg');
  var tracks=[],index=0,radioMode=true,shuffle=true,bgIndex=0,bgPer=true,bgShuffle=true,bgAuto=false,bgTimer=null;

  var backgrounds=[
    'radial-gradient(circle at 12% 10%,rgba(255,255,255,.70) 0 1px,transparent 2px),radial-gradient(circle at 84% 16%,rgba(255,255,255,.58) 0 1px,transparent 2px),radial-gradient(circle at 58% 7%,rgba(155,215,255,.52) 0 1px,transparent 2px),radial-gradient(circle at 29% 29%,rgba(255,255,255,.52) 0 1px,transparent 2px),radial-gradient(circle at 72% 37%,rgba(255,255,255,.62) 0 1px,transparent 2px),radial-gradient(circle at 8% 53%,rgba(140,210,255,.42) 0 1px,transparent 2px),radial-gradient(circle at 91% 63%,rgba(255,255,255,.58) 0 1px,transparent 2px),linear-gradient(#00040b,#02111d 54%,#00060c)',
    'radial-gradient(circle at 50% 25%,rgba(22,109,178,.34),transparent 35%),radial-gradient(circle at 20% 18%,rgba(255,255,255,.55) 0 1px,transparent 2px),radial-gradient(circle at 82% 66%,rgba(148,216,255,.55) 0 1px,transparent 2px),linear-gradient(#01040c,#031528,#00060d)',
    'radial-gradient(circle at 72% 28%,rgba(69,36,154,.28),transparent 34%),radial-gradient(circle at 13% 22%,rgba(255,255,255,.60) 0 1px,transparent 2px),radial-gradient(circle at 55% 62%,rgba(255,255,255,.48) 0 1px,transparent 2px),linear-gradient(#02020a,#100822,#02030a)',
    'radial-gradient(circle at 40% 32%,rgba(0,156,190,.24),transparent 34%),radial-gradient(circle at 9% 63%,rgba(255,255,255,.58) 0 1px,transparent 2px),radial-gradient(circle at 89% 19%,rgba(255,255,255,.58) 0 1px,transparent 2px),linear-gradient(#00070b,#032129,#000508)'
  ];

  function addClass(el,name){if((' '+el.className+' ').indexOf(' '+name+' ')<0)el.className+=(el.className?' ':'')+name;}
  function removeClass(el,name){el.className=(' '+el.className+' ').replace(' '+name+' ',' ').replace(/^\s+|\s+$/g,'');}
  function toggleClass(el,name,on){if(on)addClass(el,name);else removeClass(el,name);}
  function encodePath(p){var a=p.split('/'),i;for(i=0;i<a.length;i++)a[i]=encodeURIComponent(a[i]);return '/'+a.join('/');}
  function cleanTitle(p){var s=p.split('/').pop()||p;s=s.replace(/\.mp3$/i,'');s=s.replace(/^[^_]+_/,'');s=s.replace(/\([^)]*\)/g,'');return s.replace(/_/g,' ').replace(/^\s+|\s+$/g,'')||'Grand Element';}
  function setStatus(t){status.innerHTML=t;}
  function setRadioState(on){radioMode=on;toggleClass(radioBtn,'on',on);seek.disabled=on;if(on){titleBtn.innerHTML='Grand Element Radio';setStatus('RADIO • ready');}}
  function safePlay(){var p;try{p=audio.play();if(p&&p.catch)p.catch(function(){setStatus('Tap Play to start');});}catch(e){setStatus('Tap Play to start');}}
  function tuneRadio(playNow){setRadioState(true);if(audio.src!==STREAM){audio.src=STREAM;audio.load();}if(playNow)safePlay();}
  function loadTrack(n,playNow){
    if(!tracks.length){setStatus('Music library loading');return;}
    setRadioState(false);
    if(n<0)n=tracks.length-1;if(n>=tracks.length)n=0;index=n;
    audio.src=encodePath(tracks[index]);audio.load();titleBtn.innerHTML=cleanTitle(tracks[index]);
    setStatus('MUSIC • '+(index+1)+' / '+tracks.length);
    if(bgPer)changeBackground(bgShuffle?-1:bgIndex+1);
    if(playNow)safePlay();
  }
  function nextTrack(playNow){if(shuffle&&tracks.length>1)loadTrack(Math.floor(Math.random()*tracks.length),playNow);else loadTrack(index+1,playNow);}
  function previousTrack(){loadTrack(index-1,true);}
  function reloadLibrary(){
    var x=new XMLHttpRequest();
    setStatus('Loading music library');
    x.onreadystatechange=function(){
      var data,i,p;
      if(x.readyState!==4)return;
      if(x.status>=200&&x.status<300){
        try{
          data=JSON.parse(x.responseText);tracks=[];
          for(i=0;i<(data.files||[]).length;i++){p=data.files[i];if(/^ge-music\/music\//.test(p)&&/\.mp3$/i.test(p))tracks.push(p);}
          setStatus(radioMode?'RADIO • ready':'MUSIC • library ready');
        }catch(e){setStatus('RADIO • ready');}
      }else setStatus('RADIO • ready');
    };
    x.open('GET','../radio/manifest.json?legacy=1',true);x.send(null);
  }

  function changeBackground(n){
    if(n<0)n=Math.floor(Math.random()*backgrounds.length);
    if(n>=backgrounds.length)n=0;if(n<0)n=backgrounds.length-1;
    bgIndex=n;bg.style.background=backgrounds[bgIndex];removeClass(document.getElementById('bgOff'),'on');
  }
  function setBgOff(){bg.style.background='#000';addClass(document.getElementById('bgOff'),'on');}
  function syncBgButtons(){
    toggleClass(document.getElementById('bgPer'),'on',bgPer);
    toggleClass(document.getElementById('bgShuffle'),'on',bgShuffle);
    toggleClass(document.getElementById('bgAuto'),'on',bgAuto);
  }
  function setAuto(){
    if(bgTimer){clearInterval(bgTimer);bgTimer=null;}
    if(bgAuto)bgTimer=setInterval(function(){changeBackground(bgShuffle?-1:bgIndex+1);},30000);
  }

  document.getElementById('playBtn').onclick=function(){if(!audio.src)tuneRadio(false);if(audio.paused)safePlay();else audio.pause();};
  document.getElementById('radioBtn').onclick=function(){tuneRadio(true);};
  document.getElementById('prevBtn').onclick=function(){previousTrack();};
  document.getElementById('nextBtn').onclick=function(){nextTrack(true);};
  document.getElementById('shuffleBtn').onclick=function(){shuffle=!shuffle;toggleClass(shuffleBtn,'on',shuffle);};
  document.getElementById('shareBtn').onclick=function(){window.location.href='mailto:?subject=Grand%20Element%20Radio&body=https%3A%2F%2Fwww.grandelement.com%2Fradio%2F';};
  document.getElementById('reloadBtn').onclick=function(){reloadLibrary();};
  document.getElementById('hideBtn').onclick=function(){addClass(document.body,'hideHud');};
  document.getElementById('showHud').onclick=function(){removeClass(document.body,'hideHud');};
  document.getElementById('bgOff').onclick=function(){setBgOff();};
  document.getElementById('bgPrev').onclick=function(){changeBackground(bgIndex-1);};
  document.getElementById('bgNext').onclick=function(){changeBackground(bgIndex+1);};
  document.getElementById('bgPer').onclick=function(){bgPer=!bgPer;syncBgButtons();};
  document.getElementById('bgShuffle').onclick=function(){bgShuffle=!bgShuffle;syncBgButtons();};
  document.getElementById('bgAuto').onclick=function(){bgAuto=!bgAuto;syncBgButtons();setAuto();};

  seek.onchange=function(){
    if(radioMode||!audio.duration||!isFinite(audio.duration))return;
    try{audio.currentTime=(Number(seek.value)/1000)*audio.duration;}catch(e){}
  };
  audio.ontimeupdate=function(){
    if(radioMode||!audio.duration||!isFinite(audio.duration)){seek.value=0;return;}
    seek.value=Math.round((audio.currentTime/audio.duration)*1000);
  };
  audio.onplay=function(){playBtn.innerHTML='Pause';setStatus(radioMode?'RADIO • playing':'MUSIC • playing');};
  audio.onpause=function(){playBtn.innerHTML='Play';if(radioMode)setStatus('RADIO • ready');};
  audio.onwaiting=function(){setStatus(radioMode?'RADIO • buffering':'MUSIC • buffering');};
  audio.onplaying=function(){setStatus(radioMode?'RADIO • playing':'MUSIC • playing');};
  audio.onerror=function(){setStatus('Audio connection interrupted • tap Play');};
  audio.onended=function(){if(!radioMode)nextTrack(true);};

  tuneRadio(false);
  reloadLibrary();
  syncBgButtons();
})();
</script>
</body>
</html>
