name: Build GE Radio UTC schedule

on:
  push:
    branches:
      - main
      - ge-radio-station-2
    paths:
      - "ge-music/music/**"
      - "ge-music/clips/**"
      - ".github/scripts/build_ge_radio_clock.py"
      - ".github/workflows/ge-radio-clock.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ge-radio-clock-manifest
  cancel-in-progress: true

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout music including LFS
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install ffprobe
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Build measured UTC schedule
        run: python3 .github/scripts/build_ge_radio_clock.py
      - name: Commit manifest only if changed
        run: |
          if git diff --quiet -- radio/sync-playlist.json; then
            echo "Schedule unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radio/sync-playlist.json
          git commit -m "Update measured GE Radio UTC playlist"
          git push
