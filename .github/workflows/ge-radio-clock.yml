name: Refresh GE MUSIC and shop catalogs (Radio rotation frozen)

on:
  push:
    branches:
      - main
      - ge-radio-station-2
    paths:
      - "ge-music/music/**"
      - "ge-music/clips/**"
      - ".github/scripts/build_ge_radio_clock.py"
      - ".github/scripts/sync_ge_music_catalog.py"
      - ".github/workflows/ge-radio-clock.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ge-radio-clock-manifest
  cancel-in-progress: true

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout music including LFS
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install ffprobe
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Validate and inventory every album for MUSIC and SHOP
        run: python3 .github/scripts/sync_ge_music_catalog.py
      - name: Refresh full-library song durations (no Radio schedule changes)
        run: python3 .github/scripts/build_ge_radio_clock.py
      - name: Commit manifest only if changed
        run: |
          git add radio/manifest.json radio/track-durations.json support/catalog.json
          if git diff --cached --quiet -- radio/manifest.json radio/track-durations.json support/catalog.json; then
            echo "Music and shop catalogs unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh full GE Music and shop catalogs without changing Radio rotation"
          git push
