# Read-only BLITZ Radio 1 production diagnostics.
# Trigger on update to this file or run manually; never deploy/restart a station.
name: GE Radio Live Stream Diagnostic
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ge-radio-live-stream-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-station:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify BLITZ gateway, automation cue and public audio
        run: |
          python3 - <<'PY'
          import socket, urllib.request, urllib.error, sys
          host='radio.grandelement.blitz.cloud'
          try:
              addresses=sorted({p[4][0] for p in socket.getaddrinfo(host,443,type=socket.SOCK_STREAM)})
              print('BLITZ DNS: resolved',len(addresses),'address(es)',flush=True)
          except Exception as e:
              print('BLITZ DNS FAILED:',type(e).__name__,str(e)[:180],flush=True)
              raise SystemExit(1)
          paths=[
            ('gateway','/healthz',False),
            ('automation','/dj-cue.mp3',True),
            ('public_radio','/stream.mp3',True)
          ]
          outcomes={}
          for name,path,audio in paths:
              url='https://'+host+path
              req=urllib.request.Request(url,headers={
                'User-Agent':'GrandElement-ReadOnly-Radio1-Diagnostic/2.0',
                'Accept':'audio/mpeg,*/*' if audio else 'text/plain,*/*'
              })
              try:
                  with urllib.request.urlopen(req,timeout=16) as response:
                      status=response.status
                      mime=response.headers.get('Content-Type','')
                      payload=response.read(512)
                  good=status==200 and bool(payload) and (not audio or ('audio' in mime.lower() or payload[:3]==b'ID3' or payload[:2]==b'\\xff\\xfb'))
                  outcomes[name]=good
                  print(name,'HTTP',status,'type',mime,'bytes',len(payload),'OK' if good else 'NO AUDIO',flush=True)
              except urllib.error.HTTPError as e:
                  outcomes[name]=False
                  detail=e.read(350).decode('utf-8','replace')
                  # Only the public error payload; never send credentials or audio.
                  print(name,'HTTP',e.code,'type',e.headers.get('Content-Type',''),
                        'public_error',repr(detail[:250]),'FAILED',flush=True)
              except Exception as e:
                  outcomes[name]=False
                  print(name,'FAILED',type(e).__name__,str(e)[:180],flush=True)
          # Verify the optional listener wake-and-return route, without
          # following its redirect away from the radio backend.
          if outcomes.get('gateway'):
              class NoFollow(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self,req,fp,code,msg,headers,newurl):return None
              try:
                  req=urllib.request.Request('https://'+host+'/wake-radio',headers={'Accept':'text/html'})
                  with urllib.request.build_opener(NoFollow()).open(req,timeout=9) as resp:
                      print('WAKE ROUTE',resp.status,'NO REDIRECT',flush=True)
              except urllib.error.HTTPError as e:
                  location=e.headers.get('Location','')
                  print('WAKE ROUTE HTTP',e.code,'redirect_to_GE',e.code==302 and
                        location.startswith('https://grandelement.com/radio/'),flush=True)
              except Exception as e:
                  print('WAKE ROUTE unavailable',type(e).__name__,flush=True)
          print('PLATFORM NOTE: a sleeping BLITZ app rejects automated stream/health requests. A genuine browser navigation must wake it or the app must be always-on.',flush=True)
          if not outcomes['gateway']:
              print('DIAGNOSIS: BLITZ gateway or platform is unavailable; website changes cannot restart it.',flush=True)
          elif not outcomes['automation']:
              print('DIAGNOSIS: gateway is up but automation cue is missing. Check playlist.m3u, Icecast, Liquidsoap and library watcher inside BLITZ.',flush=True)
          elif not outcomes['public_radio']:
              print('DIAGNOSIS: automation cue is up but public mixer/stream is not. Check FFmpeg master, Icecast stream.mp3 mount and resource limits.',flush=True)
          else:
              print('DIAGNOSIS: public MP3 bytes reached GitHub runner. Investigate iPhone playback, CORS and browser behavior.',flush=True)
          if not outcomes['public_radio']:sys.exit(1)
          PY
      - name: Compare generic, Safari, and cross-origin MP3 requests
        if: always()
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, time
          base='https://radio.grandelement.blitz.cloud'
          origin='https://grandelement.com'
          ios='Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1'
          variants=[
            ('generic',{'Accept':'audio/mpeg,*/*'}),
            ('origin_only',{'Accept':'audio/mpeg,*/*','Origin':origin}),
            ('iphone_only',{'Accept':'audio/mpeg,*/*','User-Agent':ios}),
            ('iphone_origin',{'Accept':'audio/mpeg,*/*','User-Agent':ios,'Origin':origin}),
          ]
          for label,headers in variants:
              req=urllib.request.Request(base+'/stream.mp3',headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=12) as response:
                      data=response.read(256)
                      print('MP3',label,'HTTP',response.status,'MIME',
                        response.headers.get('Content-Type',''),'CORS',
                        repr(response.headers.get('Access-Control-Allow-Origin','')),
                        'bytes',len(data),flush=True)
              except urllib.error.HTTPError as e:
                  print('MP3',label,'HTTP',e.code,'MIME',
                    e.headers.get('Content-Type',''),'CORS',
                    repr(e.headers.get('Access-Control-Allow-Origin','')),flush=True)
              except Exception as e:
                  print('MP3',label,'ERROR',type(e).__name__,str(e)[:140],flush=True)
              time.sleep(.4)
          for path in ['/hls/radio.m3u8','/control/public-now','/healthz']:
              req=urllib.request.Request(base+path,headers={'Origin':origin,'User-Agent':ios})
              try:
                  with urllib.request.urlopen(req,timeout=12) as response:
                      data=response.read(256)
                      print(path,'HTTP',response.status,'MIME',
                        response.headers.get('Content-Type',''),'CORS',
                        repr(response.headers.get('Access-Control-Allow-Origin','')),
                        'bytes',len(data),flush=True)
              except urllib.error.HTTPError as e:
                  print(path,'HTTP',e.code,'MIME',e.headers.get('Content-Type',''),flush=True)
              except Exception as e:
                  print(path,'ERROR',type(e).__name__,str(e)[:140],flush=True)
          PY
      - name: Check Sun Lab FFT signal on live BLITZ gateway
        if: always()
        run: |
          python3 - <<'PY'
          import json, time, urllib.error, urllib.request, sys
          url='https://radio.grandelement.blitz.cloud/eq/spectrum.json'
          request=urllib.request.Request(url,headers={
            'User-Agent':'GE-Sun-Lab-ReadOnly-FFT-Check/1.0',
            'Origin':'https://grandelement.com',
            'Accept':'application/json'
          })
          try:
              with urllib.request.urlopen(request,timeout=12) as response:
                  raw=response.read(30000)
                  mime=response.headers.get('Content-Type','')
                  cors=response.headers.get('Access-Control-Allow-Origin','')
                  print('SUN LAB ENDPOINT:',response.status,'MIME:',mime,'CORS:',cors,'BYTES:',len(raw),flush=True)
                  payload=json.loads(raw)
              bins=payload.get('bins',[])
              fresh=abs(int(time.time()*1000)-int(payload.get('updated_ms') or 0))<2500
              valid=(isinstance(bins,list) and len(bins)==256 and
                     any(isinstance(x,(float,int)) and x>1 for x in bins))
              ready=payload.get('ready') is True
              good=ready and fresh and valid and cors in ('*','https://grandelement.com')
              print('SUN LAB SIGNAL:', 'LIVE' if good else 'UNAVAILABLE',
                    'READY:',ready,'FRESH:',fresh,'BINS:',len(bins) if isinstance(bins,list) else None,
                    'NONZERO:',valid,flush=True)
              if not good:
                  print('DIAGNOSIS: Website Safari EQ cannot receive valid fresh frequency data; check BLITZ backend deployment and spectrum-server service.',flush=True)
                  sys.exit(1)
          except urllib.error.HTTPError as error:
              print('SUN LAB ENDPOINT: HTTP',error.code,'FAILED: BLITZ server route not deployed or unavailable.',flush=True)
              sys.exit(1)
          except Exception as error:
              print('SUN LAB FFT FAILED:',type(error).__name__,str(error)[:200],flush=True)
              sys.exit(1)
          PY
