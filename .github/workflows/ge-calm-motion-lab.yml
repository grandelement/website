name: GE Calm Motion Lab
on:
  push:
    paths:
      - 'radio/motion-lab.html'
      - 'radio/ge-calm-motion.css'
      - 'tests/calm-motion-lab.test.mjs'
      - '.github/workflows/ge-calm-motion-lab.yml'
  pull_request:
    paths:
      - 'radio/motion-lab.html'
      - 'radio/ge-calm-motion.css'
      - 'tests/calm-motion-lab.test.mjs'
      - '.github/workflows/ge-calm-motion-lab.yml'
jobs:
  preview-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/calm-motion-lab.test.mjs
