name: GE Back Room — private Vault connection repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ge-backroom-private-vault-link.yml'
      - 'backroom/wrangler.toml'
      - 'backroom/publisher-worker.js'
      - 'tests/private-vault-binding.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

# Independent of older full Vault releases; this deploys only the already
# existing Back Room Publisher Worker and never changes D1 data or Vault secrets.
concurrency:
  group: ge-backroom-private-vault-link
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify private service binding, owner authentication, and LOVE listing
        run: node --experimental-default-type=module tests/private-vault-binding.test.mjs
      - name: Check Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID missing"; exit 1; }
      - name: Deploy only existing Back Room Publisher with private Vault service binding
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: backroom
          command: deploy
      - name: Verify production Publisher-to-Vault service binding
        run: |
          python3 - <<'PY'
          import json, time, urllib.request, urllib.error
          url='https://ge-backroom-publisher.grandelement.workers.dev/health'
          headers={'User-Agent':'GrandElement-PublisherHealthMonitor/1.0','Accept':'application/json','Origin':'https://grandelement.com'}
          for attempt in range(1,5):
              try:
                  req=urllib.request.Request(url,headers=headers)
                  with urllib.request.urlopen(req,timeout=15) as resp:
                      report=json.load(resp)
                  flags={key:report.get(key) for key in ('configured','vault_service_bound','vault_reachable','vault_access_codes_ready','access_codes_bridge_configured')}
                  print('Production publisher health:',flags,flush=True)
                  if all(value is True for value in flags.values()):
                      print('PASS: live Back Room Publisher can load the existing Vault Access Codes.')
                      break
              except Exception as err:
                  print('Publisher health attempt',attempt,'failed:',type(err).__name__,str(err)[:170],flush=True)
              if attempt==4:
                  raise SystemExit('FAIL: production Publisher-to-Vault bridge is not fully operational.')
              time.sleep(3)
          PY
      - name: Confirm deployment target
        run: |
          echo "Publisher: ge-backroom-publisher"
          echo "Private service binding: GE_VAULT -> ge-studios-vault"
          echo "Access code database, original LOVE record and master playlists unchanged by this deployment."
          echo "Owner Safari test: Back Room -> Access Codes -> Refresh; or public Publisher /health readiness flags."
