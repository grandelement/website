name: GE Back Room Publisher automatic deployment

# Prevent the browser UI being ahead of the save API. Only the Publisher is
# deployed; no Vault D1 migrations, radio relays or secrets are changed.
on:
  push:
    branches: [main]
    paths:
      - 'backroom/publisher-worker.js'
      - 'backroom/wrangler.toml'
      - '.github/workflows/backroom-publisher-auto-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ge-backroom-publisher-auto-deploy
  cancel-in-progress: false

jobs:
  publisher:
    name: Deploy and verify Back Room music save API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check Cloudflare deploy credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Deploy GE Back Room Publisher only
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backroom
          command: deploy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install actual-browser health probe
        run: npm install --no-save --ignore-scripts puppeteer-core@24
      - name: Verify deployed Publisher from the website browser origin
        run: |
          node --input-type=module <<'JS'
          import puppeteer from 'puppeteer-core';
          const browser=await puppeteer.launch({
            executablePath:'/usr/bin/google-chrome',headless:true,
            args:['--no-sandbox','--disable-setuid-sandbox']
          });
          try{
            const page=await browser.newPage();
            await page.goto('https://grandelement.com/',{waitUntil:'domcontentloaded',timeout:60000});
            const result=await page.evaluate(async()=>{
              const base='https://ge-backroom-publisher.grandelement.workers.dev';
              const output={};
              for(const [label,path] of [['health','/health'],['owner_save','/manage/public-settings']]){
                try{
                  const response=await fetch(base+path,{method:'GET',credentials:'omit',cache:'no-store'});
                  const data=await response.json().catch(()=>({}));
                  output[label]={http:response.status,ok:data.ok,configured:data.configured,
                    catalog_routing_api:data.catalog_routing_api,
                    error:String(data.error||'').slice(0,90)};
                }catch(error){output[label]={error:String(error?.message||error)}}
              }
              return output;
            });
            console.log('LIVE PUBLISHER BROWSER CHECK',JSON.stringify(result));
            if(result.health?.http!==200||result.health?.configured!==true||
               result.health?.catalog_routing_api!==2||
               result.owner_save?.http!==401||
               !/owner|sign.in/i.test(result.owner_save?.error||'')){
              throw Error('Publisher health or protected owner SAVE route was not verified from the real website origin.');
            }
            console.log('PASS: deployed Publisher and authenticated SAVE API reachable from public website browser; anonymous write access denied.');
          }finally{await browser.close()}
          JS
