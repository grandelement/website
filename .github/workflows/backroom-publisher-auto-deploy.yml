name: GE Back Room Publisher automatic deployment

# Prevent the browser UI being ahead of the save API. Only the Publisher is
# deployed; no Vault D1 migrations, radio relays or secrets are changed.
on:
  push:
    branches: [main]
    paths:
      - 'backroom/publisher-worker.js'
      - 'backroom/wrangler.toml'
      - '.github/workflows/backroom-publisher-auto-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ge-backroom-publisher-auto-deploy
  cancel-in-progress: false

jobs:
  publisher:
    name: Deploy and verify Back Room music save API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check Cloudflare deploy credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Deploy GE Back Room Publisher only
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backroom
          command: deploy
      - name: Verify the deployed playlist saving handler
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error, time
          url = 'https://ge-backroom-publisher.grandelement.workers.dev/health'
          last = None
          for attempt in range(6):
              try:
                  with urllib.request.urlopen(url,timeout=15) as response:
                      data = json.load(response)
                      if data.get('catalog_routing_api') == 2 and data.get('configured') is True and data.get('manifest_rebuild_available') is True:
                          print('Verified live catalog routing API version 2; save and manifest handlers deployed.')
                          break
                      last = 'Incorrect Publisher version or missing runtime credentials: '+str({k:data.get(k) for k in ('catalog_routing_api','configured','manifest_rebuild_available')})
              except urllib.error.HTTPError as e:
                  last = 'HTTP '+str(e.code)
              except (urllib.error.URLError, ValueError) as e:
                  last = type(e).__name__
              if attempt == 5:
                  raise SystemExit('Publisher deploy not verified: '+str(last))
              time.sleep(3)
          PY
