name: GE listener-only gate audio test
on:
  pull_request:
    paths:
      - 'radio-backend/personal-preview.py'
      - 'radio-backend/tests/test_listener_fade.py'
      - '.github/workflows/ge-listener-gate-fade.yml'
  workflow_dispatch:

jobs:
  encoded-gate-fade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check FFmpeg is installed
        run: ffmpeg -version | head -n 1
      - name: Decode actual 10-second listener-only fade
        run: python3 radio-backend/tests/test_listener_fade.py
