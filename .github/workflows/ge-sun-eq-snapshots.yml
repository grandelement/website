name: GE music-reactive Sun EQ
on:
  pull_request:
    paths:
      - 'radio/index.html'
      - 'radio/offline-spectrum.js'
      - 'scripts/build-ge-eq-snapshots.py'
      - 'tests/ge-sun-eq-static-spectrum.test.mjs'
      - '.github/workflows/ge-sun-eq-snapshots.yml'
  push:
    branches: [main]
    paths:
      - 'ge-music/music/**'
      - 'scripts/build-ge-eq-snapshots.py'
      - 'radio/offline-spectrum.js'
      - 'radio/index.html'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ge-sun-eq
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFT requirements
        run: |
          python -m pip install numpy
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Guard Radio playback and EQ routing
        run: |
          node tests/ge-sun-eq-static-spectrum.test.mjs
          node tests/ge-radio-standard-guard.test.mjs
      - name: Decode two real committed recordings
        run: python scripts/build-ge-eq-snapshots.py --check --limit 2

  publish-snapshots:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFT requirements
        run: |
          python -m pip install numpy
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Measure all published music
        run: python scripts/build-ge-eq-snapshots.py
      - name: Publish tiny JSON frequency maps, never audio
        run: |
          git add radio/eq-snapshots
          if git diff --cached --quiet; then
            echo "Frequency maps already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Auto-publish GE Sun Lab frequency maps"
          git pull --rebase origin main
          git push origin HEAD:main
