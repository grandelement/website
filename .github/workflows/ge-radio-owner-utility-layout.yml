name: GE Radio Owner Utility Layout
on:
  push:
    branches: [main]
    paths:
      - 'radio/index.html'
      - 'radio/ge-music-v5.js'
      - 'radio/sw.js'
      - 'tests/ge-radio-owner-utility-layout.test.mjs'
  pull_request:
    paths:
      - 'radio/index.html'
      - 'radio/ge-music-v5.js'
      - 'radio/sw.js'
      - 'tests/ge-radio-owner-utility-layout.test.mjs'
      - '.github/workflows/ge-radio-owner-utility-layout.yml'
jobs:
  owner-utility-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/ge-radio-owner-utility-layout.test.mjs
      - name: Install browser test client
        run: npm install --no-save --ignore-scripts puppeteer-core@24
      - name: Verify actual phone and desktop button placement and clicks
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ge-radio-owner-ui.log 2>&1 &
          node tests/ge-radio-owner-controls-browser.test.mjs
