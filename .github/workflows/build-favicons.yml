name: Build GE Favicons

on:
  push:
    paths:
      - ".github/workflows/build-favicons.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow

      - name: Preserve old icons and build Website + Radio icon sets
        run: |
          python - <<'PY'
          from PIL import Image, ImageEnhance, ImageFilter, ImageDraw
          from pathlib import Path
          import shutil, os

          ROOT=Path(".")
          backup=ROOT/"favicon-backup-2026-09-30"
          (backup/"website").mkdir(parents=True,exist_ok=True)
          (backup/"radio").mkdir(parents=True,exist_ok=True)

          old_root=["favicon.ico","favicon-16x16.png","favicon-32x32.png","apple-touch-icon.png"]
          old_radio=["radio/favicon.ico","radio/icons/favicon-16.png","radio/icons/favicon-32.png","radio/icons/favicon-48.png","radio/icons/apple-touch-icon.png","radio/icons/icon-192.png","radio/icons/icon-512.png","radio/icons/icon-maskable-512.png"]
          for p in old_root:
              src=ROOT/p
              if src.exists(): shutil.copy2(src,backup/"website"/src.name)
          for p in old_radio:
              src=ROOT/p
              if src.exists(): shutil.copy2(src,backup/"radio"/src.name)

          stars=Image.open("ge-images/images/stars backgrounds/1.jpeg").convert("RGB")
          sun=Image.open("backroom/backroom-sun.webp").convert("RGBA")
          ship=Image.open("ge-images/images/ge-logo-4-cutout.png").convert("RGBA")
          logo=Image.open("ge-images/images/ge-logo 3.png").convert("RGBA")

          def cover(im,size):
              w,h=im.size
              scale=max(size/w,size/h)
              r=im.resize((round(w*scale),round(h*scale)),Image.Resampling.LANCZOS)
              l=(r.width-size)//2;t=(r.height-size)//2
              return r.crop((l,t,l+size,t+size))

          def contain(im,w,h):
              x=im.copy()
              x.thumbnail((w,h),Image.Resampling.LANCZOS)
              return x

          def remove_white(im):
              p=im.load()
              for y in range(im.height):
                  for x in range(im.width):
                      r,g,b,a=p[x,y]
                      # Remove the original white circular field while retaining cyan/black GE.
                      if r>235 and g>235 and b>235:
                          p[x,y]=(r,g,b,0)
                      elif r>215 and g>215 and b>215:
                          na=max(0,int(a*(255-max(r,g,b))/40))
                          p[x,y]=(r,g,b,na)
              return im

          def make(kind):
              size=1024
              bg=cover(stars,size)
              bg=ImageEnhance.Brightness(bg).enhance(.72)
              canvas=bg.convert("RGBA")

              # Clean blue sun centered over the black star field.
              s=contain(sun,800,800)
              canvas.alpha_composite(s,((size-s.width)//2,(size-s.height)//2))

              mark=ship if kind=="website" else remove_white(logo.copy())
              mark=contain(mark,690 if kind=="website" else 610,560 if kind=="website" else 610)
              # Exact source mark, centered with no extra decorative line.
              canvas.alpha_composite(mark,((size-mark.width)//2,(size-mark.height)//2))

              # Keep artwork square; operating systems apply their own circle/rounded mask.
              return canvas.convert("RGB")

          sets={"website":make("website"),"radio":make("radio")}
          sizes=[16,32,48,64,96,128,144,150,180,192,256,512]
          for kind,master in sets.items():
              d=Path("icons") if kind=="website" else Path("radio/icons")
              d.mkdir(parents=True,exist_ok=True)
              for n in sizes:
                  out=master.resize((n,n),Image.Resampling.LANCZOS)
                  name={16:"favicon-16.png",32:"favicon-32.png",48:"favicon-48.png",180:"apple-touch-icon.png",192:"icon-192.png",512:"icon-512.png",150:"mstile-150.png"}.get(n,f"icon-{n}.png")
                  out.save(d/name,optimize=True)
              # Maskable Android icon with extra safe-area padding.
              inner=master.resize((410,410),Image.Resampling.LANCZOS)
              mask=Image.new("RGB",(512,512),"black")
              mask.paste(inner,(51,51))
              mask.save(d/"icon-maskable-512.png",optimize=True)

              # Multi-resolution legacy favicon.ico.
              ico_target=Path("favicon.ico") if kind=="website" else Path("radio/favicon.ico")
              master.save(ico_target,format="ICO",sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])

          # Compatibility filenames already used by older Website code/bookmarks.
          shutil.copy2("icons/favicon-16.png","favicon-16x16.png")
          shutil.copy2("icons/favicon-32.png","favicon-32x32.png")
          shutil.copy2("icons/apple-touch-icon.png","apple-touch-icon.png")
          PY

      - name: Commit generated favicon package
        run: |
          git config user.name "GE Studios favicon builder"
          git config user.email "grandelement@gmail.com"
          git add favicon.ico favicon-16x16.png favicon-32x32.png apple-touch-icon.png icons radio/favicon.ico radio/icons favicon-backup-2026-09-30
          git commit -m "Generate Website and Radio favicon packages" || exit 0
          git push
