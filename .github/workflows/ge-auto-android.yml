name: GE AUTO Android APK
on:
  pull_request:
    paths: ['ge-auto/**', '.github/workflows/ge-auto-android.yml']
  push:
    branches: ['feature/ge-auto-native', 'main']
    paths: ['ge-auto/**', '.github/workflows/ge-auto-android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify original GE assets and offline manifest
        run: |
          cmp ge-images/images/ge-logo-2.jpg ge-auto/app/src/main/res/drawable-nodpi/ge_sun.jpg
          cmp radio/icons/icon-192.png ge-auto/app/src/main/res/drawable-nodpi/ge_icon.png
          ! grep -q android.permission.INTERNET ge-auto/app/src/main/AndroidManifest.xml
      - name: Build installable test APK
        run: gradle -p ge-auto :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: GE-AUTO-test-APK
          path: ge-auto/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
