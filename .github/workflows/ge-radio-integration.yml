name: GE Radio integration regression
on:
  pull_request:
    paths:
      - 'radio/**'
      - 'sw.js'
      - '.github/workflows/ge-radio-integration.yml'
  push:
    branches: [main]
    paths:
      - 'radio/**'
      - 'sw.js'
      - '.github/workflows/ge-radio-integration.yml'
jobs:
  source-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Radio, Music, EQ, offline and mobile layout contracts
        run: node radio/tests/integration-smoke.mjs
