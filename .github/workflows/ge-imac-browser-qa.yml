name: GE iMac Upload V10 browser smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dj/imac.html'
      - 'dj/imac-workstation.js'
      - 'dj/imac-upload-settings.js'
      - 'dj/imac-workstation.css'
      - 'tests/ge-imac-browser.test.mjs'
      - '.github/workflows/ge-imac-browser-qa.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser client
        run: npm install --no-save --ignore-scripts puppeteer-core@24
      - name: Serve website locally
        run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ge-imac-static.log 2>&1 &
      - name: Verify upload, files, metadata and STATUS in browser
        run: node tests/ge-imac-browser.test.mjs
