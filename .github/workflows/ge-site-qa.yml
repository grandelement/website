name: GE Website Regression Checks

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "config/**"
      - "backroom/index.html"
      - "radio/**"
      - "radio-backend/**"
      - "Dockerfile.radio"
      - ".github/scripts/ge-personal-preview-qa.py"
      - "support/**"
      - ".github/scripts/ge-site-qa.mjs"
      - "tests/ge-safari-layout-mode.test.mjs"
      - "tests/ge-gate-accepted-code-animation.test.mjs"
      - ".github/workflows/ge-site-qa.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Check out Grand Element website
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile JS and check music, Gate, Store, I AM regression contracts
        run: node .github/scripts/ge-site-qa.mjs
      - name: Verify mobile default and Safari desktop/mobile user choice
        run: node tests/ge-safari-layout-mode.test.mjs
      - name: Verify every accepted Gate code animates Sun zoom and fade
        run: node tests/ge-gate-accepted-code-animation.test.mjs
      - name: Install FFmpeg for audible Gate fade verification
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - name: Verify iPhone personal listener FFmpeg fade and MP3 stream assembly
        run: python3 .github/scripts/ge-personal-preview-qa.py
