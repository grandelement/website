name: GE Vault — repair access-code storage (existing production D1)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ge-access-codes-d1-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ge-vault-access-code-storage
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: vault-worker
    steps:
      - uses: actions/checkout@v4
      - name: Confirm existing Cloudflare credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "::error::Missing Cloudflare API token"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::Missing Cloudflare account ID"; exit 1; }
      - name: Install Wrangler 4
        run: npm install -g wrangler@4
      - name: Apply additive migration only (no database replacement)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          wrangler d1 execute ge-studios-vault --remote --file=migrations/20261021_access_codes.sql
      - name: Verify four access-code tables on existing remote D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          wrangler d1 execute ge-studios-vault --remote --command='SELECT id FROM access_codes LIMIT 1;'
          wrangler d1 execute ge-studios-vault --remote --command='SELECT id FROM access_code_policy LIMIT 1;'
          wrangler d1 execute ge-studios-vault --remote --command='SELECT code_id FROM access_code_content LIMIT 1;'
          wrangler d1 execute ge-studios-vault --remote --command='SELECT code_id FROM access_code_deletions LIMIT 1;'
          echo 'PASS: all required access-code tables exist. Existing records untouched.'
