name: GE Access Codes — real production API audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ge-access-codes-production-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-access-codes:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check real authenticated Vault list from live Publisher (no records returned)
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          url='https://ge-backroom-publisher.grandelement.workers.dev/health?diagnose=access-codes'
          req=urllib.request.Request(url,headers={'User-Agent':'GrandElement-AccessCodesAudit/1.0','Accept':'application/json','Origin':'https://grandelement.com'})
          status=0; raw=b''
          try:
              with urllib.request.urlopen(req,timeout=20) as resp:
                  status=resp.status; raw=resp.read(10000)
          except urllib.error.HTTPError as err:
              status=err.code; raw=err.read(10000)
          report=json.loads(raw.decode('utf-8','replace'))
          fields=('ok','access_codes_readable','upstream_http_status','publisher_configured','vault_service_bound')
          print('ACTUAL PUBLISHER HTTP STATUS:',status,flush=True)
          print('ACTUAL ACCESS CODES READ STATUS:',{k:report.get(k) for k in fields},flush=True)
          if status!=200 or report.get('access_codes_readable') is not True:
              raise SystemExit('FAIL: actual production Access Codes listing does not work.')
          print('PASS: actual production Access Codes listing reachable through Publisher.')
          PY
