name: GE MUSIC exact selection regression
on:
  pull_request:
    paths:
      - 'radio/ge-music-v5.js'
      - 'radio/offline-manager.js'
      - 'tests/ge-music-exact-selection.test.mjs'
      - '.github/workflows/ge-music-exact-selection.yml'
  push:
    branches: [main]
    paths:
      - 'radio/ge-music-v5.js'
      - 'radio/offline-manager.js'
      - 'tests/ge-music-exact-selection.test.mjs'
      - '.github/workflows/ge-music-exact-selection.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate explicit song selection and download scope
        run: node --test tests/ge-music-exact-selection.test.mjs
