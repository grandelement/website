name: GE Playlist Sources — live public audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ge-playlist-sources-live-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Identify real GitHub and Vault playlist sources without authentication or modification
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error
          urls={
            'github':'https://raw.githubusercontent.com/grandelement/website/main/playlists/registry.json',
            'vault_dj':'https://vault.grandelement.com/v1/public/dj-playlists',
            'vault_music':'https://vault.grandelement.com/v1/public/music-playlists',
            'site_approval':'https://grandelement.com/config/site-live.json'
          }
          def check(name,url):
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'GrandElementPlaylistPublicAudit/1.0','Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=18) as response:
                status=response.status
                data=json.loads(response.read(750000).decode('utf-8'))
              if name=='github':items=data.get('playlists',[])
              elif name.startswith('vault'):items=data.get('items',[])
              else:items=[]
              names=[str(x.get('name','')) for x in items if isinstance(x,dict)]
              bangers=[{'id':str(x.get('id',''))[:100],
                        'track_count':len(x.get('songs',[]))}
                       for x in items if str(x.get('name','')).lower()=='bangers']
              print(name.upper(),'HTTP',status,'items',len(items),'names',names[:30],
                    'bangers',bangers,
                    'approved',data.get('music',{}).get('publicDJPlaylistNames') if name=='site_approval' else None,
                    flush=True)
              return bool(bangers)
            except Exception as e:
              print(name.upper(),'NOT REACHABLE',type(e).__name__,str(e)[:170],flush=True)
              return False
          results={key:check(key,url) for key,url in urls.items()}
          print('RESULT: authentic public Bangers record available:',results['github'] or results['vault_dj'] or results['vault_music'])
          print('This job never reads private DJ or fan records and never saves, deletes or imports playlists.')
          # Exact machine-readable PUBLIC Bangers source. Both Vault endpoints
          # must agree on the same original DJ ID and ordered 33 song paths.
          def get_public(endpoint):
            req=urllib.request.Request(endpoint,headers={'User-Agent':'GrandElementPlaylistPublicAudit/1.0','Accept':'application/json'})
            with urllib.request.urlopen(req,timeout=18) as response:
              return json.load(response)
          dj=get_public(urls['vault_dj'])
          music=get_public(urls['vault_music'])
          a=[p for p in dj.get('items',[]) if str(p.get('name','')).lower()=='bangers']
          b=[p for p in music.get('items',[]) if str(p.get('name','')).lower()=='bangers']
          if len(a)!=1 or len(b)!=1 or str(a[0].get('id'))!=str(b[0].get('id')) or a[0].get('songs')!=b[0].get('songs'):
            raise SystemExit('The two published Vault Bangers records do not match; do not import.')
          songs=a[0].get('songs')
          if not isinstance(songs,list) or len(songs)<3 or len(songs)>500 or len(set(songs))!=len(songs) or any(
            not isinstance(p,str) or not p.startswith('ge-music/music/') or '..' in p or
            not p.lower().endswith(('.mp3','.m4a','.wav','.ogg','.flac')) for p in songs):
            raise SystemExit('Invalid authentic Bangers paths; do not import.')
          print('BANGERS_ORIGINAL_SOURCE_JSON='+json.dumps(
            {'id':str(a[0]['id']),'name':str(a[0]['name']),'songs':songs},
            separators=(',',':')),flush=True)
          print('BANGERS_SOURCE_CROSSCHECK: PASS',flush=True)
          PY
