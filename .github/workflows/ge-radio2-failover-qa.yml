name: GE BLITZ Radio 1 only regression
on:
  pull_request:
    paths:
      - 'radio/index.html'
      - 'radio/website-live.js'
      - 'tests/radio2-failover.test.mjs'
      - '.github/workflows/ge-radio2-failover-qa.yml'
  push:
    branches: [main]
    paths:
      - 'radio/index.html'
      - 'radio/website-live.js'
      - 'tests/radio2-failover.test.mjs'
      - '.github/workflows/ge-radio2-failover-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-primary:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm original BLITZ is exclusive and manual retries remain
        run: node tests/radio2-failover.test.mjs
