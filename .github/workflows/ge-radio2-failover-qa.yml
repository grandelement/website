name: GE Radio 1 to Radio 2 Playback QA
on:
  pull_request:
    paths:
      - 'radio/index.html'
      - 'radio/sync-playlist.json'
      - 'tests/radio2-failover.test.mjs'
      - '.github/workflows/ge-radio2-failover-qa.yml'
  push:
    branches: [main]
    paths:
      - 'radio/index.html'
      - 'radio/sync-playlist.json'
      - 'tests/radio2-failover.test.mjs'
      - '.github/workflows/ge-radio2-failover-qa.yml'
permissions:
  contents: read
jobs:
  verify-failover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate Radio 2 compatibility, Gate and iPhone JavaScript
        run: node tests/radio2-failover.test.mjs
      - name: Confirm actual public audio bytes for backup rotation
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          with open('radio/sync-playlist.json') as f: clock=json.load(f)
          tracks=[t for t in clock['tracks'] if t.get('kind')=='song']
          assert len(tracks)>=3
          for item in (tracks[0],tracks[len(tracks)//2]):
              url=urllib.parse.urljoin('https://grandelement.com',item['url'])
              req=urllib.request.Request(url,headers={'User-Agent':'GrandElement-RadioQA/1.0','Range':'bytes=0-8191'})
              with urllib.request.urlopen(req,timeout=20) as response:
                  raw=response.read(8192)
                  print('MUSIC AUDIO',response.status,'bytes',len(raw),'content-type',response.headers.get('Content-Type',''),flush=True)
                  if response.status not in (200,206) or len(raw)<512 or raw.startswith(b'<!DOCTYPE html'):
                      raise SystemExit('Backup song did not yield valid audio bytes.')
          print('PASS: real backup music bytes available over public site')
          PY
