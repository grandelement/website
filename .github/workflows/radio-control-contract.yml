name: Radio control contract

on:
  push:
    paths:
      - "radio/index.html"
      - "radio/radio-base.css"
      - "radio/radio-components.css"
      - "radio/radio-layout.css"
      - "radio/player-button-effects.css"
      - "radio/player-mobile-fit.css"
      - "radio/check-control-contract.mjs"
      - "ge-accessibility.css"
      - ".github/workflows/radio-control-contract.yml"
  pull_request:
    paths:
      - "radio/index.html"
      - "radio/radio-base.css"
      - "radio/radio-components.css"
      - "radio/radio-layout.css"
      - "radio/player-button-effects.css"
      - "radio/player-mobile-fit.css"
      - "radio/check-control-contract.mjs"
      - "ge-accessibility.css"
      - ".github/workflows/radio-control-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control-sizes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify one Radio button sizing source and active-state wiring
        run: node radio/check-control-contract.mjs
