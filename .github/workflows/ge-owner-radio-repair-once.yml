name: GE Owner Radio Repair Deployment

# Runs only when this dedicated deployment workflow is first committed or deliberately edited.
# It leaves existing secrets, playlists, Vault data, and live radio queue unchanged.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ge-owner-radio-repair-once.yml

permissions:
  contents: read

concurrency:
  group: ge-studios-workers-production-deploy
  cancel-in-progress: false

jobs:
  deploy-dj-relay:
    name: Deploy corrected GE owner DJ relay
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out approved GE radio relay
        uses: actions/checkout@v4
      - name: Check Cloudflare deployment credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Deploy GE Radio DJ Relay with private Publisher service binding
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ge-radio-sync
          command: deploy
      - name: Verify deployed relay without exposing secrets
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, json, time
          url='https://ge-radio-sync.grandelement.workers.dev/v1/dj-health'
          for attempt in range(4):
              try:
                  with urllib.request.urlopen(url,timeout=15) as response:
                      status=response.status;data=json.load(response)
              except urllib.error.HTTPError as err:
                  status=err.code
                  try:data=json.load(err)
                  except ValueError:data={}
              except (urllib.error.URLError, ValueError) as err:
                  print('::warning::External DJ health probe unavailable; Wrangler deployment is authoritative:',type(err).__name__)
                  break
              print('DJ readiness:',status,json.dumps({k:data.get(k) for k in ('ok','publisher_service_bound','blitz_dj_secret_configured')},sort_keys=True))
              if status==200 and data.get('publisher_service_bound') and data.get('blitz_dj_secret_configured'):
                  print('DJ relay deployed with private Publisher binding and BLITZ DJ credential.')
                  break
              if status==403:
                  print('::warning::Edge denied GitHub runner readiness probe; result inconclusive, not a deployment failure.')
                  break
              if attempt==3:
                  raise SystemExit('DJ relay deployed but not ready. Check private Publisher service binding and BLITZ_DJ_PASSWORD.')
              time.sleep(3)
          PY
