name: GE Access Codes Simple Editor QA
on:
  pull_request:
    paths:
      - 'backroom/index.html'
      - 'tests/access-code-workbench.test.mjs'
      - '.github/workflows/ge-access-code-editor-qa.yml'
  push:
    branches: [main]
    paths:
      - 'backroom/index.html'
      - 'tests/access-code-workbench.test.mjs'
      - '.github/workflows/ge-access-code-editor-qa.yml'
permissions:
  contents: read
jobs:
  editor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate Access Codes editor JavaScript and control wiring
        run: node tests/access-code-workbench.test.mjs
      - name: Exercise checked playlist saving, revocation and stale source protection
        run: node tests/access-code-playlist-save.test.mjs
