name: GE BLITZ Radio 1 deployed frontend check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ge-radio2-live-verify.yml'
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ge-radio1-live-verification
  cancel-in-progress: true
jobs:
  verify:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify deployed public player selects only BLITZ Radio 1
        run: |
          python3 - <<'PY'
          import time, urllib.request
          url='https://grandelement.com/radio/?verify=radio1-only-20261030'
          for attempt in range(6):
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'GE-Radio1-Check/1'})
                  with urllib.request.urlopen(req,timeout=18) as resp:
                      html=resp.read().decode('utf-8','replace')
                  if ('const GE_RADIO2_DISABLED=true' in html
                      and "button.textContent='RADIO'" in html
                      and 'opacity:1!important;pointer-events:auto!important' in html
                      and 'void requestRadioStart({deferPlay:qrArrival});' in html):
                      print('PASS: deployed Radio page attempts BLITZ, keeps RADIO clickable, and disables Radio2.',flush=True)
                      break
                  print('Waiting for updated public Radio page',attempt+1,flush=True)
              except Exception as e:
                  print('Check interrupted',str(e)[:180],flush=True)
              if attempt==5:
                  raise SystemExit('FAIL: new Radio1-only frontend not confirmed on deployed website.')
              time.sleep(8)
          print('Audio autoplay and audible progress still require a browser/device test.',flush=True)
          PY
