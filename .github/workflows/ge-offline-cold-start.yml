name: GE OFFLINE Cold Start
on:
  pull_request:
    paths:
      - 'radio/sw.js'
      - 'radio/index.html'
      - 'radio/offline-manager.js'
      - 'radio/ge-music-v5.js'
      - 'radio/offline-spectrum.js'
      - 'radio/offline-home.html'
      - 'radio/manifest.webmanifest'
      - 'tests/ge-offline-cold-start-regression.test.mjs'
      - 'tests/ge-music-offline-engine.test.mjs'
      - '.github/workflows/ge-offline-cold-start.yml'
  push:
    branches: [main]
    paths:
      - 'radio/sw.js'
      - 'radio/index.html'
      - 'radio/offline-manager.js'
      - 'radio/ge-music-v5.js'
      - 'radio/offline-spectrum.js'
      - 'radio/offline-home.html'
      - 'radio/manifest.webmanifest'
      - 'tests/ge-offline-cold-start-regression.test.mjs'
      - 'tests/ge-music-offline-engine.test.mjs'
      - '.github/workflows/ge-offline-cold-start.yml'
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            radio/sw.js
            radio/index.html
            radio/offline-manager.js
            radio/ge-music-v5.js
            radio/offline-spectrum.js
            radio/offline-home.html
            radio/manifest.webmanifest
            tests/ge-offline-cold-start-regression.test.mjs
            tests/ge-music-offline-engine.test.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check radio/sw.js
      - run: node --check radio/offline-manager.js
      - run: node --check radio/ge-music-v5.js
      - run: node --check radio/offline-spectrum.js
      - run: node --check tests/ge-offline-cold-start-regression.test.mjs
      - run: node --test tests/ge-offline-cold-start-regression.test.mjs
      - run: node --test tests/ge-music-offline-engine.test.mjs
