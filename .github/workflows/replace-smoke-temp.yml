name: Replace Smoke master once

on:
  push:
    paths:
      - '.github/workflows/replace-smoke-temp.yml'

permissions:
  contents: write

jobs:
  replace:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download exact uploaded Smoke master
        shell: bash
        run: |
          set -euo pipefail
          target='ge-music/music/Grand Element - 2024 - Fire/Fire_06_Smoke.mp3'
          tmp="${RUNNER_TEMP}/Smoke.mp3"
          curl -L --fail --retry 3 --retry-delay 2 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-9860-81fd-be82-872754db41b6/raw?se=2026-10-07T23%3A33%3A41Z&sp=r&sv=2026-02-06&sr=b&scid=e75af246-f193-52b3-9c20-47867ba21ef4&skoid=b9a47e8b-72a2-4ed3-8028-a2a98c1a6142&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-07T23%3A03%3A44Z&ske=2026-10-08T23%3A03%3A44Z&sks=b&skv=2026-02-06&sig=mMXm2PRgF6q%2BwODaIU8cbLXcYWHh7yWls/h6gDujHYA%3D' -o "$tmp"
          echo 'cbf639c1228cb2924b5618f9cf84a43d08f871879b202af61d7425587251f7e7  '"$tmp" | sha256sum -c -
          mv "$tmp" "$target"
      - name: Commit replacement and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'ge-music/music/Grand Element - 2024 - Fire/Fire_06_Smoke.mp3'
          git rm '.github/workflows/replace-smoke-temp.yml'
          git commit -m 'Update Fire Smoke master'
          git push origin HEAD:main
