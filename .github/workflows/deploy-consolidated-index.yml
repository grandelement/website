name: Deploy consolidated GE index

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-consolidated-index.yml

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Build exact consolidated index
        run: python .github/scripts/deploy_consolidated.py

      - name: Commit consolidated index
        run: |
          git config user.name "GE Website Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Deploy consolidated GE website index"
          git push origin HEAD:main
