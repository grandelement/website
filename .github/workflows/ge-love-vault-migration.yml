name: GE LOVE — consolidate Radio Gate in Vault

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ge-love-vault-migration.yml'
      - 'vault-worker/src/index.js'
      - 'backroom/index.html'
      - 'backroom/publisher-worker.js'
      - 'radio/index.html'
      - 'tests/legacy-love-vault.test.mjs'
      - 'tests/private-vault-binding.test.mjs'
      - 'backroom/wrangler.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ge-studios-workers-production-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Verify LOVE migration, revocation and security
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Test LOVE migration with the real Vault route and mocked D1
        run: node --experimental-default-type=module tests/legacy-love-vault.test.mjs
      - name: Verify scoped Music code security is unaffected
        run: node --experimental-default-type=module tests/access-music-session.test.mjs
      - name: Verify private Worker service binding bypasses public Vault edge and loads LOVE
        run: node --experimental-default-type=module tests/private-vault-binding.test.mjs
  deploy:
    name: Deploy existing Vault and Back Room Workers
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Require Cloudflare deployment credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "::error::Cloudflare deployment token missing"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::Cloudflare account ID missing"; exit 1; }
      - name: Install Wrangler v4
        run: npm install -g wrangler@4
      - name: Deploy Vault then Back Room publisher, preserving existing D1 and secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          wrangler deploy --config vault-worker/wrangler.jsonc
          wrangler deploy --config backroom/wrangler.toml
          echo "Deployed publisher with private GE_VAULT service binding to ge-studios-vault."
          echo "Workers uploaded. Real owner/browser redemption still requires validation."
      - name: Verify production Vault and protected Back Room
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          def health(url):
              with urllib.request.urlopen(url, timeout=15) as response:
                  return json.load(response)
          # The public Vault custom domain has an edge WAF that blocks GitHub
          # runners. Probe D1 through the existing private GE_VAULT binding.
          back=health('https://ge-backroom-publisher.grandelement.workers.dev/health')
          if back.get('ok') is not True or back.get('configured') is not True or back.get('playlist_storage') != 'GITHUB' or back.get('github_playlists_endpoint') is not True:
              raise SystemExit('Back Room production configuration unavailable: '+str(back))
          if back.get('vault_service_bound') is not True or back.get('vault_reachable') is not True or back.get('vault_access_codes_ready') is not True:
              raise SystemExit('Vault private service binding or Access Codes D1 not ready: '+str(back))
          print('PASS: Back Room publisher, GitHub playlists and private Vault Access Codes D1 ready')
          for path in ('/manage/github-playlists','/manage/fan-access'):
              url='https://ge-backroom-publisher.grandelement.workers.dev'+path
              try:
                  with urllib.request.urlopen(url, timeout=15) as r:
                      raise SystemExit('SECURITY ERROR: '+path+' returned '+str(r.status)+' without owner authorization')
              except urllib.error.HTTPError as error:
                  if error.code != 401:
                      raise SystemExit('SECURITY ERROR: '+path+' returned '+str(error.code)+' instead of 401')
          print('PASS: private management routes reject anonymous callers')
          PY
