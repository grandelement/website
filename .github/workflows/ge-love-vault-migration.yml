name: GE LOVE — consolidate Radio Gate in Vault

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ge-love-vault-migration.yml'
      - 'vault-worker/src/index.js'
      - 'backroom/index.html'
      - 'backroom/publisher-worker.js'
      - 'radio/index.html'
      - 'tests/legacy-love-vault.test.mjs'
      - 'tests/private-vault-binding.test.mjs'
      - 'backroom/wrangler.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ge-studios-workers-production-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Verify LOVE migration, revocation and security
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Test LOVE migration with the real Vault route and mocked D1
        run: node --experimental-default-type=module tests/legacy-love-vault.test.mjs
      - name: Verify scoped Music code security is unaffected
        run: node --experimental-default-type=module tests/access-music-session.test.mjs
      - name: Verify private Worker service binding bypasses public Vault edge and loads LOVE
        run: node --experimental-default-type=module tests/private-vault-binding.test.mjs
  deploy:
    name: Deploy existing Vault and Back Room Workers
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Require Cloudflare deployment credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "::error::Cloudflare deployment token missing"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::Cloudflare account ID missing"; exit 1; }
      - name: Install Wrangler v4
        run: npm install -g wrangler@4
      - name: Deploy Vault then Back Room publisher, preserving existing D1 and secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          wrangler deploy --config vault-worker/wrangler.jsonc
          wrangler deploy --config backroom/wrangler.toml
          echo "Deployed publisher with private GE_VAULT service binding to ge-studios-vault."
          echo "Workers uploaded. Real owner/browser redemption still requires validation."
      - name: Verify D1 tables through authenticated Cloudflare API
        # Production deployment uses Workers write scope; optional D1 read
        # may be denied with Cloudflare 7403. Keep that failure visible here
        # without pretending the data was queried or failing a valid upload.
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Read only. Never create, migrate, overwrite, or print listener data.
          for table in playlists access_codes fan_code_links; do
            wrangler d1 execute ge-studios-vault --remote --config vault-worker/wrangler.jsonc --command="SELECT 1 FROM ${table} LIMIT 0" >/dev/null
            echo "PASS: permanent D1 table ${table} exists"
          done
          echo "PASS: Cloudflare D1 table verification completed without touching stored records"
      - name: Check public endpoints without treating WAF 403 as a failed upload
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error
          urls=['https://vault.grandelement.com/health',
                'https://ge-backroom-publisher.grandelement.workers.dev/health']
          for url in urls:
              try:
                  with urllib.request.urlopen(url,timeout=12) as r:
                      print('PUBLIC HEALTH',url,'HTTP',r.status)
              except urllib.error.HTTPError as e:
                  if e.code==403:
                      print('WARNING: public edge rejects GitHub runner with HTTP 403:',url)
                  else:
                      print('WARNING: public health check returned HTTP',e.code,url)
              except Exception as e:
                  print('WARNING: public health check unavailable:',url,type(e).__name__)
          print('Public edge checks are diagnostic only; successful Wrangler deploy and authenticated D1 checks are authoritative here.')
          PY
