name: GE Studios Workers — direct Cloudflare deploy

# Manual only. Deploys via GitHub Actions/Wrangler, not Cloudflare Builds.
# This workflow DOES NOT create/replace D1, run migrations, or modify secrets.
on:
  workflow_dispatch:
    inputs:
      service:
        description: Which production Worker should be deployed?
        required: true
        type: choice
        options:
          - vault
          - backroom
          - both

permissions:
  contents: read

concurrency:
  group: ge-studios-workers-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy selected GE Worker(s)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the approved repository revision
        uses: actions/checkout@v4

      - name: Check required deployment credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::error::Configure repository Actions secret CLOUDFLARE_API_TOKEN first."
            exit 1
          fi
          if [ -z "$CF_ACCOUNT" ]; then
            echo "::error::Configure repository Actions secret CLOUDFLARE_ACCOUNT_ID first."
            exit 1
          fi

      - name: Deploy GE Studios Vault Worker
        if: ${{ inputs.service == 'vault' || inputs.service == 'both' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: vault-worker
          command: deploy

      - name: Verify Vault Worker and permanent D1 playlist storage
        if: ${{ inputs.service == 'vault' || inputs.service == 'both' }}
        run: |
          python3 - <<'PY'
          import json, time, urllib.request, urllib.error
          url = 'https://vault.grandelement.com/health'
          response = None
          for attempt in range(5):
              try:
                  with urllib.request.urlopen(url, timeout=12) as r:
                      response = json.load(r)
                  break
              except (urllib.error.URLError, ValueError):
                  if attempt == 4:
                      raise
                  time.sleep(3)
          print('Vault health:', json.dumps(response, sort_keys=True))
          if response.get('ok') is not True or response.get('storage') != 'READY':
              raise SystemExit('Vault deployed, but D1 is not confirmed ready. Check D1 binding/migrations; do not initialize or overwrite the existing database.')
          if response.get('access_codes_ready') is not True:
              print('WARNING: Access-code tables are not confirmed. Review the additive migration before using codes.')
          PY

      - name: Deploy GE Back Room Publisher Worker
        if: ${{ inputs.service == 'backroom' || inputs.service == 'both' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backroom
          command: deploy

      - name: Verify Back Room Publisher
        if: ${{ inputs.service == 'backroom' || inputs.service == 'both' }}
        run: |
          python3 - <<'PY'
          import json, urllib.request
          url = 'https://ge-backroom-publisher.grandelement.workers.dev/health'
          with urllib.request.urlopen(url, timeout=15) as r:
              data = json.load(r)
          print('Publisher health:', json.dumps(data, sort_keys=True))
          if data.get('ok') is not True or data.get('configured') is not True:
              raise SystemExit('Publisher is online but required publisher credentials are not configured.')
          if data.get('playlist_storage') != 'GITHUB' or data.get('github_playlists_endpoint') is not True:
              raise SystemExit('Deployed Publisher does not have the GitHub playlist endpoint. Deploy current backroom/publisher-worker.js.')
          from urllib.error import HTTPError
          url = 'https://ge-backroom-publisher.grandelement.workers.dev/manage/github-playlists'
          try:
              urllib.request.urlopen(url, timeout=15)
              raise SystemExit('SECURITY ERROR: private playlist API returned success without owner authorization.')
          except HTTPError as e:
              if e.code != 401:
                  raise SystemExit(f'Github playlist API route check failed: expected 401 without login, received HTTP {e.code}')
          print('Verified: GitHub playlist route exists and is protected by owner session.')
          PY
