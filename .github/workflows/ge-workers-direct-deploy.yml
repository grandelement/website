name: GE Studios Workers — direct Cloudflare deploy

# Manual only. Deploys via GitHub Actions/Wrangler, not Cloudflare Builds.
# This workflow DOES NOT create/replace D1, run migrations, or modify secrets.
on:
  workflow_dispatch:
    inputs:
      service:
        description: Which production Worker should be deployed?
        required: true
        type: choice
        options:
          - vault
          - backroom
          - radio-relay
          - owner-services
          - both

permissions:
  contents: read

concurrency:
  group: ge-studios-workers-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy selected GE Worker(s)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the approved repository revision
        uses: actions/checkout@v4

      - name: Check required deployment credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::error::Configure repository Actions secret CLOUDFLARE_API_TOKEN first."
            exit 1
          fi
          if [ -z "$CF_ACCOUNT" ]; then
            echo "::error::Configure repository Actions secret CLOUDFLARE_ACCOUNT_ID first."
            exit 1
          fi

      - name: Deploy GE Studios Vault Worker
        if: ${{ inputs.service == 'vault' || inputs.service == 'both' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: vault-worker
          command: deploy

      - name: Verify Vault Worker and permanent D1 playlist storage
        if: ${{ inputs.service == 'vault' || inputs.service == 'both' }}
        run: |
          python3 - <<'PY'
          import json, time, urllib.request, urllib.error
          url = 'https://vault.grandelement.com/health'
          response = None
          for attempt in range(5):
              try:
                  with urllib.request.urlopen(url, timeout=12) as r:
                      response = json.load(r)
                  break
              except (urllib.error.URLError, ValueError):
                  if attempt == 4:
                      raise
                  time.sleep(3)
          print('Vault health:', json.dumps(response, sort_keys=True))
          if response.get('ok') is not True or response.get('storage') != 'READY':
              raise SystemExit('Vault deployed, but D1 is not confirmed ready. Check D1 binding/migrations; do not initialize or overwrite the existing database.')
          if response.get('access_codes_ready') is not True:
              print('WARNING: Access-code tables are not confirmed. Review the additive migration before using codes.')
          PY

      - name: Deploy GE Back Room Publisher Worker
        if: ${{ inputs.service == 'backroom' || inputs.service == 'both' || inputs.service == 'owner-services' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backroom
          command: deploy

      - name: Verify Back Room Publisher
        if: ${{ inputs.service == 'backroom' || inputs.service == 'both' || inputs.service == 'owner-services' }}
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          base = 'https://ge-backroom-publisher.grandelement.workers.dev'
          def check(path):
              try:
                  with urllib.request.urlopen(base+path, timeout=15) as response:
                      return response.status, json.load(response)
              except urllib.error.HTTPError as error:
                  try: data=json.load(error)
                  except (ValueError, UnicodeDecodeError): data={}
                  return error.code, data
          status, data = check('/health')
          if status == 403:
              print('::warning::Publisher health probe blocked by HTTP 403 from GitHub runner. This is INCONCLUSIVE; continue with DJ deployment. Test from the browser.')
          elif status != 200 or data.get('ok') is not True or data.get('configured') is not True:
              raise SystemExit('Publisher health failed: HTTP '+str(status)+', configured='+str(data.get('configured')))
          elif data.get('playlist_storage') != 'GITHUB' or data.get('github_playlists_endpoint') is not True:
              raise SystemExit('Publisher is missing GitHub playlist endpoint.')
          else:
              print('Publisher configured and GitHub playlist endpoint present.')
          playlist_status, _ = check('/manage/github-playlists')
          if playlist_status == 200:
              raise SystemExit('SECURITY ERROR: private playlist API accepted unauthenticated request.')
          if playlist_status == 401:
              print('Verified: GitHub playlist route denies unauthenticated access.')
          elif playlist_status == 403:
              print('::warning::Protected playlist check returned HTTP 403 from GitHub runner; authorization check INCONCLUSIVE. Continue DJ deployment.')
          else:
              raise SystemExit('Unexpected protected playlist response: HTTP '+str(playlist_status))
          PY

      - name: Deploy GE Radio DJ Relay
        if: ${{ inputs.service == 'radio-relay' || inputs.service == 'owner-services' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ge-radio-sync
          command: deploy

      - name: Check GE Access Codes readiness without reading private codes
        if: ${{ inputs.service == 'backroom' || inputs.service == 'both' || inputs.service == 'owner-services' }}
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          url='https://ge-backroom-publisher.grandelement.workers.dev/health?diagnose=access-codes'
          try:
              with urllib.request.urlopen(url, timeout=20) as r:
                  status=r.status; data=json.load(r)
          except urllib.error.HTTPError as e:
              status=e.code
              try: data=json.load(e)
              except (ValueError, UnicodeDecodeError): data={}
          except urllib.error.URLError as e:
              status=0;data={}
              print('::warning::Access Codes diagnostic unavailable:',str(e.reason))
          safe={k:data.get(k) for k in ('ok','access_codes_readable','upstream_http_status','publisher_configured','vault_service_bound')}
          print('Access Codes health HTTP',status,json.dumps(safe,sort_keys=True))
          if status==403:
              print('::warning::Access Codes check blocked from GitHub runner; result INCONCLUSIVE. Check in Back Room.')
          elif not data.get('access_codes_readable'):
              print('::warning::Access Codes need Vault/Publisher service binding, matching token or additive D1 migration. No codes were changed.')
          PY

      - name: Verify DJ relay private owner connection is configured
        if: ${{ inputs.service == 'radio-relay' || inputs.service == 'owner-services' }}
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error
          url='https://ge-radio-sync.grandelement.workers.dev/v1/dj-health'
          try:
              with urllib.request.urlopen(url, timeout=20) as r:
                  status=r.status;data=json.load(r)
          except urllib.error.HTTPError as e:
              status=e.code
              try:data=json.load(e)
              except (ValueError, UnicodeDecodeError):data={}
          except urllib.error.URLError as e:
              status=0;data={}
              print('::warning::DJ relay diagnostic unavailable:',str(e.reason))
          print('DJ relay readiness HTTP',status,json.dumps(data,sort_keys=True))
          if status==403:
              print('::warning::DJ relay probe blocked by HTTP 403 from GitHub runner; result INCONCLUSIVE. Verify from the browser.')
          elif status==0:
              print('::warning::DJ relay probe could not reach Cloudflare. Deployment status verified by Wrangler.')
          elif not (data.get('publisher_service_bound') and data.get('blitz_dj_secret_configured')):
              raise SystemExit('DJ relay is not ready: missing private Publisher binding or BLITZ_DJ_PASSWORD. Existing secrets were not changed.')
          PY
