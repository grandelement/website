name: GE Vault Access Codes Regression
on:
  pull_request:
    paths:
      - 'vault-worker/src/index.js'
      - 'tests/legacy-love-vault.test.mjs'
      - 'tests/access-music-session.test.mjs'
      - '.github/workflows/ge-vault-access-code-qa.yml'
  push:
    branches: [main]
    paths:
      - 'vault-worker/src/index.js'
      - 'tests/legacy-love-vault.test.mjs'
      - 'tests/access-music-session.test.mjs'
      - '.github/workflows/ge-vault-access-code-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  access-codes:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify LOVE owner-only creation, scopes, persistence and ordinary Music entitlements
        run: node tests/legacy-love-vault.test.mjs
      - name: Verify scoped Music sessions, use limits and forbidden content
        run: node tests/access-music-session.test.mjs
