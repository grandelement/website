name: GE Vault — repair Access Codes through bound D1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ge-access-codes-self-heal.yml'
      - 'vault-worker/src/index.js'
      - 'tests/legacy-love-vault.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

# Isolated one-time Vault repair. Existing database and Worker name retained.
# Does NOT call Cloudflare D1 management API (API token lacks D1 scope).
concurrency:
  group: ge-studios-workers-production-deploy
  cancel-in-progress: false

jobs:
  repair:
    name: Verify additive schema fallback and deploy existing Vault
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Verify missing D1 Access Codes tables self-create without overwriting records
        run: node --experimental-default-type=module tests/legacy-love-vault.test.mjs
      - name: Verify Music code security unchanged
        run: node --experimental-default-type=module tests/access-music-session.test.mjs
      - name: Require existing Cloudflare Worker deployment credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "::error::Cloudflare API token missing"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::Cloudflare account ID missing"; exit 1; }
      - name: Deploy existing GE Studios Vault only (no D1 API migration)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: vault-worker
          command: deploy
      - name: Verify live Access Codes schema through bound D1
        run: |
          python - <<'PY'
          import json, time, urllib.request, urllib.error
          url = 'https://vault.grandelement.com/health'
          headers = {
            'User-Agent': 'GrandElement-VaultHealthMonitor/1.0',
            'Accept': 'application/json'
          }
          for attempt in range(1, 6):
            try:
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=15) as resp:
                body = json.load(resp)
              if body.get('ok') is True and body.get('storage') == 'READY' and body.get('access_codes_ready') is True:
                print('PASS: live Vault D1 and Access Codes tables READY')
                break
              print('Health reported non-ready state:', body.get('storage'), body.get('access_codes_ready'))
            except Exception as error:
              print('Health probe attempt', attempt, 'failed:', type(error).__name__, str(error)[:180])
            if attempt == 5:
              raise SystemExit('Live Vault Access Codes readiness not confirmed; inspect Cloudflare access rules and D1 binding.')
            time.sleep(5)
          PY
      - name: Verify live LOVE all-access scopes and signed Music-session track
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error, time
          origin='https://vault.grandelement.com'
          def post(path,payload):
              req=urllib.request.Request(origin+path,data=json.dumps(payload).encode('utf-8'),
                headers={'User-Agent':'GrandElement-AllAccessChainCheck/1.0',
                         'Content-Type':'application/json','Origin':'https://grandelement.com'},
                method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=18) as resp:
                      return resp.status,json.load(resp)
              except urllib.error.HTTPError as err:
                  try: data=json.loads(err.read())
                  except Exception:data={'error':'Non-JSON rejection'}
                  return err.code,data
          for scope in ('radio','music','albums','website','games'):
              for attempt in range(4):
                  code,result=post('/v1/public/access/redeem',{'code':'LOVE','scope':scope})
                  if code==200 and result.get('ok') is True:
                      print('PASS: original LOVE authorizes',scope,flush=True)
                      break
                  if attempt==3:raise SystemExit('FAIL: historic LOVE did not authorize '+scope+' (HTTP '+str(code)+')')
                  time.sleep(3)
          code,result=post('/v1/public/access/music-session',{'code':'LOVE','action':'redeem'})
          if code!=200 or not result.get('token') or result.get('restricted') is not False:
              raise SystemExit('FAIL: LOVE cannot redeem unrestricted Music session.')
          code,result2=post('/v1/public/access/music-session',{
              'action':'verify','token':result['token'],
              'track_path':'ge-music/music/Grand Element - 2010 - Intergy/Intergy_02_Intergy.mp3'
          })
          if code!=200 or result2.get('authorized') is not True:
              raise SystemExit('FAIL: LOVE signed Music token cannot authorize a real album track.')
          print('PASS: original LOVE unlocks Music and its signed session authorizes tracks',flush=True)
          PY
      - name: Explain activation
        run: |
          echo "Vault code deployed with authenticated, idempotent table repair."
          echo "Back Room -> Access Codes -> Refresh triggers fixed-scope schema creation through bound D1."
          echo "Existing D1 data, code records, fan records, GitHub playlists, secrets, and Radio Bangers are preserved."
