name: GE BLITZ Radio 1 only browser smoke
on:
  pull_request:
    paths:
      - 'radio/index.html'
      - 'tests/radio-gate-boot.test.mjs'
      - 'tests/radio2-browser-smoke.mjs'
      - '.github/workflows/ge-radio2-browser-qa.yml'
  push:
    branches: [main]
    paths:
      - 'radio/index.html'
      - 'tests/radio2-browser-smoke.mjs'
      - '.github/workflows/ge-radio2-browser-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser automation client
        run: npm install --no-save --ignore-scripts puppeteer-core@24
      - name: Start local Radio website
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ge-radio-static.log 2>&1 &
      - name: Validate Gate startup
        run: node tests/radio-gate-boot.test.mjs
      - name: Verify only BLITZ on boot and repeated RADIO click during simulated 503
        run: node tests/radio2-browser-smoke.mjs
