name: GE Radio2 real browser playback smoke
on:
  pull_request:
    paths:
      - 'radio/index.html'
      - 'tests/radio-gate-boot.test.mjs'
      - 'tests/radio2-browser-smoke.mjs'
      - '.github/workflows/ge-radio2-browser-qa.yml'
  push:
    branches: [main]
    paths:
      - 'radio/index.html'
      - 'tests/radio-gate-boot.test.mjs'
      - 'tests/radio2-browser-smoke.mjs'
      - '.github/workflows/ge-radio2-browser-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Chrome is available
        run: |
          which google-chrome
          google-chrome --version
      - name: Install browser automation client (CI only)
        run: npm install --no-save --ignore-scripts puppeteer-core@24
      - name: Exercise branch radio HTML and ensure Gate boots before deployment
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ge-radio-static.log 2>&1 &
          node tests/radio-gate-boot.test.mjs
      - name: Exercise live Radio click, real Radio2 track and advancing audio
        run: node tests/radio2-browser-smoke.mjs
