name = "ge-radio-sync"
main = "worker.mjs"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
PROGRAM_URL = "https://grandelement.com/radio/sync-playlist.json"

[[durable_objects.bindings]]
name = "RADIO_TIMELINE"
class_name = "RadioTimeline"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RadioTimeline"]

# Set a separate secret on the free Worker:
# npx wrangler secret put GE_RADIO_SWITCH_TOKEN
# Never commit secret values or put this token in public JavaScript.

# GE iMac Studio private audio uploads. The upload API returns a clear
# configuration error until the following R2 bucket is created and bound.
# Do not uncomment before creating ge-audio-uploads in Cloudflare R2.
# The bucket must stay PRIVATE; drafts and finals are not radio playlist files.
#
# [[r2_buckets]]
# binding = "GE_AUDIO_UPLOADS"
# bucket_name = "ge-audio-uploads"
