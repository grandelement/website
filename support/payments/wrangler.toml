name = "ge-support-payments"
main = "worker.js"
compatibility_date = "2026-10-14"
workers_dev = true

# Fill in D1 binding only AFTER running "npx wrangler d1 create ge-support-orders".
# [[d1_databases]]
# binding = "DB"
# database_name = "ge-support-orders"
# database_id = "REPLACE_WITH_REAL_CLOUDFLARE_D1_DATABASE_ID"

# ALL activation flags fail closed by default. NEVER commit real API keys, secrets,
# wallet seed, wallet xpub, or private authentication data to this repository.
[vars]
PAYMENTS_ENABLED = "false"
DELIVERY_AUDITED = "false"
DIGITAL_DELIVERY_READY = "false"
RADIO_ACCESS_READY = "false"
MERCH_CHECKOUT_READY = "false"
COVER_LICENSE_VERIFIED = "false"
# Non-secret identifiers can be set here after provisioning:
# BTCPAY_URL = "https://pay.your-domain.example"
# BTCPAY_STORE_ID = "your_real_store_id"

# Use 'npx wrangler secret put BTCPAY_API_KEY' and
# 'npx wrangler secret put BTCPAY_WEBHOOK_SECRET' only after merchant setup.
