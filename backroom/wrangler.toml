name = "ge-backroom-publisher"
main = "publisher-worker.js"
compatibility_date = "2026-09-28"

[vars]
GITHUB_OWNER = "grandelement"
GITHUB_REPO = "website"
GITHUB_BRANCH = "main"

# Configure secrets with Cloudflare, never in this file:
# wrangler secret put BACKROOM_PASSWORD
# wrangler secret put SESSION_SECRET
# wrangler secret put GITHUB_TOKEN
#
# Recommended custom domain:
# backroom-api.grandelement.com

# For authenticated GE Vault playlist and access-code administration:
# wrangler secret put VAULT_ADMIN_TOKEN
# Configure this to match the Vault Worker's VAULT_ADMIN_TOKEN secret.
