name = "ge-backroom-publisher"
main = "publisher-worker.js"
compatibility_date = "2026-09-28"

# Private Worker-to-Worker routing. Avoids Cloudflare public WAF/1010 and
# worker self-fetch restrictions on public vault.grandelement.com.
[[services]]
binding = "GE_VAULT"
service = "ge-studios-vault"

[vars]
GITHUB_OWNER = "grandelement"
GITHUB_REPO = "website"
GITHUB_BRANCH = "main"

# Configure secrets with Cloudflare, never in this file:
# wrangler secret put BACKROOM_PASSWORD
# wrangler secret put SESSION_SECRET
# Preferred non-expiring GitHub App identity (see backroom/PUBLISHER.md):
# wrangler secret put GITHUB_APP_ID
# wrangler secret put GITHUB_APP_INSTALLATION_ID
# wrangler secret put GITHUB_APP_PRIVATE_KEY
# GITHUB_TOKEN is a TEMPORARY legacy PAT fallback only.
# Do not remove it until a real GitHub App write and readback succeed.
#
# Recommended custom domain:
# backroom-api.grandelement.com

# For authenticated GE Vault playlist and access-code administration:
# wrangler secret put VAULT_ADMIN_TOKEN
# Configure this to match the Vault Worker's VAULT_ADMIN_TOKEN secret.

# OWNER MUSIC UPLOAD — PRIVATE Cloudflare R2. Create the bucket first,
# then uncomment this binding and deploy. Do NOT make the bucket public.
# npx wrangler r2 bucket create ge-audio-uploads
#
# [[r2_buckets]]
# binding = "GE_AUDIO_UPLOADS"
# bucket_name = "ge-audio-uploads"
#
# Until this binding is configured, the Back Room upload endpoint returns
# an explicit 503 error and does NOT pretend any audio was uploaded.
